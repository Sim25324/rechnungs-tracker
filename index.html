let pdfjsPromise = null;
function getPdfjs(){
  if(!pdfjsPromise){
    pdfjsPromise = import('./vendor/pdfjs/pdf.min.mjs').then(mod=>{
      mod.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.mjs';
      return mod;
    });
  }
  return pdfjsPromise;
}
let tesseractWorkerPromise = null;
function getTesseractWorker(){
  if(!tesseractWorkerPromise){
    tesseractWorkerPromise = Tesseract.createWorker('deu', 1, {
      workerPath:'./vendor/tesseract/worker.min.js',
      corePath:'./vendor/tesseract/',
      langPath:'./vendor/tesseract/lang/',
      gzip:true,
    });
  }
  return tesseractWorkerPromise;
}
async function analyzePDF(file){
  const pdfjsLib = await getPdfjs();
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const allLines = [];
  for(let p=1; p<=doc.numPages; p++){
    const content = await (await doc.getPage(p)).getTextContent();
    let curY = null, curLine = [];
    for(const item of content.items){
      const y = Math.round(item.transform[5]);
      if(curY === null || Math.abs(y - curY) > 2){
        if(curLine.length) allLines.push(curLine.join(''));
        curLine = [item.str]; curY = y;
      } else curLine.push(item.str);
    }
    if(curLine.length) allLines.push(curLine.join(''));
  }
  return parseInvoiceText(allLines.join('\n'), allLines);
}
/* ==================================================================
   Bildvorverarbeitung vor der OCR.
   Handyfotos sind schief belichtet, zu gross und farbig – Tesseract
   arbeitet auf sauberem Graustufenbild mit gestrecktem Kontrast
   deutlich besser. Kostet Sekundenbruchteile, spart Fehlerkennungen.
   ================================================================== */
async function bildAufbereiten(file){
  try{
    const bmp = await createImageBitmap(file);
    /* Zielgroesse: lange Kante ~1800px. Kleinere Bilder werden hochskaliert
       (OCR braucht Mindesthoehe pro Zeichen), riesige heruntergerechnet. */
    const lang  = Math.max(bmp.width, bmp.height);
    const scale = Math.min(2.5, Math.max(0.4, 1800 / lang));
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);

    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently:true });
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bmp, 0, 0, w, h);
    if(bmp.close) bmp.close();

    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;

    /* 1. Graustufen, dabei Histogramm fuer die Kontrastspreizung sammeln */
    const hist = new Uint32Array(256);
    for(let i = 0; i < d.length; i += 4){
      const g = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;
      d[i] = d[i+1] = d[i+2] = g;
      hist[g]++;
    }
    /* 2. Perzentile statt Min/Max – robust gegen einzelne dunkle Pixel */
    const gesamt = w * h;
    let lo = 0, hi = 255, acc = 0;
    for(let i = 0; i < 256; i++){ acc += hist[i]; if(acc > gesamt * 0.02){ lo = i; break; } }
    acc = 0;
    for(let i = 255; i >= 0; i--){ acc += hist[i]; if(acc > gesamt * 0.02){ hi = i; break; } }
    const spanne = Math.max(1, hi - lo);

    /* 3. Kontrast strecken und leicht anheben */
    for(let i = 0; i < d.length; i += 4){
      let v = (d[i] - lo) / spanne * 255;
      v = v < 0 ? 0 : v > 255 ? 255 : v;
      v = v < 128 ? v * 0.85 : 255 - (255 - v) * 0.85;   // Schwarz dunkler, Weiss heller
      d[i] = d[i+1] = d[i+2] = v | 0;
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }catch(err){
    console.warn('Vorverarbeitung übersprungen:', err);
    return null;
  }
}

async function analyzeImage(file){
  const worker  = await getTesseractWorker();
  const quelle  = (await bildAufbereiten(file)) || (await fileToDataURL(file));
  const { data } = await worker.recognize(quelle);
  const text = data.text || '';
  return parseInvoiceText(text, text.split('\n'));
}
function normalizeAmount(raw){
  raw = String(raw).trim();
  if(raw.includes(',')) raw = raw.replace(/\./g,'').replace(',', '.');
  else if(/\.\d{1,2}$/.test(raw)){ /* bereits Dezimalpunkt */ }
  else raw = raw.replace(/\./g,'');
  return parseFloat(raw);
}

/* ==================================================================
   BETRAG – gewichtet statt "erster Treffer".
   Der erste Euro-Betrag auf einer Honorarnote ist fast nie die Summe,
   sondern ein Einzelposten. Deshalb werden alle Kandidaten gesammelt
   und nach Umfeld bewertet: Summenwoerter zaehlen stark positiv,
   Zwischensummen und Steuerzeilen negativ, unten im Dokument leicht
   positiv. Erst dann wird ausgewaehlt.
   ================================================================== */
const AMOUNT_RE = /(?:€|EUR)\s*(\d{1,3}(?:[.\s]\d{3})*(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)|(\d{1,3}(?:[.\s]\d{3})*(?:[.,]\d{1,2})?|\d+[.,]\d{1,2})\s*(?:€|EUR)/gi;
/* Rueckfallebene ohne Waehrungszeichen: viele Honorarnoten/Tabellen
   nennen "EUR" nur einmal in der Spaltenueberschrift und schreiben
   jeden Betrag darunter nackt hin. Nur der eindeutige oesterreichische
   Kommastil (Komma + genau zwei Nachkommastellen) zaehlt hier als
   Kandidat – ein blosses "20" waere zu leicht mit einer Menge, einem
   Datum oder einer Belegnummer zu verwechseln. */
const AMOUNT_BARE_RE = /\b(\d{1,3}(?:[.\s]\d{3})*,\d{2}|\d+,\d{2})\b/g;
function extractAmount(text, lines){
  const zeilen = (lines && lines.length ? lines : String(text||'').split(/\r?\n/)).map(z=> String(z||''));
  const kandidaten = [];

  zeilen.forEach((z, i)=>{
    const l = z.toLowerCase();
    let score = 0;
    if(/gesamtbetrag|rechnungsbetrag|endbetrag|zahlbetrag|zu\s*zahlen|gesamtsumme|honorar\s*gesamt|rechnungssumme|zu\s*bezahlen|offener\s*betrag/.test(l)) score += 10;
    else if(/\bsumme\b|\bgesamt\b|\btotal\b|\bbetrag\b/.test(l))                                     score += 5;
    if(/zwischensumme|netto|mwst|ust\b|umsatzsteuer|steuer|rabatt|skonto|anzahlung|guthaben|übertrag/.test(l)) score -= 8;
    if(/rezeptgebühr|selbstbehalt|einzelpreis|stück|packung/.test(l))                                 score -= 4;
    if(/erstatt|rückersatz|refund|kassenanteil/.test(l))                                              score -= 6;
    score += Math.round((i / Math.max(1, zeilen.length)) * 3);   // weiter unten = eher Summe

    let m, getroffen = false;
    AMOUNT_RE.lastIndex = 0;
    while((m = AMOUNT_RE.exec(z)) !== null){
      const n = normalizeAmount(m[1] || m[2]);
      if(isNaN(n) || n <= 0 || n >= 100000) continue;
      kandidaten.push({ n, score });
      getroffen = true;
    }
    /* Erst wenn diese Zeile keinen Euro-markierten Betrag hatte, den
       waehrungslosen Kandidaten probieren – leicht abgewertet, damit
       ein echter Euro-Treffer bei Gleichstand immer den Vorzug hat. */
    if(!getroffen){
      AMOUNT_BARE_RE.lastIndex = 0;
      while((m = AMOUNT_BARE_RE.exec(z)) !== null){
        const n = normalizeAmount(m[1]);
        if(isNaN(n) || n <= 0 || n >= 100000) continue;
        kandidaten.push({ n, score: score - 1 });
      }
    }
  });

  if(!kandidaten.length) return null;
  const maxScore = Math.max(...kandidaten.map(k=> k.score));
  /* Bei Gleichstand der groesste Betrag – die Summe ist nie kleiner als ihre Posten. */
  return kandidaten.filter(k=> k.score === maxScore).reduce((a,b)=> b.n > a.n ? b : a).n;
}

/* ==================================================================
   DATUM – Label schlaegt Position, Plausibilitaet schlaegt beides.
   Ein Beleg enthaelt Druckdatum, Faelligkeit, Geburtsdatum und
   Leistungsdatum. Gesucht ist das Leistungsdatum.
   ================================================================== */
const MONATE = { jan:1,feb:2,mär:3,mae:3,mar:3,apr:4,mai:5,jun:6,jul:7,aug:8,sep:9,okt:10,nov:11,dez:12 };
function alsISO(d, m, y){
  if(String(y).length === 2) y = (Number(y) > 70 ? '19' : '20') + y;
  const dd = Number(d), mm = Number(m), yy = Number(y);
  if(mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;
  const iso = `${String(yy).padStart(4,'0')}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  const jetzt = new Date(), jahr = jetzt.getFullYear();
  if(yy < jahr - 8 || yy > jahr + 1) return null;                       // unplausibel
  if(new Date(iso) > new Date(Date.now() + 2*86400000)) return null;    // Zukunft
  return iso;
}
function datumKandidaten(zeile){
  const out = [];
  let m;
  const re1 = /(\d{1,2})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{2,4})/g;
  while((m = re1.exec(zeile)) !== null){ const iso = alsISO(m[1],m[2],m[3]); if(iso) out.push(iso); }
  const re2 = /(\d{4})-(\d{2})-(\d{2})/g;
  while((m = re2.exec(zeile)) !== null){ const iso = alsISO(m[3],m[2],m[1]); if(iso) out.push(iso); }
  const re3 = /(\d{1,2})\.?\s*([A-Za-zä]{3,9})\.?\s*(\d{4})/g;
  while((m = re3.exec(zeile)) !== null){
    const mo = MONATE[m[2].slice(0,3).toLowerCase()];
    if(mo){ const iso = alsISO(m[1], mo, m[3]); if(iso) out.push(iso); }
  }
  return out;
}
function extractDate(text, lines){
  const zeilen = (lines && lines.length ? lines : String(text||'').split(/\r?\n/));
  const treffer = [];
  zeilen.forEach(z=>{
    const l = String(z||'').toLowerCase();
    let score = 0;
    if(/leistungsdatum|behandlungsdatum|datum der (leistung|behandlung)|leistungszeitraum|therapiedatum/.test(l)) score += 10;
    else if(/rechnungsdatum|rechnung vom|beleg vom|ausstellungsdatum/.test(l)) score += 6;
    else if(/\bdatum\b|\bam\b/.test(l)) score += 2;
    if(/geburt|geb\.|geboren|gültig bis|fällig|zahlbar bis|valuta|druckdatum/.test(l)) score -= 8;
    datumKandidaten(String(z||'')).forEach(iso=> treffer.push({ iso, score }));
  });
  if(!treffer.length) return null;
  const max = Math.max(...treffer.map(t=> t.score));
  /* Bei Gleichstand das aelteste – das Leistungsdatum liegt vor dem Druckdatum. */
  return treffer.filter(t=> t.score === max).map(t=> t.iso).sort()[0];
}

/* ==================================================================
   AUSSTELLER – Zeilen bewerten statt die erste nehmen.
   ================================================================== */
function extractIssuer(lines){
  const zeilen = (lines||[]).map(l=> String(l||'').trim()).filter(Boolean).slice(0,25);
  let best = null, bestScore = -99;
  zeilen.forEach((z, i)=>{
    if(z.length < 4 || z.length > 90) return;
    let score = 0;
    if(/^(Dr\.|DDr\.|Dipl|Mag\.|Prim\.|Univ|Doz\.|OA\b|MR\b|Prof\.)/i.test(z)) score += 10;
    if(/apotheke|ordination|zahnarzt|arztpraxis|institut|labor|ambulatorium|therapiezentrum|physiotherapie/i.test(z)) score += 8;
    if(/\b(fach)?arzt|ärztin|facharzt für|allgemeinmedizin|zahnmedizin/i.test(z)) score += 5;
    if(/gmbh|og\b|kg\b|e\.u\.|verein/i.test(z)) score += 2;
    /* Was sicher nicht der Aussteller ist */
    if(/honorarnote|rechnung|beleg|seite \d|uid|atu\d|iban|bic|tel\.|telefon|e-?mail|www\.|@|\d{4}\s+\w+straße|steuernummer|kundennummer/i.test(z)) score -= 10;
    if(/^\d/.test(z)) score -= 4;
    score += Math.max(0, 4 - i);                       // oben im Dokument bevorzugt
    if(score > bestScore){ bestScore = score; best = z; }
  });
  return bestScore > 0 ? best.replace(/\s{2,}/g,' ').slice(0,80) : (zeilen[0]||'').slice(0,80);
}

function extractRechnungsnr(text){
  const m = String(text||'').match(/(?:Rechnungs-?\s?(?:nummer|nr)\.?|Beleg-?\s?Nr\.?|Honorarnote\s*Nr\.?|Faktura\s*Nr\.?)\s*:?\s*([A-Za-z0-9][A-Za-z0-9\/\-.]{1,24})/i);
  return m ? m[1].replace(/[.\-]$/,'') : '';
}
function extractIBAN(text){
  const m = String(text||'').replace(/\s+/g,' ')
    .match(/\b([A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){2,7}(?:\s?[A-Z0-9]{1,4})?)\b/);
  return m ? m[1].replace(/\s+/g,'') : '';
}

/* ==================================================================
   ERSTATTUNGSBETRAG aus einem Bescheid.
   Anderes Ziel als extractAmount(): Dort wird die Rechnungssumme
   gesucht, hier der Betrag, der tatsaechlich ueberwiesen wurde. Auf
   einem ÖGK-Bescheid stehen beide nebeneinander – der eingereichte
   Rechnungsbetrag und der (kleinere) Erstattungsbetrag. Wer die
   Wortgewichtung von extractAmount() nimmt, faengt zuverlaessig den
   falschen davon ein, weil dort "Gesamtbetrag" stark positiv zaehlt.

   Deshalb eigene Gewichtung: Auszahlungs- und Erstattungswoerter
   zaehlen positiv, die eingereichte Rechnung negativ. Ohne einen
   klaren Treffer wird bewusst nichts geliefert – ein falsch
   vorausgefuellter Erstattungsbetrag ist schlimmer als ein leeres
   Feld, weil er still in Eigenanteil und Quote einfliesst.
   ================================================================== */
function extractErstattung(text, lines){
  const zeilen = (lines && lines.length ? lines : String(text||'').split(/\r?\n/)).map(z=> String(z||''));
  const kandidaten = [];

  zeilen.forEach(z=>{
    const l = z.toLowerCase();
    let score = 0;
    /* Das ist der Betrag, der beim Versicherten ankommt */
    if(/überweisungsbetrag|auszahlungsbetrag|zur anweisung|angewiesen|überwiesen|auszahlung|wir erstatten|erstattungsbetrag|ersatzbetrag|kostenerstattung|vergütungsbetrag/.test(l)) score += 10;
    else if(/erstattet|erstattung|rückersatz|rückerstattung|gutschrift|leistung(?:sbetrag)?\b/.test(l))                                                                    score += 6;
    /* Das ist die eingereichte Rechnung, nicht die Erstattung */
    if(/eingereicht|rechnungsbetrag|honorarnote|gesamtbetrag der rechnung|beantragt|vorgelegt/.test(l))                                                                     score -= 9;
    /* Abzuege und Selbstbehalte sind Teilbetraege, nicht die Summe */
    if(/selbstbehalt|abzug|abgezogen|nicht erstattet|abgelehnt|kürzung|gekürzt|rezeptgebühr/.test(l))                                                                       score -= 7;
    if(/mwst|ust\b|umsatzsteuer|zwischensumme|versicherungsnummer|vertragsnummer/.test(l))                                                                                  score -= 5;

    if(score <= 0) return;   // nur Zeilen mit echtem Erstattungssignal

    let m;
    AMOUNT_RE.lastIndex = 0;
    let getroffen = false;
    while((m = AMOUNT_RE.exec(z)) !== null){
      const n = normalizeAmount(m[1] || m[2]);
      if(isNaN(n) || n <= 0 || n >= 100000) continue;
      kandidaten.push({ n, score }); getroffen = true;
    }
    if(!getroffen){
      AMOUNT_BARE_RE.lastIndex = 0;
      while((m = AMOUNT_BARE_RE.exec(z)) !== null){
        const n = normalizeAmount(m[1]);
        if(isNaN(n) || n <= 0 || n >= 100000) continue;
        kandidaten.push({ n, score: score - 1 });
      }
    }
  });

  if(!kandidaten.length) return null;
  const max = Math.max(...kandidaten.map(k=> k.score));
  /* Schwache Treffer verwerfen: lieber nichts vorausfuellen als falsch. */
  if(max < 6) return null;
  /* Bei Gleichstand der groesste Betrag – Teilpositionen stehen oft daneben. */
  return kandidaten.filter(k=> k.score === max).reduce((a,b)=> b.n > a.n ? b : a).n;
}

/* Welche Leistungstoepfe nennt dieser Text?
   Dieselben Suchbegriffe, die schon die Polizzen-Analyse benutzt –
   nur andersherum angewendet: dort auf die Polizze, hier auf den
   Beleg. Ergebnis sind Katalog-Schluessel, keine Betraege.
   Wird an der Rechnung mitgespeichert, weil der OCR-Volltext selbst
   nicht persistiert wird (zu gross fuer IndexedDB bei vielen Belegen). */
function erkenneToepfe(text){
  const t = String(text||'').toLowerCase();
  if(!t.trim()) return [];
  return LEISTUNGS_KATALOG
    .filter(k=> k.such.length && k.such.some(s=> t.includes(s)))
    .map(k=> k.key);
}

function parseInvoiceText(text, lines){
  return {
    amount:      extractAmount(text, lines),
    date:        extractDate(text, lines),
    issuer:      extractIssuer(lines),
    rechnungsnr: extractRechnungsnr(text),
    iban:        extractIBAN(text),
    erstattung:  extractErstattung(text, lines),
    topfKeys:    erkenneToepfe(text),
    rawText:     text,
  };
}
/* ==================================================================
   QR-Code auf dem Beleg ("Zahlen mit Code", EPC069-12 / Stuzza).
   Liefert Betrag, Empfaenger und Referenz exakt statt geraten.
   Faellt still auf OCR zurueck, wenn kein Code da ist oder die
   BarcodeDetector-API fehlt (z. B. Firefox, aeltere Systeme).
   ================================================================== */
function parseEPC(raw){
  const l = String(raw).split(/\r?\n/);
  if((l[0]||'').trim().toUpperCase() !== 'BCD') return null;
  const m = (l[7]||'').trim().match(/^EUR\s*([\d.]+)$/i);
  const amount = m ? parseFloat(m[1]) : null;
  return {
    creditor : (l[5]||'').trim(),
    iban     : (l[6]||'').trim(),
    amount   : (amount && amount > 0 && amount < 100000) ? amount : null,
    reference: (l[9]||'').trim() || (l[10]||'').trim(),
  };
}
async function qrCapable(){
  if(!('BarcodeDetector' in window)) return false;
  try{ return (await BarcodeDetector.getSupportedFormats()).includes('qr_code'); }
  catch(e){ return false; }
}
async function pdfFirstPageCanvas(file){
  const pdfjsLib = await getPdfjs();
  const doc  = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const page = await doc.getPage(1);
  const vp   = page.getViewport({ scale:2 });   // 2x: kleine QR-Codes bleiben lesbar
  const canvas = document.createElement('canvas');
  canvas.width = vp.width; canvas.height = vp.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  return canvas;
}
async function scanPaymentQR(file){
  try{
    if(!await qrCapable()) return null;
    let source;
    if(file.type === 'application/pdf')            source = await pdfFirstPageCanvas(file);
    else if(file.type.startsWith('image/'))        source = await createImageBitmap(file);
    else return null;

    const codes = await new BarcodeDetector({ formats:['qr_code'] }).detect(source);
    if(source.close) source.close();
    for(const c of codes){
      const p = parseEPC(c.rawValue);
      if(p && (p.amount != null || p.creditor)) return p;
    }
  }catch(err){ console.warn('QR-Erkennung übersprungen:', err); }
  return null;
}

/* ==================================================================
   Was ist das ueberhaupt fuer ein Dokument?
   Wird beim Teilen aus einer fremden App gebraucht: Eine Honorarnote,
   ein Kontoauszug und ein ÖGK-Bescheid sehen fuer die App sonst gleich
   aus. Bewusst nur Stichwortgewichtung – kein Modell, keine Cloud.
   ================================================================== */
function klassifiziere(text){
  const t = String(text||'').toLowerCase();
  if(t.length < 20) return { kind:'rechnung', score:0, sicher:false };
  const s = { rechnung:0, zahlungsnachweis:0, oegk_bescheid:0 };
  const hit = (re, k, w) => { if(re.test(t)) s[k] += w; };

  /* ÖGK-Bescheid – Absender und Vorgangsworte */
  hit(/österreichische gesundheitskasse|\bögk\b|gesundheitskasse/, 'oegk_bescheid', 4);
  hit(/kostenerstattung|erstattungsmitteilung|leistungsinformation|mitteilung über/, 'oegk_bescheid', 3);
  hit(/wir haben (ihnen|für sie)|zur anweisung gebracht|überwiesen wurde/, 'oegk_bescheid', 2);
  hit(/ablehnung|abgelehnt|keine kostenerstattung|nicht erstattet/, 'oegk_bescheid', 2);
  hit(/versicherungsnummer|sozialversicherungsnummer/, 'oegk_bescheid', 1);

  /* Zahlungsnachweis – Bank- und Buchungssprache */
  hit(/kontoauszug|umsatzliste|umsatzübersicht|buchungsbestätigung/, 'zahlungsnachweis', 4);
  hit(/zahlungsbestätigung|überweisungsbestätigung|einzahlungsbeleg|zahlungsbeleg/, 'zahlungsnachweis', 4);
  hit(/auftraggeber|empfänger.*iban|valuta|buchungstag|umsatz\b/, 'zahlungsnachweis', 2);
  hit(/betrag dankend erhalten|bezahlt am|zahlungseingang|saldo/, 'zahlungsnachweis', 2);

  /* Rechnung – Rechnungssprache */
  hit(/honorarnote|rechnungsnummer|rechnungs-?nr|beleg-?nr/, 'rechnung', 4);
  hit(/leistungsdatum|behandlungsdatum|ordination|apotheke|zahnarzt/, 'rechnung', 2);
  hit(/zu zahlen|gesamtbetrag|rechnungsbetrag|endbetrag|zahlbar/, 'rechnung', 2);
  hit(/uid-?nr|steuernummer|mwst|ust\b/, 'rechnung', 1);

  const best = Object.keys(s).reduce((a,b)=> s[a] >= s[b] ? a : b);
  return { kind: s[best] > 0 ? best : 'rechnung', score: s[best], sicher: s[best] >= 4, alle: s };
}

/* ==================================================================
   Welcher Erstattungsweg ist das?
   Das Dropdown "Art des Belegs" musste der Nutzer bisher bei JEDER
   Rechnung selbst bedienen, obwohl der Beleg die Antwort mitbringt.
   Falsch gesetzt verschiebt es den ganzen weiteren Ablauf: beim
   Kassenrezept gibt es gar keinen ÖGK-Schritt, beim Wahlarzt schon.

   Bewusst dieselbe Machart wie klassifiziere(): Stichwortgewichtung,
   kein Modell. Bei Gleichstand oder schwacher Lage wird nichts
   geliefert – dann bleibt die Vorauswahl stehen.
   ================================================================== */
function erkenneWeg(text){
  const t = String(text||'').toLowerCase();
  if(t.length < 20) return null;
  const s = { wahlarzt:0, kassenrezept:0, privatrezept:0 };

  /* Die Rezeptgebuehr ist das eindeutigste Signal ueberhaupt: sie faellt
     nur an, wenn die Kasse ihren Teil schon getragen hat. */
  if(/rezeptgeb(ü|ue)hr/.test(t))                                   s.kassenrezept += 10;
  if(/kassenrezept|kassenzeichen|e-?card|sozialversicherung/.test(t)) s.kassenrezept += 3;

  /* Wahlarzt: Honorarnote ist der stehende Begriff fuer die Arztrechnung. */
  if(/honorarnote|honorar\b/.test(t))                                s.wahlarzt += 9;
  if(/ordination|wahlarzt|facharzt|ärztin|arztpraxis|befund|konsultation|behandlung/.test(t)) s.wahlarzt += 4;
  if(/zahnarzt|zahnmedizin|physiotherapie|psychotherapie/.test(t))   s.wahlarzt += 3;

  /* Apotheke ohne Rezeptgebuehr heisst: selbst voll bezahlt. */
  const apotheke = /apotheke|pharmazie|arzneimittel|medikament/.test(t);
  if(apotheke)                                                       s.privatrezept += 5;
  if(/privatrezept|wahlrezept|ohne rezept|handverkauf/.test(t))       s.privatrezept += 8;

  /* Apotheke UND Rezeptgebuehr -> eindeutig Kassenrezept, nicht privat. */
  if(apotheke && /rezeptgeb(ü|ue)hr/.test(t))                        s.privatrezept -= 6;

  const best = Object.keys(s).reduce((a,b)=> s[a] >= s[b] ? a : b);
  const zweit = Object.keys(s).filter(k=> k !== best).reduce((a,b)=> s[a] >= s[b] ? a : b);
  /* Nur uebernehmen, wenn der Treffer deutlich ist – sonst raet die App
     dem Nutzer den Ablauf kaputt. */
  if(s[best] < 5 || s[best] - s[zweit] < 3) return null;
  return best;
}

/* Welche vorhandene Karte passt zu diesem Dokument?
   Nach Plausibilitaet sortiert – entschieden wird vom Nutzer, weil ein
   ÖGK-Bescheid den Erstattungsbetrag nennt, nicht den Rechnungsbetrag. */
function passendeKarten(kind, result){
  const betrag = result && result.amount;
  const datum  = result && result.date;
  const text   = ((result && result.rawText) || '').toLowerCase();

  return invoices.map(inv=>{
    let p = 0;
    if(inv.status === 'abgeschlossen') p -= 3;
    /* Rolle passt zum Stand des Vorgangs */
    if(kind === 'oegk_bescheid'    && ['oegk_eingereicht','oegk_erstattet'].includes(inv.status)) p += 4;
    if(kind === 'zahlungsnachweis' && inv.status === 'bezahlt') p += 3;
    /* Betrag exakt */
    if(betrag != null && inv.amount !== '' && Math.abs(Number(inv.amount) - betrag) < 0.02) p += 5;
    /* Aussteller taucht im Text auf */
    const titel = String(inv.title||'').toLowerCase().replace(/[^a-zäöüß ]/g,'').trim();
    if(titel.length > 4 && text.includes(titel.split(' ')[0])) p += 3;
    /* Zeitliche Naehe */
    if(datum && inv.date){
      const diff = Math.abs(new Date(datum) - new Date(inv.date)) / 86400000;
      if(diff < 120) p += 2; else if(diff < 365) p += 1;
    }
    /* Diese Rolle fehlt der Karte noch */
    if(!docKinds(inv).has(kind)) p += 2;
    return { inv, p };
  }).filter(x=> x.p > 2).sort((a,b)=> b.p - a.p).slice(0,5);
}

async function analyzeInvoiceFile(file){
  let base = null;
  try{
    if(file.type === 'application/pdf')            base = await analyzePDF(file);
    else if(file.type && file.type.startsWith('image/')) base = await analyzeImage(file);
  }catch(err){ console.error('Analyse fehlgeschlagen:', err); }

  /* QR schlaegt OCR: exakte Werte ueberschreiben geratene. */
  const qr = await scanPaymentQR(file);
  if(qr){
    base = base || { amount:null, date:null, issuer:'', rawText:'' };
    if(qr.amount   != null) base.amount = qr.amount;
    if(qr.creditor)         base.issuer = qr.creditor;
    base.reference = qr.reference || '';
    base.iban      = qr.iban || '';
    base.fromQR    = true;
  }
  return base;
}

/* Eigenanteil eines Jahres – nur aus Rechnungen, bei denen schon eine
   Erstattung eingetragen ist. Sonst wuerde jede noch unbearbeitete
   Rechnung faelschlich als "komplett selbst getragen" hineinzaehlen. */
function eigenanteilJahr(jahr){
  const rel = invoices.filter(i=> (i.date||'').slice(0,4) === String(jahr)
                              && (i.erstattetOegk != null || i.erstattetKv != null));
  return rel.reduce((s,i)=> s + Math.max(0, (Number(i.amount)||0) - erstattetGesamt(i)), 0);
}
/* Zeitbasierte Begruessung statt statischem Titel – der erste Blick
   soll wie ein Dashboard wirken, nicht wie ein Formular. */
function renderGreeting(){
  const el = document.getElementById('greeting');
  if(!el) return;
  const h = new Date().getHours();
  const gruss = h < 11 ? 'Guten Morgen' : h < 18 ? 'Guten Tag' : 'Guten Abend';
  const icon  = h < 11 ? '☀️' : h < 18 ? '🌤️' : '🌙';
  el.innerHTML = `<div class="hi">${gruss} ${icon}</div><h1>Privat<b>ly</b></h1>`;
}

/* Was aktuell bei der privaten Versicherung eingereicht ist und noch
   nicht ausgezahlt wurde – der Teil, der nach der Kassa-Erstattung
   noch offen ist. */
function erwartetSumme(){
  return invoices.filter(i=> i.status === 'kv_eingereicht')
                 .reduce((s,i)=> s + Math.max(0, (Number(i.amount)||0) - erstattetGesamt(i)), 0);
}

/* Vier Fakten statt vieler Zahlen – angelehnt an die Dashboards

/* Bis zu drei Hinweis-Karten statt einem duennen Banner – priorisiert
   nach Geld-Risiko. Nach dem Vorbild der Beihilfe-Apps, die genau so
   auf "was brennt gerade" hinweisen statt alles gleich laut anzuzeigen. */
function renderAlerts(){
  const el = document.getElementById('alerts');
  if(!el) return;
  const abgelaufen = invoices.filter(i=> { const f = fristStatus(i); return f && f.stufe === 'abgelaufen'; });
  const knapp = invoices.filter(i=> { const f = fristStatus(i); return f && f.stufe === 'knapp'; })
                        .sort((a,b)=> fristStatus(a).tage - fristStatus(b).tage);
  const unvollstaendig = invoices.filter(i=>{
    const s = naechsterSchritt(i);
    if(!s) return false;
    const z = s.status === 'oegk_eingereicht' ? 'oegk' : s.status === 'kv_eingereicht' ? 'kv' : null;
    return z && fehlendeDocs(i, z).length > 0;
  });
  const spaet = invoices.filter(i=> ueberfaellig(i) > 0);
  const chancenDringend = (policy || vertraege.length) ? chancenHinweise().filter(x=> x.stufe==='hoch') : [];

  const karten = [];
  if(abgelaufen.length){
    const summe = abgelaufen.reduce((s,i)=> s + (Number(i.amount)||0), 0);
    karten.push({ sev:'rot', icon:'⛔', titel:'Frist abgelaufen',
      sub:`${abgelaufen.length} Rechnung${abgelaufen.length===1?'':'en'} · ${fmtEUR(summe)} nicht mehr rückforderbar`,
      onclick:()=> openEditor(abgelaufen[0].id) });
  }
  if(knapp.length){
    const summe = knapp.reduce((s,i)=> s + (Number(i.amount)||0), 0);
    karten.push({ sev:'amber', icon:'⏰', titel:'Frist läuft bald ab',
      sub:`${knapp.length} Rechnung${knapp.length===1?'':'en'} · ${fmtEUR(summe)} im Blick behalten`,
      onclick:()=> openEditor(knapp[0].id) });
  }
  if(chancenDringend.length){
    karten.push({ sev:'rot', icon:'💡', titel:'Chance läuft bald ab',
      sub:`${chancenDringend.length} dringende ${chancenDringend.length===1?'Sache':'Sachen'} bei Fristen oder Leistungen`,
      onclick:()=> setView('chancen') });
  }
  if(unvollstaendig.length){
    karten.push({ sev:'info', icon:'📎', titel:'Dokument fehlt',
      sub:`${unvollstaendig.length} Rechnung${unvollstaendig.length===1?'':'en'} wartet auf ein fehlendes Dokument`,
      onclick:()=> openEditor(unvollstaendig[0].id) });
  }
  if(spaet.length){
    karten.push({ sev:'info', icon:'🔔', titel:'Lange keine Rückmeldung',
      sub:`${spaet.length} Rechnung${spaet.length===1?'':'en'} liegt seit längerem ohne Antwort – nachfragen lohnt sich`,
      onclick:()=> openEditor(spaet[0].id) });
  }

  const top = karten.slice(0,3);
  el.innerHTML = top.map((k,i)=>`
    <button type="button" class="alertcard sev-${k.sev}" data-idx="${i}">
      <span class="aic">${k.icon}</span>
      <span class="atxt"><b>${escapeHTML(k.titel)}</b><span>${escapeHTML(k.sub)}</span></span>
    </button>`).join('');
  el.querySelectorAll('.alertcard').forEach((b,i)=> b.addEventListener('click', top[i].onclick));
}

/* Sammel-Einstieg: pro Ziel eine Karte, sobald dort mehr als ein Beleg
   fertig liegt. Bei nur einem lohnt der Sammelweg nicht – dann fuehrt

/* Erster Buchstabe fuer den farbigen Avatar-Kreis in "Zuletzt erfasst". */

/* Nach dem Speichern/Verschieben zum betroffenen Schritt scrollen – sonst
   verschwindet die Karte am Handy kommentarlos in einem Abschnitt, der
   gerade ausserhalb des sichtbaren Bereichs liegt. */
function revealColumn(key){
  const el = document.querySelector('.col[data-key="' + key + '"]');
  if(el) el.scrollIntoView({ behavior:'smooth', block:'start' });
}

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLUMNS.forEach(col=>{
    const items = invoices.filter(i=> i.status === col.key)
                          .sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));
    const leer = items.length === 0;
    const kompakt = leer;   // leere Schritte nur schmal andeuten statt grosser Box
    const colEl = document.createElement('div');
    colEl.className = 'col phase-' + col.phase;
    colEl.style.setProperty('--col-c', col.c);
    colEl.style.setProperty('--col-bg', col.bg);
    colEl.dataset.key = col.key;
    colEl.innerHTML = `
      <div class="col-head"><span>${escapeHTML(col.title)}${col.badge ? `<span class="badge-fokus">${escapeHTML(col.badge)}</span>` : ''}</span><span class="count">${items.length}</span></div>
      <div class="col-body"></div>
      ${kompakt ? '' : `<div class="col-foot"><button data-add="${col.key}">+ Rechnung hier anlegen</button></div>`}`;

    const body = colEl.querySelector('.col-body');
    if(leer) body.innerHTML = kompakt ? `<div class="empty-inline">Noch nichts hier</div>` : `<div class="empty">Noch keine Rechnung hier</div>`;
    else items.forEach(inv=> body.appendChild(renderCard(inv, col)));

    const addBtn = colEl.querySelector('[data-add]');
    if(addBtn) addBtn.addEventListener('click', ()=> openEditor(null, col.key));

    /* Drag & Drop bleibt als Desktop-Komfort erhalten – auf Touch feuert
       die HTML5-Drag-API keine Events, dort greift der ⇄-Button. */
    ['dragenter','dragover'].forEach(evt=> colEl.addEventListener(evt, e=>{
      e.preventDefault(); colEl.classList.add('dragover');
    }));
    colEl.addEventListener('dragleave', e=>{ if(!colEl.contains(e.relatedTarget)) colEl.classList.remove('dragover'); });
    colEl.addEventListener('drop', async e=>{
      e.preventDefault(); colEl.classList.remove('dragover');
      if(e.dataTransfer.files && e.dataTransfer.files.length){
        for(const file of e.dataTransfer.files) await createInvoiceFromFile(file, col.key);
        await loadAll();
        toast('Rechnung hinzugefügt – wird analysiert …');
      } else {
        const id = e.dataTransfer.getData('text/plain');
        if(id) await moveInvoice(id, col.key);
      }
    });
    board.appendChild(colEl);
  });
}

/* Wie lange liegt der Beleg schon bei der jeweiligen Stelle? */
function liegezeit(inv){
  const stamp = inv.status === 'oegk_eingereicht' ? inv.submittedOegkAt
              : inv.status === 'kv_eingereicht'   ? inv.submittedKvAt : null;
  const d = daysSince(stamp);
  if(d === null) return '';
  if(d === 0) return 'heute eingereicht';
  return 'seit ' + d + ' Tag' + (d === 1 ? '' : 'en');
}

/* Was steht als Naechstes an – und was passiert beim Antippen?
   Die Zeile war bisher toter Text: sie sagte "→ Bei ÖGK einreichen",
   die Handlung dazu lag aber hinter ⋮ → Menue → richtigen Eintrag
   suchen. Jetzt traegt sie die Handlung selbst.
   Fehlende Dokumente haben Vorrang – sie blockieren den Schritt, also
   fuehrt der Tap dorthin, wo man sie nachtraegt. */
function kartenHinweis(inv){
  const schritt = naechsterSchritt(inv);
  if(!schritt) return null;
  const ziel = schritt.status === 'oegk_eingereicht' ? 'oegk'
             : schritt.status === 'kv_eingereicht'   ? 'kv' : null;
  if(ziel){
    const fehlt = fehlendeDocs(inv, ziel);
    if(fehlt.length){
      return { miss:true, label:'⚠ fehlt: ' + fehlt.map(k=> DOCKINDS[k].kurz).join(', '),
               aktion:()=> openEditor(inv.id) };
    }
    /* Vollstaendig: direkt den Beleg bereitstellen, ohne Umweg. */
    return { label:'→ ' + schritt.t, aktion:()=> saveForUpload(inv.id, ziel) };
  }
  if(schritt.status === 'abgeschlossen'){
    return { label:'→ ' + schritt.t, aktion:()=> moveInvoice(inv.id, 'abgeschlossen') };
  }
  /* Restliche Schritte (etwa "Rechnung zahlen") kennt die App nicht als
     Handlung – dort ist die Statuswahl das Richtige. */
  return { label:'→ ' + schritt.t, aktion:()=> openMoveSheet(inv.id) };
}

function renderCard(inv, col){
  const el = document.createElement('div');
  el.className = 'card';
  el.style.setProperty('--col-c', col.c);
  el.dataset.id = inv.id;
  if(isDesktop()) el.draggable = true;
  const hinweis = kartenHinweis(inv);
  el.innerHTML = `
    <div class="card-row">
      <button class="card-main" type="button">
        <span class="title">${escapeHTML(inv.title || 'Ohne Bezeichnung')}</span>
        <span class="meta"><span>${fmtDate(inv.date)}</span><span class="amt">${fmtEUR(inv.amount)}</span></span>
        <span class="tags">
          <span class="weg-tag" style="--wc:${wegOf(inv).c};--wbg:${wegOf(inv).bg}">${wegOf(inv).icon} ${escapeHTML(wegOf(inv).kurz)}</span>
          ${inv.fuerWen ? `<span class="wer-tag">👤 ${escapeHTML(inv.fuerWen)}</span>` : ''}
          ${(inv.docs||[]).length ? `<span class="file-tag">📎 ${(inv.docs||[]).length}</span>` : ''}
          ${ueberfaellig(inv) ? `<span class="late-tag">🔔 seit ${ueberfaellig(inv)} Tagen – nachfragen</span>`
            : (liegezeit(inv) ? `<span class="wait-tag">⏳ ${liegezeit(inv)}</span>` : '')}
          ${inv.needsReview ? `<span class="review-tag">⚠ prüfen</span>` : ''}
          ${fristStatus(inv) ? `<span class="frist-tag ${fristStatus(inv).stufe}">${
            fristStatus(inv).stufe === 'abgelaufen' ? '⛔ Frist abgelaufen'
            : '⏰ Frist in ' + fristStatus(inv).tage + ' Tagen'}</span>` : ''}
        </span>
      </button>
      <button class="card-move" type="button" aria-label="Aktionen" title="Aktionen">⋮</button>
    </div>
    ${hinweis ? `<button type="button" class="nextstep${hinweis.miss?' miss':''}">${escapeHTML(hinweis.label)}</button>` : ''}`;

  el.querySelector('.card-main').addEventListener('click', ()=> openEditor(inv.id));
  el.querySelector('.card-move').addEventListener('click', e=>{ e.stopPropagation(); openMoveSheet(inv.id); });
  const akt = el.querySelector('.nextstep');
  if(akt && hinweis) akt.addEventListener('click', e=>{ e.stopPropagation(); hinweis.aktion(); });

  el.addEventListener('dragstart', e=>{
    e.dataTransfer.setData('text/plain', inv.id);
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(()=> el.classList.add('dragging'), 0);
  });
  el.addEventListener('dragend', ()=> el.classList.remove('dragging'));
  return el;
}

/* ---------- Datensatz-Operationen ---------- */
async function createInvoiceFromFile(file, status){
  const now = new Date().toISOString();
  const id = uid();
  await dbPut({
    id, title: file.name.replace(/\.[a-z0-9]+$/i,''), amount:'', date: now.slice(0,10), note:'',
    status, weg:'wahlarzt', fileName:file.name, fileType:file.type, fileData: await fileToDataURL(file),
    createdAt:now, updatedAt:now, needsReview:false,
    history:[{ status, at:now, label: colByKey[status].title }]
  });
  analyzeAndFill(id, file);   // laeuft im Hintergrund weiter
  return id;
}
async function analyzeAndFill(id, file){
  const result = await analyzeInvoiceFile(file);
  if(!result) return;
  const current = (await dbAll()).find(i=> i.id === id);
  if(!current) return;
  let changed = false;
  const defaultTitle = file.name.replace(/\.[a-z0-9]+$/i,'');
  if(result.amount != null && (current.amount === '' || current.amount == null)){ current.amount = result.amount; changed = true; }
  if(result.date && !current.date){ current.date = result.date; changed = true; }
  if(result.issuer && current.title === defaultTitle){ current.title = result.issuer; changed = true; }
  if(result.reference && !current.reference){ current.reference = result.reference; changed = true; }
  if(result.iban && !current.iban){ current.iban = result.iban; changed = true; }
  if(result.rechnungsnr && !current.rechnungsnr){ current.rechnungsnr = result.rechnungsnr; changed = true; }
  if(changed){
    current.needsReview = true;
    current.updatedAt = new Date().toISOString();
    await dbPut(current); await loadAll();
    toast('🔍 „' + (current.title || defaultTitle) + '“ analysiert – bitte prüfen');
  }
}
/* ==================================================================
   Verbrauch automatisch auf den passenden Leistungstopf buchen.

   Bisher war das ein kompletter zweiter Arbeitsgang: Rechnung erfassen,
   danach getrennt nach Versicherung → Leistung → "Verbrauch eintragen"
   → dieselbe Rechnung aus einer Liste suchen. Wer das vergisst – und
   das ist der Normalfall – hat Toepfe, die dauerhaft leer aussehen,
   und damit sind Restanzeige, Verfallswarnung und die ganze
   Chancen-Seite wertlos.

   Grundlage sind die beim Einlesen erkannten Katalog-Schluessel plus
   der Rechnungstitel (fuer von Hand angelegte Rechnungen ohne OCR).

   Bewusst zurueckhaltend: gebucht wird nur bei genau EINEM passenden
   Topf. Treffen mehrere zu, waere jede Wahl geraten – dann bleibt es
   beim manuellen Weg. Doppelbuchungen verhindert die invoiceId.
   ================================================================== */
function passendeToepfe(inv){
  if(!leistungen || !leistungen.length) return [];
  const keys = new Set([
    ...(inv.topfKeys || []),
    ...erkenneToepfe(inv.title || ''),
  ]);
  if(!keys.size) return [];
  return leistungen.filter(l=> keys.has(l.key));
}

async function autoBucheVerbrauch(inv){
  const betrag = Number(inv.amount) || 0;
  if(!(betrag > 0)) return null;
  const treffer = passendeToepfe(inv);
  if(treffer.length !== 1) return null;              // mehrdeutig: nicht raten
  const l = treffer[0];
  /* Schon gebucht? Dann nichts tun – auch nach mehrfachem Speichern. */
  if((usage||[]).some(u=> u.invoiceId === inv.id && u.leistungId === l.id)) return null;

  const eintrag = {
    id: uid(), leistungId: l.id, titel: inv.title || 'Rechnung',
    datum: inv.date || isoLocal(new Date()),
    betrag: l.limitTyp === 'anzahl' ? 0 : betrag,
    menge:  l.limitTyp === 'anzahl' ? 1 : 1,
    invoiceId: inv.id, automatisch: true,
  };
  await stPut('usage', eintrag);
  await loadPolicyState();
  return { leistung: l, eintrag };
}

/* Nach dem Speichern buchen und das Ergebnis sichtbar machen. Eine
   stille Buchung auf einen Leistungstopf waere das falsche Verhalten –
   der Nutzer muss sehen, dass sein Rahmen kleiner geworden ist, und
   es in einem Griff zurueckdrehen koennen. */
async function autoBucheUndMelden(inv, basisText){
  let ergebnis = null;
  try{ ergebnis = await autoBucheVerbrauch(inv); }
  catch(err){ console.warn('Verbrauch nicht gebucht:', err); }
  if(!ergebnis){ toast(basisText); return; }
  const l = ergebnis.leistung;
  toastAktion(basisText + ' · auf „' + l.name + '“ gebucht', 'Rückgängig', async ()=>{
    await stDel('usage', ergebnis.eintrag.id);
    await loadPolicyState();
    if(currentView === 'deckung') renderDeckung();
    toast('Buchung zurückgenommen');
  });
}

async function moveInvoice(id, newStatus){
  const inv = invoices.find(i=> i.id === id);
  if(!inv || inv.status === newStatus) return;
  inv.status = newStatus;
  inv.updatedAt = new Date().toISOString();
  inv.history = inv.history || [];
  inv.history.push({ status:newStatus, at: inv.updatedAt, label: colByKey[newStatus].title });
  await dbPut(inv); await loadAll();
  revealColumn(newStatus);
  toast('Verschoben nach: ' + colByKey[newStatus].short);
}
async function deleteInvoice(id){
  if(!confirm('Diese Rechnung wirklich löschen?')) return;
  await dbDelete(id);
  /* Verbrauchsbuchungen, die an dieser Rechnung haengen, mitnehmen –
     sonst zehren sie weiter am Leistungstopf, obwohl die Rechnung weg
     ist, und niemand findet den Eintrag noch zu. Betrifft besonders
     die automatisch gebuchten. */
  const haengend = (usage||[]).filter(u=> u.invoiceId === id);
  for(const u of haengend) await stDel('usage', u.id);
  if(haengend.length) await loadPolicyState();
  closeSheet(); await loadAll();
  if(currentView === 'deckung') renderDeckung();
  toast(haengend.length ? 'Rechnung und Verbrauchsbuchung gelöscht' : 'Rechnung gelöscht');
}

/* ==================================================================
   Beleg an eine fremde App weitergeben (Web Share API Level 2).
   Absichtlich kein Auto-Status: navigator.share() loest bereits auf,
   sobald Android die Datei uebergeben hat – ob du im Kassenformular
   dann wirklich abgeschickt hast, weiss diese App nicht. Deshalb
   fragt sie danach einmal nach, statt es zu behaupten.
   ================================================================== */
function shareSummary(inv){
  return [
    inv.title || 'Rechnung',
    inv.date ? 'Datum: ' + fmtDate(inv.date) : null,
    (inv.amount !== '' && inv.amount != null) ? 'Betrag: ' + fmtEUR(inv.amount) : null,
    inv.reference ? 'Referenz: ' + inv.reference : null,
  ].filter(Boolean).join('\n');
}

/* Dateiname, der im Auswaehler der Kassen-App sofort auffindbar ist:
   nach Datum sortierbar, mit Aussteller und Betrag, ohne Umlaute und
   Sonderzeichen (manche Uploader stolpern darueber). */
function belegDateiname(inv, doc, mitRolle){
  const clean = s => String(s||'')
    .replace(/ä/gi,'ae').replace(/ö/gi,'oe').replace(/ü/gi,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  const d      = doc || (inv.docs||[])[0] || { name: inv.fileName, type: inv.fileType, kind:'rechnung' };
  const ext    = (d.name||'').match(/\.[a-z0-9]+$/i);
  const datum  = inv.date || isoLocal(new Date());
  const betrag = (inv.amount !== '' && inv.amount != null && !isNaN(inv.amount) && inv.amount !== 0)
               ? '_' + String(Number(inv.amount).toFixed(2)).replace('.','-') + 'EUR' : '';
  /* Rolle mit in den Namen, sobald mehrere Dateien gleichzeitig
     abgelegt werden – sonst sind sie im Auswaehler nicht zu trennen. */
  const rolle  = mitRolle ? '_' + clean(DOCKINDS[d.kind] ? DOCKINDS[d.kind].kurz : 'Beleg') : '';
  return 'Rechnung_' + datum + '_' + (clean(inv.title) || 'Beleg') + betrag + rolle +
         (ext ? ext[0] : (d.type === 'application/pdf' ? '.pdf' : '.jpg'));
}

function invoiceFile(inv){
  const d = (inv.docs||[]).find(x=> x.kind === 'rechnung') || (inv.docs||[])[0];
  if(!d) throw new Error('kein Dokument');
  return new File([dataURLtoBlob(d.data, d.type)],
                  belegDateiname(inv, d, false), { type: d.type || 'application/octet-stream' });
}

/* Hauptweg: Beleg in Downloads ablegen. Von dort holt ihn der
   Dateiauswaehler der ÖGK- bzw. Versicherungs-App. */
async function saveForUpload(id, targetKey){
  const inv    = invoices.find(i=> i.id === id);
  const target = SEND_TARGETS.find(t=> t.key === targetKey);
  if(!inv || !target) return;

  /* Vollstaendigkeit VOR dem Upload pruefen. Ein fehlender Zahlungs-
     nachweis kostet sonst Wochen, weil die Ablehnung erst spaeter kommt. */
  const fehlt = fehlendeDocs(inv, targetKey);
  if(fehlt.length){ zeigeFehlend(id, target, fehlt); return; }

  const docs = docsFuer(inv, targetKey);
  if(!docs.length){ toast('Keine Dokumente angehängt'); return; }

  const namen = [];
  for(let i = 0; i < docs.length; i++){
    const d = docs[i];
    const name = belegDateiname(inv, d, docs.length > 1);
    let url;
    try{ url = dataURLtoBlobURL(d.data, d.type); }catch(e){ continue; }
    if(!url) continue;
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 30000);
    namen.push(name);
    /* Browser drosseln Mehrfach-Downloads – kurz Luft lassen. */
    if(i < docs.length - 1) await new Promise(r=> setTimeout(r, 450));
  }

  await copyToClipboard(shareSummary(inv));
  showUploadSteps(id, target, namen);
}

/* ==================================================================
   SAMMEL-UPLOAD
   Der Weg zur Kasse war bisher pro Rechnung ein eigenes Ritual: ⋮ →
   bereitstellen → App wechseln → hochladen → zurueck → Status
   bestaetigen. Bei fuenf liegengebliebenen Belegen fuenfmal dasselbe,
   obwohl der Nutzer die fremde App ohnehin nur einmal oeffnet.

   Hier werden alle Belege, die fuer dasselbe Ziel fertig sind, in
   einem Durchgang abgelegt und danach EINMAL gesammelt nach dem
   Status gefragt.
   ================================================================== */
function sammelKandidaten(targetKey){
  const zielStatus = (SEND_TARGETS.find(t=> t.key === targetKey)||{}).status;
  return invoices.filter(inv=>{
    if(inv.status === 'abgeschlossen') return false;
    if(inv.status === zielStatus) return false;          // dort schon eingereicht
    const schritt = naechsterSchritt(inv);
    if(!schritt || schritt.status !== zielStatus) return false;
    if(fehlendeDocs(inv, targetKey).length) return false; // unvollstaendig: nicht mitnehmen
    return docsFuer(inv, targetKey).length > 0;
  });
}

async function sammelUpload(targetKey){
  const target = SEND_TARGETS.find(t=> t.key === targetKey);
  const liste  = sammelKandidaten(targetKey);
  if(!target || !liste.length){ toast('Nichts bereit zum Einreichen'); return; }

  const namen = [];
  const alleDocs = [];
  liste.forEach(inv=> docsFuer(inv, targetKey).forEach(d=> alleDocs.push({ inv, d })));

  for(let i = 0; i < alleDocs.length; i++){
    const { inv, d } = alleDocs[i];
    /* Rolle immer in den Dateinamen: hier liegen Belege mehrerer
       Rechnungen gleichzeitig in Downloads, sonst sind sie im
       Auswaehler der fremden App nicht auseinanderzuhalten. */
    const name = belegDateiname(inv, d, true);
    let url;
    try{ url = dataURLtoBlobURL(d.data, d.type); }catch(e){ continue; }
    if(!url) continue;
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 30000);
    namen.push(name);
    if(i < alleDocs.length - 1) await new Promise(r=> setTimeout(r, 450));
  }

  await copyToClipboard(liste.map(shareSummary).join('\n\n'));
  zeigeSammelSchritte(liste, target, namen);
}

  openSheet(`

        <span>${escapeHTML(erklaerung(k))}</span></div>`).join('')}
      <div class="statuslist" style="margin-top:14px">
        <button type="button" id="nachtragen" style="--sc:#2563eb;--sbg:#eff6ff">📎 Jetzt nachtragen</button>
        <button type="button" id="trotzdem" style="--sc:#94a3b8">Trotzdem speichern</button>
      </div>
    </div>`);
  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
  sheet.querySelector('#nachtragen').addEventListener('click', ()=>{ closeSheet(); openEditor(id); });
  sheet.querySelector('#trotzdem').addEventListener('click', async ()=>{

    const docs = (inv.docs||[]);
    if(!docs.length){ toast('Keine Dokumente angehängt'); return; }
    const namen = [];
    for(const d of docs){
      const name = belegDateiname(inv, d, docs.length > 1);
      const url = dataURLtoBlobURL(d.data, d.type);
      if(!url) continue;
      const a = document.createElement('a');
      a.href = url; a.download = name; a.rel='noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 30000);
      namen.push(name);
      await new Promise(r=> setTimeout(r, 450));
    }
    await copyToClipboard(shareSummary(inv));
    showUploadSteps(id, target, namen);
  });
}

/* Nebenweg: alles, was Teilen tatsaechlich annimmt (Mail, Cloud, Chat). */
async function shareInvoice(id){
  const inv = invoices.find(i=> i.id === id);
  if(!inv || !inv.fileData){ toast('Kein Beleg angehängt'); return; }
  let file;
  try{ file = invoiceFile(inv); }catch(e){ toast('Beleg konnte nicht gelesen werden'); return; }
  if(!(navigator.canShare && navigator.canShare({ files:[file] }))){
    toast('Teilen wird hier nicht unterstützt – nimm „speichern“'); return;
  }
  await copyToClipboard(shareSummary(inv));
  try{ await navigator.share({ files:[file], title: inv.title || 'Rechnung', text: shareSummary(inv) }); }
  catch(err){ if(!err || err.name !== 'AbortError') toast('Teilen abgebrochen'); }
}

  [cam, fil].forEach(input=> input.addEventListener('change', async ()=>{

    }
  }));
  /* Belegart bestimmt den Weg – Hinweis direkt darunter mitfuehren. */
  const wegSel = sheet.querySelector('#f-weg');
  const zeigeWegHinweis = ()=>{
    const w = WEGE[wegSel.value];
    const h = sheet.querySelector('#wegHint');
    if(h) h.innerHTML = escapeHTML(w.hinweis) +
      ' <button type="button" class="linklike" id="wegMehr">Alle Wege ansehen</button>';
    const mehr = sheet.querySelector('#wegMehr');
    if(mehr) mehr.addEventListener('click', ()=> openWegeSheet(wegSel.value));
  };
  /* Sobald der Nutzer die Belegart selbst waehlt, gilt sie – die
     automatische Erkennung fasst sie danach nicht mehr an. */
  wegSel.addEventListener('change', ()=>{ wegVomNutzer = true; zeigeWegHinweis(); });
  zeigeWegHinweis();

  /* Live-Differenz: was blieb an mir haengen */
  const rechneDiff = ()=>{
    const h = sheet.querySelector('#diffHint');
    if(!h) return;
    const a = Number(sheet.querySelector('#f-amount').value) || 0;
    const r = (Number(sheet.querySelector('#f-eoegk').value)||0) + (Number(sheet.querySelector('#f-ekv').value)||0);
    if(!a || !r){ h.textContent = ''; return; }
    const rest = a - r;
    h.innerHTML = 'Selbst getragen: <b>' + fmtEUR(rest) + '</b> · zurück: ' +
                  Math.round(r/a*100) + ' % des Rechnungsbetrags';
  };
  ['#f-amount','#f-eoegk','#f-ekv'].forEach(sel=>{
    const el = sheet.querySelector(sel); if(el) el.addEventListener('input', rechneDiff);
  });
  rechneDiff();

  sheet.querySelector('#btnSave').addEventListener('click', ()=> saveEditor(id));
  if(inv) sheet.querySelector('#btnDelete').addEventListener('click', ()=> deleteInvoice(id));
  const ak = sheet.querySelector('#btnAkte');
  if(ak) ak.addEventListener('click', ()=>{ closeSheet(); vorgangsakte(id); });
}

/* ---------- Dokumentenliste im Editor ---------- */
function renderDocs(){
  const wrap = document.getElementById('docList');
  if(!wrap) return;
  if(!pendingDocs.length){
    wrap.innerHTML = '<p class="hint" style="margin:0">Noch kein Dokument. Rechnung fotografieren oder PDF wählen.</p>';
  } else {
    wrap.innerHTML = pendingDocs.map(d=>`
      <div class="docrow" data-doc="${d.id}">
        <span class="docicon">${DOCKINDS[d.kind] ? DOCKINDS[d.kind].icon : '📎'}</span>
        <div class="docmain">
          <select class="dockind" data-doc="${d.id}" aria-label="Rolle des Dokuments">
            ${DOCKIND_KEYS.map(k=>`<option value="${k}" ${k===d.kind?'selected':''}>${escapeHTML(DOCKINDS[k].label)}</option>`).join('')}
          </select>
          <span class="docname">${escapeHTML(d.name)}</span>
        </div>
        <button type="button" class="docbtn" data-open="${d.id}" aria-label="Öffnen">↗</button>
        <button type="button" class="docbtn del" data-del="${d.id}" aria-label="Entfernen">✕</button>
      </div>`).join('');
  }
  wrap.querySelectorAll('.dockind').forEach(s=> s.addEventListener('change', ()=>{
    const d = pendingDocs.find(x=> x.id === s.dataset.doc);
    if(d){ d.kind = s.value; renderDocs(); renderBedarf(); }
  }));
  wrap.querySelectorAll('[data-open]').forEach(b=> b.addEventListener('click', ()=>{
    const d = pendingDocs.find(x=> x.id === b.dataset.open);
    const url = d && dataURLtoBlobURL(d.data, d.type);
    if(url) window.open(url, '_blank'); else toast('Datei kann nicht geöffnet werden');
  }));
  wrap.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=>{
    pendingDocs = pendingDocs.filter(x=> x.id !== b.dataset.del);
    renderDocs(); renderBedarf();
  }));
}

/* Was fehlt noch – live, waehrend man Rollen zuweist. */
function renderBedarf(){
  const wrap = document.getElementById('bedarfWrap');
  if(!wrap) return;
  const wegSel = document.getElementById('f-weg');
  const probe  = { weg: wegSel ? wegSel.value : 'wahlarzt', docs: pendingDocs,
                   submittedOegkAt: editorSubmittedOegk };
  const rows = SEND_TARGETS
    .filter(t=> (BEDARF[probe.weg] || {})[t.key])
    .map(t=>{
      const fehlt = fehlendeDocs(probe, t.key);
      return `<div class="bedarf ${fehlt.length?'':'ok'}">
        <b>${t.icon} ${escapeHTML(t.key === 'oegk' ? 'Für die ÖGK' : 'Für die private KV')}</b>
        <span>${fehlt.length
          ? 'fehlt noch: ' + fehlt.map(k=> DOCKINDS[k].kurz).join(', ')
          : 'vollständig'}</span></div>`;

}

/* Neues Dokument aufnehmen. Rolle wird geraten: das erste ist die
   Rechnung, danach Zahlungsnachweis, sonst Sonstiges. Umstellbar. */
function rateRolle(){
  const have = new Set(pendingDocs.map(d=> d.kind));
  if(!have.has('rechnung'))         return 'rechnung';
  if(!have.has('zahlungsnachweis')) return 'zahlungsnachweis';
  return 'sonstiges';
}

async function setPendingFile(file, opts){
  const autoSave = !opts || opts.autoSave !== false;
  const doc = { id: uid(), kind: rateRolle(), name: file.name || 'Beleg',
                type: file.type || '', data: await fileToDataURL(file),
                addedAt: new Date().toISOString() };
  pendingDocs.push(doc);
  renderDocs(); renderBedarf();

  /* Ein Zahlungsnachweis traegt keine Rechnungsdaten und wuerde die
     Felder mit Unsinn fuellen – der wird gar nicht erst gelesen. */
  if(doc.kind === 'zahlungsnachweis') return;

  const statusEl = document.getElementById('analyze-status');
  if(statusEl){ statusEl.className=''; statusEl.textContent = '🔍 Beleg wird lokal analysiert …'; }
  const result = await analyzeInvoiceFile(file);
  const el = document.getElementById('analyze-status');
  if(!el) return;   /* Sheet wurde inzwischen geschlossen */

  /* Bescheid statt Rechnung? Die Rolle wurde bisher nur nach Reihenfolge
     geraten ("das erste ist die Rechnung"). Wer den ÖGK-Bescheid zu einer
     noch leeren Karte legt, bekam ihn dadurch als "Rechnung" eingetragen –
     samt Erstattungsbetrag im Feld Rechnungsbetrag. Der Textklassifikator
     existiert bereits, er wurde hier nur nie befragt. */
  const klass = result ? klassifiziere(result.rawText || '') : null;
  if(klass && klass.sicher && klass.kind === 'oegk_bescheid' && doc.kind === 'rechnung'){
    doc.kind = 'oegk_bescheid';
    renderDocs(); renderBedarf();
  }

  /* Belegart aus dem Text setzen, solange der Nutzer sie nicht selbst
     gewaehlt hat. Sie steuert den gesamten weiteren Ablauf (beim
     Kassenrezept entfaellt der ÖGK-Schritt) – bisher musste sie bei
     jeder Rechnung von Hand gesetzt werden. */
  if(doc.kind === 'rechnung' && !wegVomNutzer && result){
    const erkannt = erkenneWeg(result.rawText || '');
    const ws = document.getElementById('f-weg');
    if(erkannt && ws && ws.value !== erkannt){
      ws.value = erkannt;
      /* Hinweistext unter dem Feld mitziehen, ohne wegVomNutzer zu setzen */
      ws.dispatchEvent(new Event('change', { bubbles:true }));
      wegVomNutzer = false;
    }
  }

  /* Bescheid: nicht der Rechnungsbetrag ist gesucht, sondern was
     tatsaechlich zurueckkam – und das gehoert in ein anderes Feld. */
  if(doc.kind === 'oegk_bescheid' || doc.kind === 'sonstiges'){
    const betrag = result && result.erstattung;
    if(betrag != null && betrag > 0){
      const feldId = doc.kind === 'oegk_bescheid' ? 'f-eoegk' : 'f-ekv';
      const f = document.getElementById(feldId);
      if(f && !f.value){
        f.value = betrag;
        f.dispatchEvent(new Event('input', { bubbles:true }));   // Live-Differenz neu rechnen
      }
      el.className = 'ok';
      el.textContent = '✓ Erstattung ' + fmtEUR(betrag) + ' erkannt – bitte prüfen';
    } else {
      el.textContent = 'Kein Erstattungsbetrag gefunden – bitte unten selbst eintragen.';
    }
    return;
  }

  if(result && (result.amount != null || result.date || result.issuer)){
    el.className = 'ok';
    el.textContent = result.fromQR
      ? '✓ aus Zahlungs-QR gelesen – exakte Werte'
      : '✓ automatisch erkannt – bitte prüfen';
    const a = document.getElementById('f-amount'), d = document.getElementById('f-date'), t = document.getElementById('f-title');
    /* QR-Werte sind exakt und duerfen ueberschreiben, OCR-Werte nur fuellen. */
    if(a && result.amount != null && (!a.value || result.fromQR)) a.value = result.amount;
    if(d && result.date) d.value = result.date;
    if(t && result.issuer && (!t.value || result.fromQR)) t.value = result.issuer;
    pendingRef  = result.reference || result.rechnungsnr || '';
    pendingIban = result.iban || '';
    pendingTopfKeys = result.topfKeys || [];
    const rw = document.getElementById('refWrap');
    if(rw) rw.innerHTML = pendingRef ? `<div class="filechip"><span>🔖</span><span class="nm">Referenz: ${escapeHTML(pendingRef)}</span></div>` : '';

    if(autoSave && qrDirektMoeglich(result)) await speichereDirektAusQR();
  } else el.textContent = 'Keine automatische Erkennung möglich – bitte manuell ausfüllen.';
}

/* ==================================================================
   QR-Direkterfassung: Foto rein, Karte fertig.
   Der Zahlungs-QR-Code (EPC069-12/Stuzza) liefert Betrag und Empfaenger
   exakt aus dem Code, nicht geraten – bei diesen Werten gibt es nichts
   zu pruefen, was der Nutzer besser wuesste als die Rechnung selbst.
   Genau dann ist das Editor-Sheet reine Zeremonie: aufmachen, nichts
   aendern, "Speichern" tippen, zumachen.

   Bewusst eng gefasst. Direkt gespeichert wird nur, wenn
     - die Werte wirklich aus dem QR-Code stammen (nicht aus OCR),
     - es eine NEUE Rechnung ist (bei einer bestehenden wuerde man dem
       Nutzer seine offene Bearbeitung unter den Fingern wegspeichern),
     - er noch nichts Eigenes eingetippt hat, das verloren ginge,
     - und Betrag wie Aussteller beide vorliegen.
   Alles andere laeuft weiter ueber den normalen Editor.
   ================================================================== */
function qrDirektMoeglich(result){
  if(!result || !result.fromQR) return false;
  if(editorInvoiceId) return false;                     // bestehende Rechnung: nie automatisch
  if(!(Number(result.amount) > 0)) return false;
  if(!result.issuer) return false;
  if(pendingDocs.length !== 1) return false;            // nur der eine frische Beleg
  /* Hat der Nutzer schon selbst getippt? Dann ist das seine Eingabe. */
  const eigen = ['f-fuerwen','f-note','f-eoegk','f-ekv','f-abl']
    .some(id=>{ const e = document.getElementById(id); return e && e.value.trim(); });
  return !eigen;
}

async function speichereDirektAusQR(){
  const g = id => { const e = document.getElementById(id); return e ? e.value : ''; };
  const now  = new Date().toISOString();
  const id   = uid();
  const weg  = g('f-weg') || 'wahlarzt';
  const stat = g('f-status') || 'bezahlt';
  const titel = g('f-title').trim() || 'Ohne Bezeichnung';
  await dbPut({
    id, title: titel, fuerWen:'', amount: g('f-amount'), date: g('f-date'),
    note:'', status: stat, weg,
    erstattetOegk:null, erstattetKv:null, ablehnung:'',
    docs: pendingDocs,
    fileName: (pendingDocs[0]||{}).name || '',
    fileType: (pendingDocs[0]||{}).type || '',
    fileData: (pendingDocs[0]||{}).data || '',
    reference: pendingRef, iban: pendingIban, topfKeys: pendingTopfKeys,
    createdAt: now, updatedAt: now,
    /* Kein needsReview: die Werte kommen aus dem Code, nicht aus einer
       Schaetzung – ein "prüfen"-Hinweis waere hier nur Rauschen. */
    needsReview:false,
    history:[{ status: stat, at: now, label: colByKey[stat].title }]
  });
  const merkeDocs = pendingDocs.slice();
  closeSheet();
  await loadAll();
  revealColumn(stat);
  const neu = invoices.find(i=> i.id === id);
  let zusatz = '';
  try{
    const gebucht = neu ? await autoBucheVerbrauch(neu) : null;
    if(gebucht) zusatz = ' · auf „' + gebucht.leistung.name + '“ gebucht';
  }catch(err){ console.warn('Verbrauch nicht gebucht:', err); }
  toastAktion('✓ „' + titel + '“ gespeichert' + zusatz, 'Bearbeiten', ()=> openEditor(id));
  return merkeDocs;
}

/* Zuletzt verwendete "Für wen"-Namen, damit man bei mehreren
   Familienmitgliedern nicht jedes Mal neu tippt. */
function fuerWenVorschlaege(){
  return [...new Set(invoices.map(i=> (i.fuerWen||'').trim()).filter(Boolean))].sort();
}
async function saveEditor(id){
  const title  = document.getElementById('f-title').value.trim() || 'Ohne Bezeichnung';
  const fuerWen = document.getElementById('f-fuerwen').value.trim();
  const amount = document.getElementById('f-amount').value;
  const date   = document.getElementById('f-date').value;
  const status = document.getElementById('f-status').value;
  const weg    = (document.getElementById('f-weg')||{}).value || 'wahlarzt';
  const eOegk  = document.getElementById('f-eoegk').value;
  const eKv    = document.getElementById('f-ekv').value;
  const ablehnung = document.getElementById('f-abl').value.trim();
  const note   = document.getElementById('f-note').value;
  const now    = new Date().toISOString();

  /* Hat der Nutzer den Status in diesem Durchgang selbst gesetzt, darf
     ihn keine Automatik gleich wieder verschieben. Bei einer neuen
     Rechnung gilt jede Auswahl als bewusst getroffen. */
  const statusVomNutzerGesetzt = !id || (invoices.find(i=> i.id === id)||{}).status !== status;

  let gespeichert;
  if(id){
    const inv = invoices.find(i=> i.id === id);
    const statusChanged = inv.status !== status;
    Object.assign(inv, { title, fuerWen, amount, date, note, status, weg, needsReview:false, updatedAt:now,
                         reference: pendingRef, iban: pendingIban, topfKeys: pendingTopfKeys,
                         erstattetOegk: eOegk === '' ? null : Number(eOegk),
                         erstattetKv:   eKv   === '' ? null : Number(eKv), ablehnung });
    inv.docs = pendingDocs;
    const haupt = pendingDocs.find(d=> d.kind === 'rechnung') || pendingDocs[0];
    inv.fileName = haupt ? haupt.name : ''; inv.fileType = haupt ? haupt.type : ''; inv.fileData = haupt ? haupt.data : '';
    inv.history = inv.history || [];
    if(statusChanged) inv.history.push({ status, at:now, label: colByKey[status].title });
    await dbPut(inv);
    gespeichert = inv;
  } else {
    gespeichert = {
      id: uid(), title, fuerWen, amount, date, note, status, weg,
      erstattetOegk: eOegk === '' ? null : Number(eOegk),
      erstattetKv:   eKv   === '' ? null : Number(eKv), ablehnung,
      docs: pendingDocs,
      fileName: (pendingDocs[0]||{}).name || '',
      fileType: (pendingDocs[0]||{}).type || '',
      fileData: (pendingDocs[0]||{}).data || '',
      reference: pendingRef, iban: pendingIban, topfKeys: pendingTopfKeys,
      createdAt:now, updatedAt:now, needsReview:false,
      history:[{ status, at:now, label: colByKey[status].title }]
    };
    await dbPut(gespeichert);
  }
  const hatBescheid = pendingDocs.some(d=> d.kind === 'oegk_bescheid');
  closeSheet(); await loadAll();

  /* Hat der Nutzer hier gerade den ÖGK-Bescheid angehaengt, ist die
     Kasse damit durch – und ist alles erstattet, der Vorgang ganz
     fertig. Beides musste er bisher selbst nachziehen. */
  if(hatBescheid && !statusVomNutzerGesetzt) await autoStatusNachBescheid(gespeichert.id, 'oegk_bescheid');
  const abgeschlossen = await autoAbschluss(gespeichert.id);
  const aktuell = invoices.find(i=> i.id === gespeichert.id);
  revealColumn(aktuell ? aktuell.status : status);
  await autoBucheUndMelden(gespeichert,
    abgeschlossen ? 'Gespeichert · vollständig erstattet, abgeschlossen' : 'Gespeichert');
}

/* ==================================================================
   Vorgang selbst abschliessen, wenn nichts mehr offen ist.
   Sobald Kasse und private Versicherung zusammen den Rechnungsbetrag
   erreichen, gibt es nichts mehr zu holen. Die Karte blieb bisher
   trotzdem im Board stehen, bis jemand sie von Hand verschob – und
   verfaelschte solange jede "offen"-Zahl auf der Uebersicht.

   Toleranz von 1 Cent gegen Rundungsdifferenzen. Nur vorwaerts: eine
   bereits abgeschlossene Rechnung wird nie automatisch wieder
   geoeffnet, und wer den Status gerade selbst auf etwas anderes
   gesetzt hat, wird nicht ueberstimmt – deshalb laeuft das nur, wenn
   ueberhaupt eine Erstattung erfasst ist.
   ================================================================== */
async function autoAbschluss(id){
  const inv = invoices.find(i=> i.id === id);
  if(!inv || inv.status === 'abgeschlossen') return false;
  const betrag = Number(inv.amount) || 0;
  if(!(betrag > 0)) return false;
  if(inv.erstattetOegk == null && inv.erstattetKv == null) return false;
  if(erstattetGesamt(inv) + 0.01 < betrag) return false;
  const now = new Date().toISOString();
  inv.status = 'abgeschlossen';
  inv.updatedAt = now;
  inv.history = (inv.history||[]).concat([{ status:'abgeschlossen', at:now,
    label: colByKey.abgeschlossen.title }]);
  await dbPut(inv);
  await loadAll();
  return true;
}

/* ==================================================================
   Ein zugeordneter ÖGK-Bescheid IST das Ereignis "Kasse hat erledigt".
   Genau dafuer gibt es die Spalte "Kassa-Erstattung da" – sie musste
   bis jetzt trotzdem von Hand gesetzt werden, obwohl der Beleg dafuer
   gerade eingetroffen ist. Eine Station frueher als autoAbschluss(),
   sonst dieselbe Logik.

   Nur vorwaerts und nur aus "bei der Kasse eingereicht" heraus: wer
   schon weiter ist, wird nicht zurueckgeworfen.
   ================================================================== */
async function autoStatusNachBescheid(id, kind){
  if(kind !== 'oegk_bescheid') return false;
  const inv = invoices.find(i=> i.id === id);
  if(!inv || inv.status !== 'oegk_eingereicht') return false;
  const now = new Date().toISOString();
  inv.status = 'oegk_erstattet';
  inv.updatedAt = now;
  inv.history = (inv.history||[]).concat([{ status:'oegk_erstattet', at:now,
    label: colByKey.oegk_erstattet.title }]);
  await dbPut(inv);
  await loadAll();
  return true;
}

/* ==================================================================
   Empfang: aus einer anderen App hierher geteilte Belege.
   Der Service Worker hat sie in den Cache 'rt-share' gelegt und auf
   ./?shared=N umgeleitet. Hier abholen, Cache leeren, Karte anlegen.
   ================================================================== */
async function handleSharedFiles(){
  const params = new URLSearchParams(location.search);
  if(!params.has('shared') && !params.has('neu')) return;

  const n = Number(params.get('shared') || 0);
  history.replaceState(null, '', './');       // Query aus der Adresse nehmen

  if(params.has('neu')){ openEditor(null); return; }
  if(!n){ toast('Es kam keine Datei an'); return; }

  let files = [];
  try{
    const cache = await caches.open('rt-share');
    for(const req of await cache.keys()){
      const res  = await cache.match(req);
      if(!res) continue;
      const blob = await res.blob();
      const name = decodeURIComponent(res.headers.get('x-filename') || 'beleg');
      files.push(new File([blob], name, { type: blob.type || res.headers.get('content-type') || '' }));
      await cache.delete(req);
    }
  }catch(err){ console.warn('Geteilte Datei nicht lesbar:', err); }

  if(!files.length){ toast('Es kam keine Datei an'); return; }

  if(files.length === 1){
    await triageGeteiltesDokument(files[0]);
  } else {
    for(const f of files) await createInvoiceFromFile(f, 'bezahlt');
    await loadAll();
    toast(files.length + ' Belege übernommen – werden analysiert …');
  }
}

/* ==================================================================
   Erstattungsbetrag aus einem Bescheid in die Karte uebernehmen.
   Welches der beiden Felder gefuellt wird, haengt davon ab, von wem
   der Bescheid kommt: Ein als ÖGK-Bescheid erkanntes Dokument fuellt
   erstattetOegk, alles andere (Abrechnung der privaten Versicherung)
   erstattetKv. Bereits erfasste Werte bleiben unangetastet.
   Liefert einen Textzusatz fuer den Toast, damit der Nutzer sieht,
   dass etwas eingetragen wurde – stille Aenderungen an Geldbetraegen
   waeren hier das falsche Verhalten.
   ================================================================== */
function uebernimmErstattung(inv, kind, result){
  const betrag = result && result.erstattung;
  if(betrag == null || !(betrag > 0)) return '';
  const feld = kind === 'oegk_bescheid' ? 'erstattetOegk' : 'erstattetKv';
  if(inv[feld] != null) return '';           // vom Nutzer geprueft, nicht ueberschreiben
  /* Mehr als der Rechnungsbetrag kann nicht erstattet worden sein –
     das waere eine Fehlerkennung, etwa der eingereichte Betrag. */
  const rechnung = Number(inv.amount);
  if(rechnung > 0 && betrag > rechnung * 1.02) return '';
  inv[feld] = betrag;
  inv.needsReview = true;                    // sichtbar als "⚠ prüfen" auf der Karte
  return ' · ' + fmtEUR(betrag) + ' als Erstattung eingetragen, bitte prüfen';
}

/* Ein einzeln geteiltes Dokument: erst lesen, dann entscheiden.
   Ohne diesen Schritt landet ein ÖGK-Bescheid als neue "Rechnung"
   im Board, statt bei der Karte, zu der er gehoert. */
async function triageGeteiltesDokument(file){
  openSheet(`
    <div class="sheet-head"><h2>Dokument wird gelesen …</h2></div>

  const result = await analyzeInvoiceFile(file);
  const klass  = klassifiziere((result && result.rawText) || file.name);
  const kind   = klass.kind;
  const treffer = passendeKarten(kind, result);

  const dataURL = await fileToDataURL(file);

                     data: dataURL, addedAt: new Date().toISOString() };

  openSheet(`

      <div class="statuslist">

          <button type="button" data-zu="${inv.id}" style="--sc:${colByKey[inv.status].c};--sbg:${colByKey[inv.status].bg}">
            <span style="flex:1;min-width:0">

            </span>
          </button>`).join('')}
        <button type="button" id="t-neu" style="--sc:#2563eb;--sbg:#eff6ff">➕ Neue Rechnung daraus anlegen</button>
      </div>
      ${treffer.length ? '' : '<p class="hint">Keine passende bestehende Karte gefunden.</p>'}
    </div>`);

  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
  const kindSel = sheet.querySelector('#t-kind');

  sheet.querySelectorAll('[data-zu]').forEach(b=> b.addEventListener('click', async ()=>{
    const inv = invoices.find(i=> i.id === b.dataset.zu);
    closeSheet();
    if(!inv) return;
    neuesDoc.kind = kindSel.value;
    inv.docs = (inv.docs||[]).concat([neuesDoc]);
    inv.updatedAt = new Date().toISOString();
    /* Ist das ein Bescheid und steht ein Erstattungsbetrag drin, direkt
       eintragen – dieses Feld bleibt sonst am haeufigsten leer, und ohne
       es sind Eigenanteil, Quote und Steuerauswertung wertlos. Nur
       fuellen, nie ueberschreiben: ein bereits erfasster Wert ist vom
       Nutzer geprueft und schlaegt jede Erkennung. */
    const zusatz = uebernimmErstattung(inv, neuesDoc.kind, result);
    await dbPut(inv); await loadAll();
    /* Der Bescheid schiebt den Vorgang weiter: die Kasse ist damit
       durch – und deckt er den Rest ab, ist er ganz erledigt. */
    const weiter = await autoStatusNachBescheid(inv.id, neuesDoc.kind);
    const fertig = await autoAbschluss(inv.id);
    toast(DOCKINDS[neuesDoc.kind].kurz + ' zu „' + (inv.title||'Rechnung') + '“ gelegt' + zusatz +
          (fertig ? ' · abgeschlossen' : (weiter ? ' · Kassa-Erstattung eingetragen' : '')));
    if(fertig || weiter) revealColumn(invoices.find(i=> i.id === inv.id).status);
  }));

  sheet.querySelector('#t-neu').addEventListener('click', async ()=>{
    neuesDoc.kind = kindSel.value;
    closeSheet();
    openEditor(null);

    if(t && !t.value) t.value = (result && result.issuer) || file.name.replace(/\.[a-z0-9]+$/i,'');
    if(a && result && result.amount != null) a.value = result.amount;
    if(d && result && result.date) d.value = result.date;
  });
}

let usage = [];         // Verbrauchseintraege

/* Policy/Leistungen/Usage/Vertraege aus dem Store laden, ohne eine
   bestimmte Ansicht zu rendern. Wird sowohl beim App-Start gebraucht
   (Uebersicht kennt sonst weder Polizze noch Vertraege, weil sie erst
   beim Betreten von Deckung/Vertraege/Chancen geladen wurden – die
   "Chance laeuft bald ab"-Karte und das Mehr-Abzeichen blieben dadurch
   nach jedem Neustart leer, bis man zufaellig einen dieser Tabs oeffnet)
   als auch von den einzelnen loadX()-Funktionen selbst. */
async function loadPolicyState(){
  const pols = await stAll('policies');
  /* Der Store haelt jetzt alle Sparten – fuer die Deckung zaehlt die
     Krankenversicherung. Altbestand ohne art gilt als solche. */
  policy = pols.find(p=> (p.art || 'kranken') === 'kranken') || null;
  leistungen = policy ? (policy.leistungen || []) : [];
  usage      = await stAll('usage');
  vertraege  = pols;
}
async function loadDeckung(){
  await loadPolicyState();
  renderDeckung();
  updateChancenZaehler();
}
