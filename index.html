<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechnungs-Tracker – Wahlarzt &amp; Apotheke</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rechnungen">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
/* =======================================================================
   Mobile first. Alle Basisregeln gelten fuer das Handy;
   groessere Screens bekommen Erweiterungen ueber min-width-Queries.
   ======================================================================= */
:root{
  color-scheme: light;
  --blue:#2563eb; --blue-l:#eff6ff;
  --teal:#0891b2; --teal-l:#ecfeff;
  --amber:#d97706; --amber-l:#fffbeb;
  --violet:#7c3aed; --violet-l:#f5f3ff;
  --green:#16a34a; --green-l:#f0fdf4;
  --ink:#0f172a; --sub:#475569; --line:#e2e8f0; --bg:#f1f5f9;
  --tap:44px;                       /* Mindestgroesse fuer Touch-Ziele */
  --sat: env(safe-area-inset-top,0px);
  --sab: env(safe-area-inset-bottom,0px);
  --sal: env(safe-area-inset-left,0px);
  --sar: env(safe-area-inset-right,0px);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.45;
  overscroll-behavior-y:none;
}
body.locked{ overflow:hidden; }

button, .btn{
  font-family:inherit; font-size:15px; font-weight:600;
  min-height:var(--tap); padding:10px 16px;
  border-radius:10px; border:1px solid var(--line);
  background:#fff; color:var(--ink);
  cursor:pointer; touch-action:manipulation;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
button:active{ transform:scale(.97); }
button.primary{ background:var(--blue); color:#fff; border-color:var(--blue); }
button.danger{ background:#fff; color:#dc2626; border-color:#fecaca; }
button.ghost{ border-color:transparent; background:transparent; color:var(--sub); }
button:disabled{ opacity:.5; }
/* Hover-Effekte nur dort, wo es echten Hover gibt – auf Touch bleiben sie sonst kleben */
@media (hover:hover) and (pointer:fine){
  button:hover{ background:#f1f5f9; }
  button.primary:hover{ background:#1d4ed8; }
  button.danger:hover{ background:#fef2f2; }
}

/* ---------- Kopfzeile ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  background:#fff; border-bottom:1px solid var(--line);
  padding:calc(10px + var(--sat)) calc(12px + var(--sar)) 10px calc(12px + var(--sal));
  display:flex; align-items:center; gap:8px;
}
.topbar h1{
  font-size:16px; margin:0; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.saved-indicator{ font-size:11px; color:var(--green); font-weight:600; white-space:nowrap; }
.icon-btn{
  width:var(--tap); height:var(--tap); min-height:var(--tap);
  padding:0; border-radius:50%; border:1px solid var(--line);
  background:#fff; font-size:17px; flex:none;
}

/* ---------- Info-Buttons und Popover ---------- */
.info-btn{
  width:26px; height:26px; min-height:26px; padding:0; flex:none;
  border-radius:50%; border:1px solid #bfdbfe; background:var(--blue-l);
  color:var(--blue); font-size:13px; font-weight:800; line-height:1;
}
.popover{
  position:fixed; z-index:80; max-width:min(320px, calc(100vw - 24px));
  background:#0f172a; color:#e2e8f0; font-size:13px; line-height:1.5;
  border-radius:10px; padding:12px 14px; box-shadow:0 12px 32px rgba(0,0,0,.3);
  display:none;
}
.popover.open{ display:block; }
.popover b{ color:#fff; }

/* ---------- Kennzahlen ---------- */
.stats{
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
  padding:10px calc(12px + var(--sar)) 4px calc(12px + var(--sal));
}
.stat{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
.stat .n{ font-size:17px; font-weight:800; line-height:1.2; }
.stat .l{ font-size:11px; color:var(--sub); }

/* ---------- Status-Tabs (nur Handy/Tablet) ---------- */
.tabs{
  display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
  padding:8px calc(12px + var(--sar)) 8px calc(12px + var(--sal));
  position:sticky; top:calc(var(--tap) + var(--sat) + 12px); z-index:20;
  background:var(--bg);
}
.tabs::-webkit-scrollbar{ display:none; }
.tab{
  flex:none; min-height:38px; padding:7px 13px; border-radius:20px;
  border:1px solid var(--line); background:#fff; color:var(--sub);
  font-size:13px; font-weight:700; white-space:nowrap;
  display:inline-flex; align-items:center; gap:6px; touch-action:manipulation;
}
.tab .n{
  background:#e2e8f0; color:#475569; border-radius:20px;
  font-size:11px; font-weight:800; padding:1px 7px; min-width:20px;
}
.tab[aria-selected="true"]{ background:var(--tc); border-color:var(--tc); color:#fff; }
.tab[aria-selected="true"] .n{ background:rgba(255,255,255,.28); color:#fff; }

/* ---------- Board ---------- */
.board{
  display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
  padding:4px calc(12px + var(--sar)) 96px calc(12px + var(--sal));
  scrollbar-width:none;
}
.board::-webkit-scrollbar{ display:none; }
.col{
  flex:0 0 86vw; scroll-snap-align:center;
  background:#fff; border:1.5px solid var(--line); border-radius:14px;
  display:flex; flex-direction:column; min-height:52vh;
}
.col.dragover{ border-color:var(--col-c,#2563eb); background:var(--col-bg,#eff6ff); }
.col-head{
  padding:12px 14px; border-bottom:1px solid var(--line); border-radius:13px 13px 0 0;
  font-size:14px; font-weight:800; color:var(--col-c,#334155); background:var(--col-bg,#f8fafc);
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.col-head .count{
  background:var(--col-c,#94a3b8); color:#fff; border-radius:20px;
  font-size:11px; padding:2px 9px; font-weight:800; flex:none;
}
.col-body{ padding:10px; display:flex; flex-direction:column; gap:10px; flex:1; }
.empty{
  flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
  color:#94a3b8; font-size:13px; border:1.5px dashed #e2e8f0; border-radius:10px; padding:22px 14px;
}
.col-foot{ padding:0 10px 10px; }
.col-foot button{ width:100%; border-style:dashed; color:var(--sub); }

/* ---------- Karte ---------- */
.card{
  background:#fff; border:1px solid var(--line); border-left:5px solid var(--col-c,#94a3b8);
  border-radius:10px; box-shadow:0 1px 2px rgba(0,0,0,.05);
  display:flex; align-items:stretch; overflow:hidden;
}
.card.dragging{ opacity:.35; }
.card-main{
  flex:1; min-width:0; padding:11px 12px; background:none; border:none;
  text-align:left; font:inherit; color:inherit; min-height:var(--tap);
  display:block; cursor:pointer; touch-action:manipulation;
}
.card .title{ font-weight:700; font-size:14px; line-height:1.3; margin-bottom:4px; word-break:break-word; }
.card .meta{ font-size:12.5px; color:var(--sub); display:flex; justify-content:space-between; gap:8px; }
.card .amt{ font-weight:800; color:var(--ink); }
.card .tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.card .file-tag{
  font-size:11px; color:var(--sub); background:#f1f5f9; border-radius:6px;
  padding:3px 7px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.card .review-tag{
  font-size:11px; background:#fef3c7; color:#92400e; border-radius:6px; padding:3px 7px; font-weight:700;
}
.card .wait-tag{
  font-size:11px; background:#e0e7ff; color:#3730a3; border-radius:6px; padding:3px 7px; font-weight:700;
}
.card-move{
  flex:none; width:46px; min-height:var(--tap); border:none; border-left:1px solid var(--line);
  background:#f8fafc; color:var(--sub); font-size:19px; border-radius:0;
}

/* ---------- Aktionsleiste unten ---------- */
.actionbar{
  position:fixed; z-index:35; left:0; right:0; bottom:0;
  padding:10px calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal));
  background:linear-gradient(to top, #f1f5f9 62%, rgba(241,245,249,0));
  display:flex; gap:8px; align-items:center;
}
.actionbar .grow{ flex:1; }
.actionbar .primary{ box-shadow:0 6px 18px rgba(37,99,235,.35); }

/* ---------- Bottom-Sheet (ersetzt das Desktop-Modal) ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:60;
  display:none; align-items:flex-end; justify-content:center;
}
.overlay.open{ display:flex; }
.sheet{
  background:#fff; width:100%; max-height:92dvh;
  border-radius:18px 18px 0 0; display:flex; flex-direction:column;
  animation:slideUp .22s ease-out; overscroll-behavior:contain;
}
@keyframes slideUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
@media (prefers-reduced-motion:reduce){ .sheet{ animation:none; } }
.sheet-grip{ width:40px; height:4px; background:#cbd5e1; border-radius:4px; margin:9px auto 3px; flex:none; }
.sheet-head{
  padding:6px 16px 12px; border-bottom:1px solid var(--line); flex:none;
  display:flex; align-items:center; gap:8px;
}
.sheet-head h2{ font-size:16px; margin:0; flex:1; }
.sheet-body{
  padding:14px 16px; overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch;
  padding-bottom:calc(14px + var(--sab));
}
.sheet-foot{
  padding:10px 16px calc(10px + var(--sab)); border-top:1px solid var(--line);
  display:flex; gap:8px; flex:none; background:#fff;
}
.sheet-foot .grow{ flex:1; }

/* ---------- Formularfelder ---------- */
.field{ margin-bottom:14px; }
.field label{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--sub); margin-bottom:6px; }
.field input, .field textarea, .field select{
  width:100%; padding:11px 12px; border:1px solid #cbd5e1; border-radius:10px;
  font-family:inherit; font-size:16px;  /* 16px verhindert Auto-Zoom beim Fokus */
  min-height:var(--tap); background:#fff; color:var(--ink);
}
.field textarea{ resize:vertical; min-height:80px; }
.field input:focus, .field textarea:focus, .field select:focus{
  outline:2px solid var(--blue); outline-offset:-1px; border-color:var(--blue);
}
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.filepick{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.filepick button{ flex-direction:column; gap:3px; padding:12px 8px; font-size:13px; min-height:64px; }
.filepick .ic{ font-size:20px; }
.filechip{
  margin-top:10px; display:flex; align-items:center; gap:8px;
  background:#f1f5f9; border-radius:10px; padding:9px 12px; font-size:13px;
}
.filechip .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#analyze-status{ font-size:13px; color:var(--sub); margin-top:9px; min-height:18px; }
#analyze-status.ok{ color:var(--green); font-weight:700; }
.preview{ margin-top:10px; }
.preview img{ max-width:100%; border-radius:8px; border:1px solid var(--line); display:block; }

/* Statuswahl im Verschieben-Sheet */
.statuslist{ display:flex; flex-direction:column; gap:8px; }
.statuslist button{
  width:100%; justify-content:flex-start; gap:10px; padding:14px 14px; min-height:56px;
  border-left:5px solid var(--sc); font-size:15px; text-align:left;
}
.statuslist button[aria-current="true"]{ background:var(--sbg); border-color:var(--sc); }
.statuslist .tick{ margin-left:auto; color:var(--sc); font-weight:800; }
.statuslist button:disabled{ opacity:.45; }
.grouplabel{
  display:flex; align-items:center; gap:7px;
  font-size:12px; font-weight:800; color:#64748b; text-transform:uppercase;
  letter-spacing:.04em; margin:18px 0 8px;
}
.grouplabel:first-of-type{ margin-top:4px; }
.hint{ font-size:12.5px; color:#94a3b8; margin:8px 0 0; }
.steps{ margin:0; padding-left:22px; font-size:14px; line-height:1.55; color:#334155; }
.steps li{ margin-bottom:7px; }

.linklike{
  border:none; background:none; padding:0; min-height:0; font:inherit;
  color:var(--blue); text-decoration:underline; font-weight:700; cursor:pointer;
}

/* Karte: Weg-Kennzeichnung und naechster Schritt */
.card .weg-tag{
  font-size:11px; background:var(--wbg,#f1f5f9); color:var(--wc,#475569);
  border:1px solid var(--wc,#cbd5e1); border-radius:6px; padding:2px 7px; font-weight:700;
}
.card .nextstep{
  display:block; margin-top:7px; font-size:12px; font-weight:700; color:#0f766e;
  background:#f0fdfa; border-radius:6px; padding:4px 8px;
}
.statuslist button.irrelevant{ opacity:.55; }

/* Prozess-Uebersicht */
.wegcard{
  border:1.5px solid var(--wc); border-radius:12px; padding:14px;
  margin:12px 0; background:var(--wbg);
}
.wegcard.an{ box-shadow:0 0 0 3px color-mix(in srgb, var(--wc) 25%, transparent); }
.wegtitle{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-weight:800; font-size:14.5px; color:var(--wc); margin-bottom:10px;
}
.wegnow{
  font-size:10.5px; background:var(--wc); color:#fff; border-radius:20px;
  padding:2px 9px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
}
.wegsteps{ margin:0; padding-left:20px; font-size:13.5px; line-height:1.5; color:#334155; }
.wegsteps li{ margin-bottom:9px; }
.wegsteps li b{ display:block; color:#0f172a; }
.wegsteps li span{ color:#475569; }
.wegsteps li.opt{ opacity:.85; }
.optmark{
  font-size:10px; background:#e2e8f0; color:#475569; border-radius:5px;
  padding:1px 6px; font-weight:700; vertical-align:middle;
}
.weghint{
  margin:11px 0 0; font-size:12.5px; line-height:1.5; color:#475569;
  background:rgba(255,255,255,.75); border-radius:8px; padding:9px 11px;
}
.merk{
  border-left:3px solid #f59e0b; background:#fffbeb; border-radius:0 8px 8px 0;
  padding:9px 12px; margin-bottom:8px; font-size:13px; line-height:1.5;
}
.merk b{ display:block; color:#92400e; margin-bottom:2px; }
.merk span{ color:#78350f; }

/* Dokumentenliste */
.docrow{
  display:flex; align-items:center; gap:8px; padding:8px 10px; margin-bottom:7px;
  background:#f8fafc; border:1px solid var(--line); border-radius:10px;
}
.docicon{ font-size:18px; flex:none; }
.docmain{ flex:1; min-width:0; }
.docmain .dockind{
  width:100%; font-size:13px; font-weight:700; padding:5px 8px; min-height:34px;
  border:1px solid #cbd5e1; border-radius:7px; background:#fff; color:var(--ink);
}
.docname{
  display:block; font-size:11.5px; color:#64748b; margin-top:3px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.docbtn{
  flex:none; width:36px; min-height:36px; padding:0; border-radius:8px;
  font-size:15px; background:#fff;
}
.docbtn.del{ color:#dc2626; border-color:#fecaca; }

/* Bedarfsanzeige */
.bedarf{
  display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline;
  font-size:12.5px; padding:8px 11px; border-radius:8px; margin-top:7px;
  background:#fef2f2; border:1px solid #fecaca; color:#991b1b;
}
.bedarf.ok{ background:#f0fdf4; border-color:#bbf7d0; color:#166534; }
.bedarf b{ font-weight:800; }

/* Karten- und Kennzahlen-Warnungen */
.card .late-tag{
  font-size:11px; background:#fee2e2; color:#991b1b; border-radius:6px;
  padding:3px 7px; font-weight:800;
}
.card .nextstep.miss{ color:#991b1b; background:#fef2f2; }
.stat.warn{ border-color:#fecaca; background:#fef2f2; }
.stat.warn .n{ color:#991b1b; }
.stat.late{ border-color:#fdba74; background:#fff7ed; }
.stat.late .n{ color:#9a3412; }

.history{ margin-top:6px; border-top:1px solid var(--line); padding-top:14px; }
.history h3{ font-size:13px; margin:0 0 8px; color:var(--sub); }
.history ul{ list-style:none; margin:0; padding:0; font-size:13px; }
.history li{ padding:7px 0; border-bottom:1px dashed #f1f5f9; display:flex; justify-content:space-between; gap:10px; color:var(--sub); }
.history li b{ color:var(--ink); white-space:nowrap; }

/* ---------- Toast und Update-Banner ---------- */
.toast{
  position:fixed; left:50%; transform:translateX(-50%);
  bottom:calc(78px + var(--sab)); background:#0f172a; color:#fff;
  padding:11px 18px; border-radius:10px; font-size:14px; max-width:calc(100vw - 32px);
  opacity:0; pointer-events:none; transition:opacity .2s; z-index:90; text-align:center;
}
.toast.show{ opacity:1; }
.updatebar{
  position:fixed; left:0; right:0; bottom:0; z-index:95;
  background:var(--blue); color:#fff; display:none; align-items:center; gap:10px;
  padding:12px calc(14px + var(--sar)) calc(12px + var(--sab)) calc(14px + var(--sal));
  font-size:14px; font-weight:600;
}
.updatebar.show{ display:flex; }
.updatebar button{ margin-left:auto; background:#fff; color:var(--blue); border-color:#fff; min-height:38px; padding:8px 14px; }

/* =======================================================================
   Tablet ab 768px: zwei Spalten nebeneinander, Sheet wird zum Dialog
   ======================================================================= */
@media (min-width:768px){
  .stats{ grid-template-columns:repeat(4,1fr); }
  .col{ flex:0 0 46%; }
  .overlay{ align-items:center; padding:24px; }
  .sheet{ max-width:600px; border-radius:16px; max-height:88dvh; animation:none; }
  .sheet-grip{ display:none; }
  .sheet-head{ padding-top:16px; }
}

/* =======================================================================
   Desktop ab 1024px: klassisches Board, Tabs weg, Maus-Bedienung
   ======================================================================= */
@media (min-width:1024px){
  body{ font-size:14px; }
  .tabs{ display:none; }
  .board{
    display:grid; grid-template-columns:repeat(5,minmax(200px,1fr));
    padding-bottom:88px; overflow:visible;
  }
  .col{ flex:none; min-height:60vh; }
  .card-main{ cursor:pointer; }
  .card[draggable="true"] .card-main{ cursor:grab; }
  .card[draggable="true"]:active .card-main{ cursor:grabbing; }
  .actionbar{
    position:sticky; bottom:0; background:linear-gradient(to top,#f1f5f9 70%,rgba(241,245,249,0));
  }
  .toast{ bottom:96px; }
}
</style>
</head>
<body>

<header class="topbar">
  <h1>Rechnungs-Tracker</h1>
  <span class="saved-indicator" id="savedIndicator"></span>
  <button class="icon-btn" id="btnWege" aria-label="Wie die Erstattung läuft" title="Wie die Erstattung läuft">🗺</button>
  <button class="info-btn" data-info="app" aria-label="Was macht diese App?">i</button>
  <button class="icon-btn" id="btnMenu" aria-label="Menü">⋯</button>
</header>

<div class="stats" id="stats"></div>

<div class="tabs" id="tabs" role="tablist"></div>

<div class="board" id="board"></div>

<div class="actionbar">
  <span class="grow"></span>
  <button class="primary" id="btnAdd">+ Neue Rechnung</button>
</div>

<div class="overlay" id="overlay">
  <div class="sheet" id="sheet" role="dialog" aria-modal="true"></div>
</div>

<div class="popover" id="popover" role="tooltip"></div>
<div class="toast" id="toast"></div>
<div class="updatebar" id="updatebar">
  <span>Neue Version verfügbar</span>
  <button id="btnUpdate">Jetzt laden</button>
</div>

<script src="./vendor/tesseract/tesseract.min.js"></script>
<script>
/* ---------- Spalten ---------- */
const COLUMNS = [
  { key:'bezahlt',          title:'1 · Bezahlt',                    short:'Bezahlt',      c:'#2563eb', bg:'#eff6ff' },
  { key:'oegk_eingereicht', title:'2 · Bei ÖGK eingereicht',        short:'ÖGK offen',    c:'#0891b2', bg:'#ecfeff' },
  { key:'oegk_erstattet',   title:'3 · ÖGK-Erstattung erhalten',    short:'ÖGK erhalten', c:'#7c3aed', bg:'#f5f3ff' },
  { key:'kv_eingereicht',   title:'4 · Bei privater KV eingereicht',short:'Private KV',   c:'#d97706', bg:'#fffbeb' },
  { key:'abgeschlossen',    title:'5 · Abgeschlossen',              c:'#16a34a', short:'Fertig', bg:'#f0fdf4' },
];
const colByKey = Object.fromEntries(COLUMNS.map(c=>[c.key,c]));

/* ==================================================================
   Die drei Erstattungswege. Wichtig: sie sind NICHT gleich.
   Beim Kassenrezept gibt es gar keinen ÖGK-Schritt – eine solche
   Rechnung darf nie in "Bei ÖGK eingereicht" haengen bleiben.
   Jeder Schritt verweist auf die Spalte, die er im Board bedeutet
   (oder auf null, wenn er ausserhalb des Boards passiert).
   ================================================================== */

/* ==================================================================
   Dokumentenrollen. Eine Karte traegt mehrere Dateien mit je einer
   Rolle – nicht mehr eine einzige Datei. Der haeufigste Ablehnungs-
   grund ist ein fehlender Zahlungsnachweis, und die private Kasse
   will zusaetzlich den ÖGK-Bescheid, den es beim Einreichen bei der
   ÖGK noch gar nicht gibt. Deshalb waechst die Karte mit dem Vorgang.
   ================================================================== */
const DOCKINDS = {
  rechnung:         { label:'Rechnung / Honorarnote', kurz:'Rechnung',        icon:'🧾' },
  zahlungsnachweis: { label:'Zahlungsnachweis',       kurz:'Zahlung',         icon:'💳' },
  oegk_bescheid:    { label:'ÖGK-Bescheid',           kurz:'ÖGK-Bescheid',    icon:'🏛' },
  sonstiges:        { label:'Sonstiges',              kurz:'Sonstiges',       icon:'📎' },
};
const DOCKIND_KEYS = Object.keys(DOCKINDS);

/* Welche Rollen braucht dieses Ziel bei diesem Weg? */
const BEDARF = {
  wahlarzt:     { oegk:['rechnung','zahlungsnachweis'], kv:['rechnung','oegk_bescheid'] },
  kassenrezept: {                                       kv:['rechnung'] },
  privatrezept: { oegk:['rechnung','zahlungsnachweis'], kv:['rechnung'] },
};
function bedarfFuer(inv, targetKey){
  const b = (BEDARF[inv.weg || 'wahlarzt'] || {})[targetKey];
  const need = b ? b.slice() : ['rechnung'];
  /* Privatrezept: Der ÖGK-Bescheid wird erst dann verlangt, wenn dort
     ueberhaupt eingereicht wurde – sonst gibt es keinen. */
  if((inv.weg === 'privatrezept') && targetKey === 'kv' && inv.submittedOegkAt) need.push('oegk_bescheid');
  return [...new Set(need)];
}
const docKinds     = inv => new Set((inv.docs||[]).map(d=> d.kind));
const fehlendeDocs = (inv, t) => { const h = docKinds(inv); return bedarfFuer(inv, t).filter(k=> !h.has(k)); };
const docsFuer     = (inv, t) => { const need = bedarfFuer(inv, t);
  return (inv.docs||[]).filter(d=> need.includes(d.kind)); };

/* Altbestand aus der Einzeldatei-Zeit auf docs[] heben. */
function migrate(inv){
  let touched = false;
  if(!Array.isArray(inv.docs)){
    inv.docs = inv.fileData ? [{
      id: uid(), kind:'rechnung', name: inv.fileName || 'Rechnung',
      type: inv.fileType || '', data: inv.fileData, addedAt: inv.createdAt || new Date().toISOString()
    }] : [];
    touched = true;
  }
  if(!inv.weg){ inv.weg = 'wahlarzt'; touched = true; }
  return touched;
}

/* Ab wann gilt ein Vorgang als ueberfaellig? Erfahrungswerte, keine
   gesetzlichen Fristen – sie sollen nur ans Nachfragen erinnern. */
const FRIST = { oegk_eingereicht: 42, kv_eingereicht: 35 };
function ueberfaellig(inv){
  const grenze = FRIST[inv.status];
  if(!grenze) return 0;
  const stamp = inv.status === 'oegk_eingereicht' ? inv.submittedOegkAt : inv.submittedKvAt;
  const d = daysSince(stamp);
  return (d !== null && d > grenze) ? d : 0;
}

/* Welche Spalte kommt fuer diesen Beleg als naechstes? */
function naechsterSchritt(inv){
  const weg = wegOf(inv);
  const idx = weg.steps.findIndex(s=> s.status === inv.status);
  if(inv.status === 'abgeschlossen') return null;
  for(let i = idx + 1; i < weg.steps.length; i++){
    if(weg.steps[i].status) return weg.steps[i];
  }
  return { t:'Abschließen', d:'Alles erstattet – Karte auf „Abgeschlossen“ setzen.', status:'abgeschlossen' };
}
/* Spalten, die auf diesem Weg ueberhaupt vorkommen. */
function statusRelevant(weg, key){
  if(key === 'bezahlt' || key === 'abgeschlossen') return true;
  return WEGE[weg] ? WEGE[weg].steps.some(s=> s.status === key) : true;
}

/* ---------- IndexedDB ---------- */
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    const req = indexedDB.open('rechnungs-tracker', 1);
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('invoices')) d.createObjectStore('invoices', { keyPath:'id' });
    };
    req.onsuccess = e=>{ db = e.target.result; resolve(db); };
    req.onerror = e=> reject(e);
  });
}
function dbAll(){
  return new Promise((resolve,reject)=>{
    const req = db.transaction('invoices','readonly').objectStore('invoices').getAll();
    req.onsuccess = ()=> resolve(req.result || []);
    req.onerror = e=> reject(e);
  });
}
function dbPut(rec){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('invoices','readwrite');
    tx.objectStore('invoices').put(rec);
    tx.oncomplete = ()=>{ markSaved(); resolve(); };
    tx.onerror = e=> reject(e);
  });
}
function dbDelete(id){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction('invoices','readwrite');
    tx.objectStore('invoices').delete(id);
    tx.oncomplete = ()=>{ markSaved(); resolve(); };
    tx.onerror = e=> reject(e);
  });
}
function markSaved(){
  const el = document.getElementById('savedIndicator');
  if(el) el.textContent = '✓ ' + new Date().toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'});
}

const fmtEUR = n => (n===''||n===null||n===undefined||isNaN(n)) ? '–' : Number(n).toLocaleString('de-AT',{style:'currency',currency:'EUR'});
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('de-AT') : '–';
const fmtDateTime = iso => { const d=new Date(iso); return d.toLocaleDateString('de-AT')+' '+d.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}); };
const escapeHTML = s => String(s).replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result); r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function dataURLtoBlob(dataURL, type){
  const [head, b64] = dataURL.split(',');
  const mime = type || (head.match(/:(.*?);/)||[])[1] || 'application/octet-stream';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type:mime });
}
/* Data-URLs sind fuer PDF-Vorschau auf Android unbrauchbar – Blob-URL nutzen. */
function dataURLtoBlobURL(dataURL, type){
  try{ return URL.createObjectURL(dataURLtoBlob(dataURL, type)); }
  catch(e){ return null; }
}
async function copyToClipboard(text){
  try{ await navigator.clipboard.writeText(text); return true; }

const daysSince = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null;

/* ==================================================================
   Lokale Dokumentenanalyse (PDF-Text bzw. OCR) – unveraendert
   ================================================================== */
let pdfjsPromise = null;
function getPdfjs(){
  if(!pdfjsPromise){
    pdfjsPromise = import('./vendor/pdfjs/pdf.min.mjs').then(mod=>{
      mod.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.mjs';
      return mod;
    });
  }
  return pdfjsPromise;
}
let tesseractWorkerPromise = null;
function getTesseractWorker(){
  if(!tesseractWorkerPromise){
    tesseractWorkerPromise = Tesseract.createWorker('deu', 1, {
      workerPath:'./vendor/tesseract/worker.min.js',
      corePath:'./vendor/tesseract/',
      langPath:'./vendor/tesseract/lang/',
      gzip:true,
    });
  }
  return tesseractWorkerPromise;
}
async function analyzePDF(file){
  const pdfjsLib = await getPdfjs();
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const allLines = [];
  for(let p=1; p<=doc.numPages; p++){
    const content = await (await doc.getPage(p)).getTextContent();
    let curY = null, curLine = [];
    for(const item of content.items){
      const y = Math.round(item.transform[5]);
      if(curY === null || Math.abs(y - curY) > 2){
        if(curLine.length) allLines.push(curLine.join(''));
        curLine = [item.str]; curY = y;
      } else curLine.push(item.str);
    }
    if(curLine.length) allLines.push(curLine.join(''));
  }
  return parseInvoiceText(allLines.join('\n'), allLines);
}
async function analyzeImage(file){
  const worker = await getTesseractWorker();
  const { data } = await worker.recognize(await fileToDataURL(file));
  const text = data.text || '';
  return parseInvoiceText(text, text.split('\n'));
}
function normalizeAmount(raw){
  raw = raw.trim();
  if(raw.includes(',')) raw = raw.replace(/\./g,'').replace(',', '.');
  else if(/\.\d{1,2}$/.test(raw)){ /* bereits Dezimalpunkt */ }
  else raw = raw.replace(/\./g,'');
  return parseFloat(raw);
}
function extractAmount(text){
  const patterns = [
    /(?:Gesamtbetrag|Rechnungsbetrag|Endbetrag|Zahlbetrag|Zu\s*zahlen|Summe)[^\d€]{0,20}([\d.,]+)\s*(?:€|EUR)?/i,
    /€\s*([\d.,]+)/, /([\d.,]+)\s*EUR/i, /([\d.,]+)\s*€/,
  ];
  for(const re of patterns){
    const m = text.match(re);
    if(m){ const n = normalizeAmount(m[1]); if(!isNaN(n) && n > 0 && n < 100000) return n; }
  }
  return null;
}
function extractDate(text){
  const m = text.match(/(\d{1,2})[.\/](\d{1,2})[.\/](\d{2,4})/);
  if(!m) return null;
  let [, d, mo, y] = m;
  if(y.length === 2) y = '20' + y;
  const mm = mo.padStart(2,'0'), dd = d.padStart(2,'0');
  if(Number(mm) < 1 || Number(mm) > 12 || Number(dd) < 1 || Number(dd) > 31) return null;
  return `${y.padStart(4,'0')}-${mm}-${dd}`;
}
function extractIssuer(lines){
  const nonEmpty = lines.map(l=> l.trim()).filter(Boolean);
  const docLine = nonEmpty.find(l=> /^(Dr\.|Prim\.|Univ\.-Prof\.|Mag\.|Doz\.|OA\b)/i.test(l));
  if(docLine) return docLine.slice(0,80);
  const apoLine = nonEmpty.find(l=> /apotheke/i.test(l));
  if(apoLine) return apoLine.slice(0,80);
  return (nonEmpty[0] || '').slice(0,80);
}
function parseInvoiceText(text, lines){
  return { amount: extractAmount(text), date: extractDate(text), issuer: extractIssuer(lines), rawText:text };
}
/* ==================================================================
   QR-Code auf dem Beleg ("Zahlen mit Code", EPC069-12 / Stuzza).
   Liefert Betrag, Empfaenger und Referenz exakt statt geraten.
   Faellt still auf OCR zurueck, wenn kein Code da ist oder die
   BarcodeDetector-API fehlt (z. B. Firefox, aeltere Systeme).
   ================================================================== */
function parseEPC(raw){
  const l = String(raw).split(/\r?\n/);
  if((l[0]||'').trim().toUpperCase() !== 'BCD') return null;
  const m = (l[7]||'').trim().match(/^EUR\s*([\d.]+)$/i);
  const amount = m ? parseFloat(m[1]) : null;
  return {
    creditor : (l[5]||'').trim(),
    iban     : (l[6]||'').trim(),
    amount   : (amount && amount > 0 && amount < 100000) ? amount : null,
    reference: (l[9]||'').trim() || (l[10]||'').trim(),
  };
}
async function qrCapable(){
  if(!('BarcodeDetector' in window)) return false;
  try{ return (await BarcodeDetector.getSupportedFormats()).includes('qr_code'); }
  catch(e){ return false; }
}
async function pdfFirstPageCanvas(file){
  const pdfjsLib = await getPdfjs();
  const doc  = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const page = await doc.getPage(1);
  const vp   = page.getViewport({ scale:2 });   // 2x: kleine QR-Codes bleiben lesbar
  const canvas = document.createElement('canvas');
  canvas.width = vp.width; canvas.height = vp.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  return canvas;
}
async function scanPaymentQR(file){
  try{
    if(!await qrCapable()) return null;
    let source;
    if(file.type === 'application/pdf')            source = await pdfFirstPageCanvas(file);
    else if(file.type.startsWith('image/'))        source = await createImageBitmap(file);
    else return null;

    const codes = await new BarcodeDetector({ formats:['qr_code'] }).detect(source);
    if(source.close) source.close();
    for(const c of codes){
      const p = parseEPC(c.rawValue);
      if(p && (p.amount != null || p.creditor)) return p;
    }
  }catch(err){ console.warn('QR-Erkennung übersprungen:', err); }
  return null;
}

async function analyzeInvoiceFile(file){
  let base = null;
  try{
    if(file.type === 'application/pdf')            base = await analyzePDF(file);
    else if(file.type && file.type.startsWith('image/')) base = await analyzeImage(file);
  }catch(err){ console.error('Analyse fehlgeschlagen:', err); }

  /* QR schlaegt OCR: exakte Werte ueberschreiben geratene. */
  const qr = await scanPaymentQR(file);
  if(qr){
    base = base || { amount:null, date:null, issuer:'', rawText:'' };
    if(qr.amount   != null) base.amount = qr.amount;
    if(qr.creditor)         base.issuer = qr.creditor;
    base.reference = qr.reference || '';
    base.iban      = qr.iban || '';
    base.fromQR    = true;
  }
  return base;
}

/* ---------- Zustand und Darstellung ---------- */
let invoices = [];
const isDesktop = ()=> window.matchMedia('(min-width:1024px)').matches;

async function loadAll(){
  invoices = await dbAll();
  /* Migration einmalig zurueckschreiben, damit sie stabil bleibt. */
  for(const inv of invoices){ if(migrate(inv)) await dbPut(inv); }
  render();
}
function render(){ renderStats(); renderTabs(); renderBoard(); updateBadge(); }

/* Zahl auf dem App-Icon: was ist bezahlt, aber noch nirgends eingereicht. */
function updateBadge(){
  try{
    const offen = invoices.filter(i=> i.status === 'bezahlt').length;
    if(!('setAppBadge' in navigator)) return;
    if(offen > 0) navigator.setAppBadge(offen).catch(()=>{});
    else navigator.clearAppBadge().catch(()=>{});
  }catch(e){ /* Badging nicht verfuegbar – unkritisch */ }
}

function renderStats(){
  const total = invoices.length;
  const offen = invoices.filter(i=> i.status!=='abgeschlossen');
  const sumOffen = offen.reduce((s,i)=> s + (Number(i.amount)||0), 0);
  const sumDone  = invoices.filter(i=> i.status==='abgeschlossen').reduce((s,i)=> s + (Number(i.amount)||0), 0);
  /* Handlungsbedarf ist die eigentlich interessante Zahl: was haengt
     an mir, und was haengt an der Gegenseite und dauert zu lange. */
  const unvollstaendig = invoices.filter(i=>{
    const s = naechsterSchritt(i);
    if(!s) return false;
    const z = s.status === 'oegk_eingereicht' ? 'oegk' : s.status === 'kv_eingereicht' ? 'kv' : null;
    return z && fehlendeDocs(i, z).length > 0;
  });
  const spaet = invoices.filter(i=> ueberfaellig(i) > 0);

  document.getElementById('stats').innerHTML = `
    <div class="stat"><div class="n">${offen.length}</div><div class="l">in Bearbeitung</div></div>
    <div class="stat"><div class="n">${fmtEUR(sumOffen)}</div><div class="l">offen</div></div>
    <div class="stat ${unvollstaendig.length?'warn':''}"><div class="n">${unvollstaendig.length}</div>
      <div class="l">Dokument fehlt</div></div>
    <div class="stat ${spaet.length?'late':''}"><div class="n">${spaet.length}</div>
      <div class="l">überfällig</div></div>`;
}

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = COLUMNS.map((c,i)=>`
    <button class="tab" role="tab" data-idx="${i}" style="--tc:${c.c}"
            aria-selected="${i===activeCol}">
      ${escapeHTML(c.short)}<span class="n">${invoices.filter(v=>v.status===c.key).length}</span>
    </button>`).join('');
  el.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=> scrollToCol(Number(t.dataset.idx)));
  });
}

let activeCol = 0;
function scrollToCol(idx){
  const board = document.getElementById('board');
  const col = board.children[idx];
  if(!col) return;
  activeCol = idx;
  if(!isDesktop()) board.scrollTo({ left: col.offsetLeft - board.offsetLeft - 12, behavior:'smooth' });
  syncTabs();
}
function syncTabs(){
  document.querySelectorAll('#tabs .tab').forEach(t=>
    t.setAttribute('aria-selected', String(Number(t.dataset.idx) === activeCol)));
}

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLUMNS.forEach((col, idx)=>{
    const items = invoices.filter(i=> i.status === col.key)
                          .sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));
    const colEl = document.createElement('div');
    colEl.className = 'col';
    colEl.style.setProperty('--col-c', col.c);
    colEl.style.setProperty('--col-bg', col.bg);
    colEl.dataset.key = col.key;
    colEl.innerHTML = `
      <div class="col-head"><span>${escapeHTML(col.title)}</span><span class="count">${items.length}</span></div>
      <div class="col-body"></div>
      <div class="col-foot"><button data-add="${col.key}">+ Rechnung hier anlegen</button></div>`;

    const body = colEl.querySelector('.col-body');
    if(items.length === 0) body.innerHTML = `<div class="empty">Noch keine Rechnung hier</div>`;
    else items.forEach(inv=> body.appendChild(renderCard(inv, col)));

    colEl.querySelector('[data-add]').addEventListener('click', ()=> openEditor(null, col.key));

    /* Drag & Drop bleibt als Desktop-Komfort erhalten – auf Touch feuert
       die HTML5-Drag-API keine Events, dort greift der ⇄-Button. */
    ['dragenter','dragover'].forEach(evt=> colEl.addEventListener(evt, e=>{
      e.preventDefault(); colEl.classList.add('dragover');
    }));
    colEl.addEventListener('dragleave', e=>{ if(!colEl.contains(e.relatedTarget)) colEl.classList.remove('dragover'); });
    colEl.addEventListener('drop', async e=>{
      e.preventDefault(); colEl.classList.remove('dragover');
      if(e.dataTransfer.files && e.dataTransfer.files.length){
        for(const file of e.dataTransfer.files) await createInvoiceFromFile(file, col.key);
        await loadAll();
        toast('Rechnung hinzugefügt – wird analysiert …');
      } else {
        const id = e.dataTransfer.getData('text/plain');
        if(id) await moveInvoice(id, col.key);
      }
    });
    board.appendChild(colEl);
  });
  syncTabs();
}

/* Wie lange liegt der Beleg schon bei der jeweiligen Stelle? */
function liegezeit(inv){
  const stamp = inv.status === 'oegk_eingereicht' ? inv.submittedOegkAt
              : inv.status === 'kv_eingereicht'   ? inv.submittedKvAt : null;
  const d = daysSince(stamp);
  if(d === null) return '';
  if(d === 0) return 'heute eingereicht';
  return 'seit ' + d + ' Tag' + (d === 1 ? '' : 'en');
}

/* Eine Zeile pro Karte: entweder was fehlt, oder was als Naechstes ansteht.
   Fehlende Dokumente haben Vorrang – sie blockieren den naechsten Schritt. */
function kartenHinweis(inv){
  const schritt = naechsterSchritt(inv);
  if(!schritt) return '';
  const ziel = schritt.status === 'oegk_eingereicht' ? 'oegk'
             : schritt.status === 'kv_eingereicht'   ? 'kv' : null;
  if(ziel){
    const fehlt = fehlendeDocs(inv, ziel);
    if(fehlt.length){
      return `<span class="nextstep miss">⚠ fehlt: ${escapeHTML(fehlt.map(k=> DOCKINDS[k].kurz).join(', '))}</span>`;
    }
  }
  return `<span class="nextstep">→ ${escapeHTML(schritt.t)}</span>`;
}

function renderCard(inv, col){
  const el = document.createElement('div');
  el.className = 'card';
  el.style.setProperty('--col-c', col.c);
  el.dataset.id = inv.id;
  if(isDesktop()) el.draggable = true;
  el.innerHTML = `
    <button class="card-main" type="button">
      <span class="title">${escapeHTML(inv.title || 'Ohne Bezeichnung')}</span>
      <span class="meta"><span>${fmtDate(inv.date)}</span><span class="amt">${fmtEUR(inv.amount)}</span></span>
      <span class="tags">
        <span class="weg-tag" style="--wc:${wegOf(inv).c};--wbg:${wegOf(inv).bg}">${wegOf(inv).icon} ${escapeHTML(wegOf(inv).kurz)}</span>
        ${(inv.docs||[]).length ? `<span class="file-tag">📎 ${(inv.docs||[]).length}</span>` : ''}
        ${ueberfaellig(inv) ? `<span class="late-tag">🔔 seit ${ueberfaellig(inv)} Tagen – nachfragen</span>`
          : (liegezeit(inv) ? `<span class="wait-tag">⏳ ${liegezeit(inv)}</span>` : '')}
        ${inv.needsReview ? `<span class="review-tag">⚠ prüfen</span>` : ''}
      </span>
      ${kartenHinweis(inv)}
    </button>
    <button class="card-move" type="button" aria-label="Aktionen" title="Aktionen">⋮</button>`;

  el.querySelector('.card-main').addEventListener('click', ()=> openEditor(inv.id));
  el.querySelector('.card-move').addEventListener('click', e=>{ e.stopPropagation(); openMoveSheet(inv.id); });

    e.dataTransfer.setData('text/plain', inv.id);
    e.dataTransfer.effectAllowed = 'move';
    setTimeout(()=> el.classList.add('dragging'), 0);
  });

/* Board-Scroll haelt die Tabs synchron */
(function(){
  const board = document.getElementById('board');
  let ticking = false;
  board.addEventListener('scroll', ()=>{
    if(ticking || isDesktop()) return;
    ticking = true;
    requestAnimationFrame(()=>{
      const mid = board.scrollLeft + board.clientWidth/2;
      let best = 0, bestD = Infinity;
      [...board.children].forEach((c,i)=>{
        const d = Math.abs((c.offsetLeft - board.offsetLeft) + c.offsetWidth/2 - mid);
        if(d < bestD){ bestD = d; best = i; }
      });
      if(best !== activeCol){ activeCol = best; syncTabs(); }
      ticking = false;
    });
  }, { passive:true });
})();

/* ---------- Datensatz-Operationen ---------- */
async function createInvoiceFromFile(file, status){
  const now = new Date().toISOString();
  const id = uid();
  await dbPut({
    id, title: file.name.replace(/\.[a-z0-9]+$/i,''), amount:'', date: now.slice(0,10), note:'',
    status, weg:'wahlarzt', fileName:file.name, fileType:file.type, fileData: await fileToDataURL(file),
    createdAt:now, updatedAt:now, needsReview:false,
    history:[{ status, at:now, label: colByKey[status].title }]
  });
  analyzeAndFill(id, file);   // laeuft im Hintergrund weiter
  return id;
}
async function analyzeAndFill(id, file){
  const result = await analyzeInvoiceFile(file);
  if(!result) return;
  const current = (await dbAll()).find(i=> i.id === id);
  if(!current) return;
  let changed = false;
  const defaultTitle = file.name.replace(/\.[a-z0-9]+$/i,'');
  if(result.amount != null && (current.amount === '' || current.amount == null)){ current.amount = result.amount; changed = true; }
  if(result.date && !current.date){ current.date = result.date; changed = true; }
  if(result.issuer && current.title === defaultTitle){ current.title = result.issuer; changed = true; }
  if(result.reference && !current.reference){ current.reference = result.reference; changed = true; }
  if(result.iban && !current.iban){ current.iban = result.iban; changed = true; }
  if(changed){
    current.needsReview = true;
    current.updatedAt = new Date().toISOString();
    await dbPut(current); await loadAll();
    toast('🔍 „' + (current.title || defaultTitle) + '“ analysiert – bitte prüfen');
  }
}
async function moveInvoice(id, newStatus){
  const inv = invoices.find(i=> i.id === id);
  if(!inv || inv.status === newStatus) return;
  inv.status = newStatus;
  inv.updatedAt = new Date().toISOString();
  inv.history = inv.history || [];
  inv.history.push({ status:newStatus, at: inv.updatedAt, label: colByKey[newStatus].title });
  await dbPut(inv); await loadAll();
  /* Mitscrollen: sonst verschwindet die Karte am Handy kommentarlos
     in eine Spalte, die gerade gar nicht sichtbar ist. */
  const idx = COLUMNS.findIndex(c=> c.key === newStatus);
  if(idx >= 0) scrollToCol(idx);
  toast('Verschoben nach: ' + colByKey[newStatus].short);
}
async function deleteInvoice(id){
  if(!confirm('Diese Rechnung wirklich löschen?')) return;
  await dbDelete(id); closeSheet(); await loadAll();
  toast('Rechnung gelöscht');
}

/* ==================================================================
   Beleg an eine fremde App weitergeben (Web Share API Level 2).
   Absichtlich kein Auto-Status: navigator.share() loest bereits auf,
   sobald Android die Datei uebergeben hat – ob du im Kassenformular
   dann wirklich abgeschickt hast, weiss diese App nicht. Deshalb
   fragt sie danach einmal nach, statt es zu behaupten.
   ================================================================== */
function shareSummary(inv){
  return [
    inv.title || 'Rechnung',
    inv.date ? 'Datum: ' + fmtDate(inv.date) : null,
    (inv.amount !== '' && inv.amount != null) ? 'Betrag: ' + fmtEUR(inv.amount) : null,
    inv.reference ? 'Referenz: ' + inv.reference : null,
  ].filter(Boolean).join('\n');
}

/* Dateiname, der im Auswaehler der Kassen-App sofort auffindbar ist:
   nach Datum sortierbar, mit Aussteller und Betrag, ohne Umlaute und
   Sonderzeichen (manche Uploader stolpern darueber). */
function belegDateiname(inv, doc, mitRolle){
  const clean = s => String(s||'')
    .replace(/ä/gi,'ae').replace(/ö/gi,'oe').replace(/ü/gi,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  const d      = doc || (inv.docs||[])[0] || { name: inv.fileName, type: inv.fileType, kind:'rechnung' };
  const ext    = (d.name||'').match(/\.[a-z0-9]+$/i);
  const datum  = inv.date || new Date().toISOString().slice(0,10);
  const betrag = (inv.amount !== '' && inv.amount != null && !isNaN(inv.amount) && inv.amount !== 0)
               ? '_' + String(Number(inv.amount).toFixed(2)).replace('.','-') + 'EUR' : '';
  /* Rolle mit in den Namen, sobald mehrere Dateien gleichzeitig
     abgelegt werden – sonst sind sie im Auswaehler nicht zu trennen. */
  const rolle  = mitRolle ? '_' + clean(DOCKINDS[d.kind] ? DOCKINDS[d.kind].kurz : 'Beleg') : '';
  return 'Rechnung_' + datum + '_' + (clean(inv.title) || 'Beleg') + betrag + rolle +
         (ext ? ext[0] : (d.type === 'application/pdf' ? '.pdf' : '.jpg'));
}

function invoiceFile(inv){
  const d = (inv.docs||[]).find(x=> x.kind === 'rechnung') || (inv.docs||[])[0];
  if(!d) throw new Error('kein Dokument');
  return new File([dataURLtoBlob(d.data, d.type)],
                  belegDateiname(inv, d, false), { type: d.type || 'application/octet-stream' });
}

/* Hauptweg: Beleg in Downloads ablegen. Von dort holt ihn der
   Dateiauswaehler der ÖGK- bzw. Versicherungs-App. */
async function saveForUpload(id, targetKey){
  const inv    = invoices.find(i=> i.id === id);
  const target = SEND_TARGETS.find(t=> t.key === targetKey);
  if(!inv || !target) return;

  /* Vollstaendigkeit VOR dem Upload pruefen. Ein fehlender Zahlungs-
     nachweis kostet sonst Wochen, weil die Ablehnung erst spaeter kommt. */
  const fehlt = fehlendeDocs(inv, targetKey);
  if(fehlt.length){ zeigeFehlend(id, target, fehlt); return; }

  const docs = docsFuer(inv, targetKey);
  if(!docs.length){ toast('Keine Dokumente angehängt'); return; }

  const namen = [];
  for(let i = 0; i < docs.length; i++){
    const d = docs[i];
    const name = belegDateiname(inv, d, docs.length > 1);
    let url;
    try{ url = dataURLtoBlobURL(d.data, d.type); }catch(e){ continue; }
    if(!url) continue;
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 30000);
    namen.push(name);
    /* Browser drosseln Mehrfach-Downloads – kurz Luft lassen. */
    if(i < docs.length - 1) await new Promise(r=> setTimeout(r, 450));
  }

  await copyToClipboard(shareSummary(inv));
  showUploadSteps(id, target, namen);
}

/* Was fehlt, sagen – und den Weg zum Nachtragen gleich anbieten. */
function zeigeFehlend(id, target, fehlt){
  openSheet(`
    <div class="sheet-head"><h2>Noch nicht vollständig</h2>
      <button class="icon-btn" data-close aria-label="Schließen">✕</button></div>

        ${escapeHTML(target.app)} verlangt zusätzlich:

      ${fehlt.map(k=>`<div class="merk"><b>${DOCKINDS[k].icon} ${escapeHTML(DOCKINDS[k].label)}</b>
        <span>${escapeHTML(erklaerung(k))}</span></div>`).join('')}
      <div class="statuslist" style="margin-top:14px">
        <button type="button" id="nachtragen" style="--sc:#2563eb;--sbg:#eff6ff">📎 Jetzt nachtragen</button>
        <button type="button" id="trotzdem" style="--sc:#94a3b8">Trotzdem speichern</button>
      </div>
    </div>`);
  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
  sheet.querySelector('#nachtragen').addEventListener('click', ()=>{ closeSheet(); openEditor(id); });
  sheet.querySelector('#trotzdem').addEventListener('click', async ()=>{
    closeSheet();
    const inv = invoices.find(i=> i.id === id);
    const docs = (inv.docs||[]);
    if(!docs.length){ toast('Keine Dokumente angehängt'); return; }
    const namen = [];
    for(const d of docs){
      const name = belegDateiname(inv, d, docs.length > 1);
      const url = dataURLtoBlobURL(d.data, d.type);
      if(!url) continue;
      const a = document.createElement('a');
      a.href = url; a.download = name; a.rel='noopener';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=> URL.revokeObjectURL(url), 30000);
      namen.push(name);
      await new Promise(r=> setTimeout(r, 450));
    }
    await copyToClipboard(shareSummary(inv));
    showUploadSteps(id, target, namen);
  });
}
function erklaerung(kind){
  return {
    rechnung:'Die Honorarnote oder der Apothekenbeleg selbst.',
    zahlungsnachweis:'Zahlungsvermerk auf der Rechnung, Einzahlungsbeleg, E-Banking-Beleg oder Kontoauszug. Ohne diesen lehnt die ÖGK ab.',
    oegk_bescheid:'Die Erstattungsmitteilung oder das Ablehnungsschreiben der ÖGK. Die private Versicherung rechnet erst damit ab.',

}

/* Nebenweg: alles, was Teilen tatsaechlich annimmt (Mail, Cloud, Chat). */
async function shareInvoice(id){
  const inv = invoices.find(i=> i.id === id);
  if(!inv || !inv.fileData){ toast('Kein Beleg angehängt'); return; }
  let file;
  try{ file = invoiceFile(inv); }catch(e){ toast('Beleg konnte nicht gelesen werden'); return; }
  if(!(navigator.canShare && navigator.canShare({ files:[file] }))){
    toast('Teilen wird hier nicht unterstützt – nimm „speichern“'); return;
  }
  await copyToClipboard(shareSummary(inv));
  try{ await navigator.share({ files:[file], title: inv.title || 'Rechnung', text: shareSummary(inv) }); }
  catch(err){ if(!err || err.name !== 'AbortError') toast('Teilen abgebrochen'); }
}

              : (relevant ? '' : '<span class="tick" style="color:#94a3b8;font-weight:600">nicht nötig</span>')}
          </button>`;}).join('')}
      </div>
      <p class="hint">Weg: ${wegOf(inv).icon} ${escapeHTML(wegOf(inv).label)} ·
        <button type="button" class="linklike" data-wege="1">Ablauf ansehen</button></p>
    </div>`);
  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
  sheet.querySelectorAll('[data-send]').forEach(b=>{
    b.addEventListener('click', ()=>{
      const key = b.dataset.send;
      closeSheet();
      saveForUpload(id, key);
    });
  });
  const shareBtn = sheet.querySelector('[data-share]');
  if(shareBtn) shareBtn.addEventListener('click', ()=>{ closeSheet(); shareInvoice(id); });
  const wegeBtn = sheet.querySelector('[data-wege]');
  if(wegeBtn) wegeBtn.addEventListener('click', ()=> openWegeSheet(inv.weg || 'wahlarzt'));
  sheet.querySelectorAll('[data-status]').forEach(b=>{
    b.addEventListener('click', async ()=>{
      const s = b.dataset.status;
      closeSheet();
      if(s !== inv.status) await moveInvoice(id, s);
    });
  });
}

function openEditor(id, presetStatus){
  const inv = id ? invoices.find(i=> i.id === id) : null;
  pendingDocs = inv ? (inv.docs||[]).map(d=> ({...d})) : [];
  editorSubmittedOegk = inv ? (inv.submittedOegkAt || null) : null;
  pendingRef  = inv ? (inv.reference || '') : '';
  pendingIban = inv ? (inv.iban || '') : '';

  openSheet(`
    <div class="sheet-head">
      <h2>${inv ? 'Rechnung bearbeiten' : 'Neue Rechnung'}</h2>
      <button class="icon-btn" data-close aria-label="Schließen">✕</button>
    </div>
    <div class="sheet-body">
      <div class="field">
        <label>Bezeichnung</label>
        <input type="text" id="f-title" value="${inv ? escapeHTML(inv.title) : ''}" placeholder="z. B. Dr. Müller – Kontrolle">
      </div>
      <div class="row2">
        <div class="field"><label>Betrag (€)</label>
          <input type="number" inputmode="decimal" step="0.01" id="f-amount" value="${inv ? inv.amount : ''}" placeholder="0,00"></div>
        <div class="field"><label>Datum</label>
          <input type="date" id="f-date" value="${inv ? inv.date : new Date().toISOString().slice(0,10)}"></div>
      </div>
      <div class="field">
        <label>Art des Belegs</label>
        <select id="f-weg">${WEG_KEYS.map(k=>
          `<option value="${k}" ${k===(inv?(inv.weg||'wahlarzt'):'wahlarzt')?'selected':''}>${WEGE[k].icon} ${escapeHTML(WEGE[k].label)}</option>`).join('')}</select>
        <p class="hint" id="wegHint"></p>
      </div>
      <div class="field">
        <label>Status</label>
        <select id="f-status">${COLUMNS.map(c=>
          `<option value="${c.key}" ${c.key===(inv?inv.status:(presetStatus||'bezahlt'))?'selected':''}>${escapeHTML(c.title)}</option>`).join('')}</select>
      </div>
      <div class="field">
        <label>Dokumente
          <button class="info-btn" data-info="docs" aria-label="Welche Dokumente brauche ich?">i</button>
          <button class="info-btn" data-info="qr" aria-label="QR-Code auf der Rechnung">QR</button>
        </label>
        <div id="docList"></div>
        <div class="filepick" style="margin-top:8px">
          <button type="button" id="btnCam"><span class="ic">📷</span>Foto aufnehmen</button>
          <button type="button" id="btnFile"><span class="ic">📄</span>Datei wählen</button>
        </div>
        <input type="file" id="f-cam"  accept="image/*" capture="environment" hidden>
        <input type="file" id="f-file" accept="application/pdf,image/*" multiple hidden>
        <div id="refWrap"></div>
        <div id="analyze-status"></div>
        <div id="bedarfWrap"></div>
      </div>
      ${inv ? `<div class="field"><label>Beleg bereitstellen
        <button class="info-btn" data-info="senden" aria-label="Warum speichern statt senden?">i</button></label>
        <div class="filepick">
          ${SEND_TARGETS.map(t=>`<button type="button" data-send="${t.key}" ${inv.fileData?'':'disabled'}>
            <span class="ic">${t.icon}</span>${escapeHTML(t.key==='oegk'?'Für ÖGK':'Für Versicherung')}</button>`).join('')}
        </div></div>` : ''}
      <div class="field">
        <label>Notiz</label>
        <textarea id="f-note" placeholder="z. B. Belegnummer, Frist ...">${inv ? escapeHTML(inv.note||'') : ''}</textarea>

/* ---------- Dokumentenliste im Editor ---------- */
function renderDocs(){
  const wrap = document.getElementById('docList');
  if(!wrap) return;
  if(!pendingDocs.length){
    wrap.innerHTML = '<p class="hint" style="margin:0">Noch kein Dokument. Rechnung fotografieren oder PDF wählen.</p>';
  } else {
    wrap.innerHTML = pendingDocs.map(d=>`
      <div class="docrow" data-doc="${d.id}">
        <span class="docicon">${DOCKINDS[d.kind] ? DOCKINDS[d.kind].icon : '📎'}</span>
        <div class="docmain">
          <select class="dockind" data-doc="${d.id}" aria-label="Rolle des Dokuments">
            ${DOCKIND_KEYS.map(k=>`<option value="${k}" ${k===d.kind?'selected':''}>${escapeHTML(DOCKINDS[k].label)}</option>`).join('')}
          </select>
          <span class="docname">${escapeHTML(d.name)}</span>
        </div>
        <button type="button" class="docbtn" data-open="${d.id}" aria-label="Öffnen">↗</button>
        <button type="button" class="docbtn del" data-del="${d.id}" aria-label="Entfernen">✕</button>
      </div>`).join('');
  }
  wrap.querySelectorAll('.dockind').forEach(s=> s.addEventListener('change', ()=>{
    const d = pendingDocs.find(x=> x.id === s.dataset.doc);
    if(d){ d.kind = s.value; renderDocs(); renderBedarf(); }
  }));
  wrap.querySelectorAll('[data-open]').forEach(b=> b.addEventListener('click', ()=>{
    const d = pendingDocs.find(x=> x.id === b.dataset.open);
    const url = d && dataURLtoBlobURL(d.data, d.type);
    if(url) window.open(url, '_blank'); else toast('Datei kann nicht geöffnet werden');
  }));
  wrap.querySelectorAll('[data-del]').forEach(b=> b.addEventListener('click', ()=>{
    pendingDocs = pendingDocs.filter(x=> x.id !== b.dataset.del);
    renderDocs(); renderBedarf();
  }));
}

/* Was fehlt noch – live, waehrend man Rollen zuweist. */
function renderBedarf(){
  const wrap = document.getElementById('bedarfWrap');
  if(!wrap) return;
  const wegSel = document.getElementById('f-weg');
  const probe  = { weg: wegSel ? wegSel.value : 'wahlarzt', docs: pendingDocs,
                   submittedOegkAt: editorSubmittedOegk };
  const rows = SEND_TARGETS
    .filter(t=> (BEDARF[probe.weg] || {})[t.key])
    .map(t=>{
      const fehlt = fehlendeDocs(probe, t.key);
      return `<div class="bedarf ${fehlt.length?'':'ok'}">
        <b>${t.icon} ${escapeHTML(t.key === 'oegk' ? 'Für die ÖGK' : 'Für die private KV')}</b>
        <span>${fehlt.length
          ? 'fehlt noch: ' + fehlt.map(k=> DOCKINDS[k].kurz).join(', ')
          : 'vollständig'}</span></div>`;
    }).join('');
  wrap.innerHTML = rows || '';
}

/* Neues Dokument aufnehmen. Rolle wird geraten: das erste ist die
   Rechnung, danach Zahlungsnachweis, sonst Sonstiges. Umstellbar. */
function rateRolle(){
  const have = new Set(pendingDocs.map(d=> d.kind));
  if(!have.has('rechnung'))         return 'rechnung';
  if(!have.has('zahlungsnachweis')) return 'zahlungsnachweis';
  return 'sonstiges';
}

async function setPendingFile(file){
  const doc = { id: uid(), kind: rateRolle(), name: file.name || 'Beleg',
                type: file.type || '', data: await fileToDataURL(file),
                addedAt: new Date().toISOString() };
  pendingDocs.push(doc);
  renderDocs(); renderBedarf();

  /* Analysiert wird nur die Rechnung – ein Zahlungsnachweis hat keine
     Rechnungsdaten und wuerde die Felder mit Unsinn ueberschreiben. */
  if(doc.kind !== 'rechnung') return;

  const statusEl = document.getElementById('analyze-status');
  if(statusEl){ statusEl.className=''; statusEl.textContent = '🔍 Beleg wird lokal analysiert …'; }
  const result = await analyzeInvoiceFile(file);
  const el = document.getElementById('analyze-status');
  if(!el) return;   /* Sheet wurde inzwischen geschlossen */
  if(result && (result.amount != null || result.date || result.issuer)){
    el.className = 'ok';
    el.textContent = result.fromQR
      ? '✓ aus Zahlungs-QR gelesen – exakte Werte'
      : '✓ automatisch erkannt – bitte prüfen';
    const a = document.getElementById('f-amount'), d = document.getElementById('f-date'), t = document.getElementById('f-title');
    /* QR-Werte sind exakt und duerfen ueberschreiben, OCR-Werte nur fuellen. */
    if(a && result.amount != null && (!a.value || result.fromQR)) a.value = result.amount;
    if(d && result.date) d.value = result.date;
    if(t && result.issuer && (!t.value || result.fromQR)) t.value = result.issuer;
    pendingRef  = result.reference || '';
    pendingIban = result.iban || '';
    const rw = document.getElementById('refWrap');
    if(rw) rw.innerHTML = pendingRef ? `<div class="filechip"><span>🔖</span><span class="nm">Referenz: ${escapeHTML(pendingRef)}</span></div>` : '';
  } else el.textContent = 'Keine automatische Erkennung möglich – bitte manuell ausfüllen.';
}

function renderHistory(inv){
  const items = (inv.history||[]).slice().reverse()
    .map(h=> `<li><span>${escapeHTML(h.label)}</span><b>${fmtDateTime(h.at)}</b></li>`).join('');
  return `<div class="history"><h3>Verlauf</h3><ul>${items || '<li>Kein Verlauf</li>'}</ul></div>`;
}

async function saveEditor(id){
  const title  = document.getElementById('f-title').value.trim() || 'Ohne Bezeichnung';
  const amount = document.getElementById('f-amount').value;
  const date   = document.getElementById('f-date').value;
  const status = document.getElementById('f-status').value;
  const weg    = (document.getElementById('f-weg')||{}).value || 'wahlarzt';
  const note   = document.getElementById('f-note').value;
  const now    = new Date().toISOString();

  if(id){
    const inv = invoices.find(i=> i.id === id);
    const statusChanged = inv.status !== status;
    Object.assign(inv, { title, amount, date, note, status, weg, needsReview:false, updatedAt:now,
                         reference: pendingRef, iban: pendingIban });
    inv.docs = pendingDocs;
    const haupt = pendingDocs.find(d=> d.kind === 'rechnung') || pendingDocs[0];
    inv.fileName = haupt ? haupt.name : ''; inv.fileType = haupt ? haupt.type : ''; inv.fileData = haupt ? haupt.data : '';
    inv.history = inv.history || [];
    if(statusChanged) inv.history.push({ status, at:now, label: colByKey[status].title });
    await dbPut(inv);
  } else {
    await dbPut({
      id: uid(), title, amount, date, note, status, weg,
      docs: pendingDocs,
      fileName: (pendingDocs[0]||{}).name || '',
      fileType: (pendingDocs[0]||{}).type || '',
      fileData: (pendingDocs[0]||{}).data || '',
      reference: pendingRef, iban: pendingIban,
      createdAt:now, updatedAt:now, needsReview:false,
      history:[{ status, at:now, label: colByKey[status].title }]
    });
  }
  closeSheet(); await loadAll();
  const idx = COLUMNS.findIndex(c=> c.key === status);
  if(idx >= 0) scrollToCol(idx);
  toast('Gespeichert');
}

/* ---------- Sichern / Wiederherstellen ---------- */
async function exportBackup(){
  const data = await dbAll();
  const blob = new Blob([JSON.stringify(data, null, 2)], { type:'application/json' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = 'rechnungs-tracker-backup-' + new Date().toISOString().slice(0,10) + '.json';
  a.click();
  toast('Backup heruntergeladen');
}
async function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(!Array.isArray(data)) throw new Error('Ungültiges Format');
    for(const rec of data) await dbPut(rec);
    closeSheet(); await loadAll();
    toast(data.length + ' Rechnung(en) wiederhergestellt');
  }catch(err){ alert('Import fehlgeschlagen: ' + err.message); }
  e.target.value = '';
}

/* ==================================================================
   Empfang: aus einer anderen App hierher geteilte Belege.
   Der Service Worker hat sie in den Cache 'rt-share' gelegt und auf
   ./?shared=N umgeleitet. Hier abholen, Cache leeren, Karte anlegen.
   ================================================================== */
async function handleSharedFiles(){
  const params = new URLSearchParams(location.search);
  if(!params.has('shared') && !params.has('neu')) return;

  const n = Number(params.get('shared') || 0);
  history.replaceState(null, '', './');       // Query aus der Adresse nehmen

  if(params.has('neu')){ openEditor(null); return; }
  if(!n){ toast('Es kam keine Datei an'); return; }

  let files = [];
  try{
    const cache = await caches.open('rt-share');
    for(const req of await cache.keys()){
      const res  = await cache.match(req);
      if(!res) continue;
      const blob = await res.blob();
      const name = decodeURIComponent(res.headers.get('x-filename') || 'beleg');
      files.push(new File([blob], name, { type: blob.type || res.headers.get('content-type') || '' }));
      await cache.delete(req);
    }
  }catch(err){ console.warn('Geteilte Datei nicht lesbar:', err); }

  if(!files.length){ toast('Es kam keine Datei an'); return; }

  if(files.length === 1){
    /* Einzelner Beleg: Editor oeffnen, Datei ist schon dran und wird analysiert. */
    openEditor(null);
    await setPendingFile(files[0]);
    const t = document.getElementById('f-title');
    if(t && !t.value) t.value = files[0].name.replace(/\.[a-z0-9]+$/i,'');
  } else {
    for(const f of files) await createInvoiceFromFile(f, 'bezahlt');
    await loadAll();
    toast(files.length + ' Belege übernommen – werden analysiert …');
  }
}

/* ---------- Start ---------- */
openDB().then(loadAll).then(handleSharedFiles);

/* ---------- Service Worker inklusive Update-Hinweis ----------
   Laeuft nur unter https:// oder localhost. Meldet sich ein neuer
   Service Worker an, erscheint unten ein Banner statt eines stillen
   Wechsels – so bekommt das Handy neue Versionen ohne Handarbeit. */
if('serviceWorker' in navigator){
  window.addEventListener('load', async ()=>{
    try{
      const reg = await navigator.serviceWorker.register('./sw.js');
      const showUpdate = ()=> document.getElementById('updatebar').classList.add('show');

      /* Zwei Faelle, beide noetig: der neue Worker kann schon fertig
         installiert warten, bevor dieser Code laeuft (dann feuert
         'updatefound' nie mehr), oder er installiert erst danach. */
      if(reg.waiting && navigator.serviceWorker.controller) showUpdate();
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', ()=>{
          if(nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate();
        });
      });
      document.addEventListener('visibilitychange', ()=>{
        if(document.visibilityState === 'visible') reg.update().catch(()=>{});
      });
    }catch(err){ console.warn('Service Worker nicht registriert:', err); }
  });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(reloading) return; reloading = true; location.reload();
  });
}
document.getElementById('btnUpdate').addEventListener('click', ()=>{
  document.getElementById('updatebar').classList.remove('show');
  navigator.serviceWorker.getRegistration().then(reg=>{
    if(reg && reg.waiting) reg.waiting.postMessage('skipWaiting');
    else location.reload();
  });
});
