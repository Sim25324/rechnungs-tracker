/* ---------- Bilanz: gezahlt gegen zurueckbekommen ---------- */
function bilanzBlock(){
  const praemien = (policy && policy.praemien) || [];
  if(!praemien.length){
    /* Die Erstattungsquote haengt nicht von erfassten Praemien ab –
       sie darf hier nicht verloren gehen, nur weil noch keine Praemie
       eingetragen ist. */
    return `<div class="leer klein" style="margin-bottom:12px">
      <p style="margin-bottom:12px">Trage deine Prämie ein, um zu sehen, was du über die Laufzeit
         gezahlt hast – und wie sich das zu den Erstattungen verhält.</p>
      <button class="primary" id="praemBtn">💶 Prämie erfassen</button></div>
      ${quotenBlock()}`;
  }
  const jahr    = new Date().getFullYear();
  const startJ  = Number(praemien.slice().sort((a,b)=> a.ab.localeCompare(b.ab))[0].ab.slice(0,4));
  const gesamtP = praemienSumme(policy);
  const gesamtE = erstattungenGesamt('erstattetKv');
  const jahrP   = praemienImJahr(policy, jahr);
  const jahrE   = erstattungenImJahr(jahr, 'erstattetKv');

  const jahre = [];
  for(let j = startJ; j <= jahr; j++) jahre.push(j);
  const maxWert = Math.max(1, ...jahre.map(j=> Math.max(praemienImJahr(policy,j), erstattungenImJahr(j,'erstattetKv'))));

  /* Praemienentwicklung: erster gegen aktuellen Monatswert */
  const sortiert = praemien.slice().sort((a,b)=> a.ab.localeCompare(b.ab));
  const ersterM  = monatsBetrag(sortiert[0]);
  const aktM     = monatsBetrag(sortiert[sortiert.length-1]);
  const steigung = ersterM > 0 ? Math.round((aktM/ersterM - 1) * 100) : 0;

  return `
    <div class="bilanz">
      <div class="bhead">
        <b>Bilanz seit ${startJ}</b>
        <button class="icon-btn" id="praemBtn" aria-label="Prämien bearbeiten">✎</button>
      </div>
      <div class="bzahlen">
        <div><span class="bl">gezahlt gesamt</span><b class="bp">${fmtEUR(gesamtP)}</b></div>
        <div><span class="bl">erstattet gesamt</span><b class="be">${fmtEUR(gesamtE)}</b></div>
      </div>
      <div class="bzahlen klein">
        <div><span class="bl">${jahr} gezahlt</span><b>${fmtEUR(jahrP)}</b></div>
        <div><span class="bl">${jahr} erstattet</span><b>${fmtEUR(jahrE)}</b></div>
      </div>

      <div class="grouplabel" style="margin:14px 0 8px">Jahr für Jahr</div>
      <div class="jahre">
        ${jahre.slice(-8).map(j=>{
          const p = praemienImJahr(policy,j), e = erstattungenImJahr(j,'erstattetKv');
          return `<div class="jrow">
            <span class="jj">${j}</span>
            <span class="jbars">
              <span class="jb p" style="width:${Math.round(p/maxWert*100)}%"></span>
              <span class="jb e" style="width:${Math.round(e/maxWert*100)}%"></span>
            </span>
            <span class="jw">${fmtEUR(p)} / ${fmtEUR(e)}</span>
          </div>`;
        }).join('')}
      </div>
      <p class="blegende"><span class="dot p"></span>Prämie &nbsp; <span class="dot e"></span>Erstattung</p>

      ${sortiert.length > 1 ? `<div class="bsteigung ${steigung>0?'hoch':''}">
        Prämienentwicklung: ${fmtEUR(ersterM)} → ${fmtEUR(aktM)} im Monat
        ${steigung !== 0 ? `<b>${steigung > 0 ? '+' : ''}${steigung} %</b> seit ${sortiert[0].ab.slice(0,4)}` : ''}
      </div>` : ''}

      <p class="disclaimer" style="margin-top:12px">Diese Gegenüberstellung sagt <b>nicht</b>, ob sich
        die Versicherung lohnt. Du bezahlst Absicherung gegen den teuren Fall, nicht einzelne
        Erstattungen. Aussagekräftig ist sie für eine andere Frage: ob Preis und Deckung noch
        zueinander passen – besonders wenn die Prämie steigt und die Leistungen gleich bleiben.</p>
    </div>
    ${quotenBlock()}`;
}

function quotenBlock(){
  const q = quoteJeWeg();
  const keys = Object.keys(q);
  if(!keys.length) return '';
  return `
    <div class="grouplabel">Erstattungsquote aus deinen Daten</div>
    <div class="quoten">
      ${keys.map(k=>`<div class="qrow">
        <span class="qn">${WEGE[k].icon} ${escapeHTML(WEGE[k].kurz)}</span>
        <span class="qbar"><span style="width:${Math.min(100,q[k].quote)}%"></span></span>
        <span class="qv"><b>${q[k].quote} %</b><span>${q[k].n} Rechnungen</span></span>
      </div>`).join('')}
    </div>
    <p class="hint">Anteil, der von Rechnungsbetrag zurückkam – ÖGK und private Versicherung zusammen.
      Beruht nur auf Rechnungen, bei denen du eine Erstattung eingetragen hast.</p>`;
}

function leistungKarte(l){
  const v    = verbrauchFuer(l, policy, usage);
  const rest = restVon(l, v);
  const limitBekannt = l.limitTyp === 'betrag' || l.limitTyp === 'anzahl';
  const pct  = limitBekannt && l.limit > 0 ? Math.min(100, Math.round(v.genutzt / l.limit * 100)) : 0;
  const kritisch = limitBekannt && pct >= 80;
  const voll     = limitBekannt && pct >= 100;
  const einheit  = l.limitTyp === 'anzahl' ? '' : '€';

  const wert = n => l.limitTyp === 'anzahl' ? n + '×' : fmtEUR(n);

  return `
    <button class="lcard ${voll?'voll':(kritisch?'warn':'')}" data-leistung="${l.id}" type="button">
      <div class="lhead">
        <span class="lic">${l.icon || '📋'}</span>
        <span class="lname">${escapeHTML(l.name)}</span>
        ${voll ? '<span class="lbadge voll">aufgebraucht</span>'
               : (kritisch ? '<span class="lbadge warn">fast aufgebraucht</span>' : '')}
      </div>
      ${limitBekannt ? `
        <div class="lbar"><span style="width:${pct}%"></span></div>
        <div class="lzahlen">
          <span><b>${wert(v.genutzt)}</b> verbraucht</span>
          <span>${rest !== null ? '<b>' + wert(rest) + '</b> übrig' : ''}</span>
        </div>
        <div class="lmeta">Limit ${wert(l.limit)} ${escapeHTML(ZEITRAEUME[l.zeitraum].label)}
          · seit ${fmtDate(v.ab)} · ${v.eintraege.length} Eintrag${v.eintraege.length===1?'':'e'}</div>`
      : `
        <div class="lzahlen"><span><b>${fmtEUR(v.summe)}</b> erfasst</span></div>
        <div class="lmeta">${l.limitTyp === 'prozent'
            ? l.limit + ' % der Kosten werden ersetzt'
            : 'Kein Limit hinterlegt'} · ${escapeHTML(ZEITRAEUME[l.zeitraum].label)}</div>`}
    </button>`;
}

/* ---------- Polizze einlesen ---------- */
async function polizzeEinlesen(file){
  openSheet(`<div class="sheet-head"><h2>Polizze wird gelesen …</h2></div>
    <div class="sheet-body"><p class="hint">Text- und Bilderkennung läuft lokal auf dem Gerät.
      Bei gescannten Polizzen dauert das eine Weile.</p></div>`);

  let text = '';
  try{
    if(file.type === 'application/pdf'){
      const pdfjsLib = await getPdfjs();
      const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      const teile = [];
      for(let p=1; p<=Math.min(doc.numPages, 25); p++){
        const c = await (await doc.getPage(p)).getTextContent();
        let y=null, line=[];
        for(const it of c.items){
          const yy = Math.round(it.transform[5]);
          if(y===null || Math.abs(yy-y)>2){ if(line.length) teile.push(line.join('')); line=[it.str]; y=yy; }
          else line.push(it.str);
        }
        if(line.length) teile.push(line.join(''));
      }
      text = teile.join('\n');
    } else {
      /* Dieselbe Bildaufbereitung wie bei Rechnungen: Graustufen plus
         Kontrastspreizung – Polizzen sind oft mehrseitige Handyfotos
         und profitieren davon mindestens genauso stark. Frueher lief
         hier das rohe Foto direkt in Tesseract, ohne jede Vorstufe. */
      const worker = await getTesseractWorker();
      const quelle = (await bildAufbereiten(file)) || (await fileToDataURL(file));
      text = (await worker.recognize(quelle)).data.text || '';
    }
  }catch(err){ console.error('Polizze nicht lesbar:', err); }

  const vorschlaege = analysierePolizze(text);
  const kopf        = polizzenKopf(text);
  const dataURL     = await fileToDataURL(file);
  zeigePolizzeVorschlaege(vorschlaege, Object.assign(kopf, {
    doc:{ id:uid(), kind:'sonstiges', name:file.name, type:file.type, data:dataURL, addedAt:new Date().toISOString() },
  }));
}

        <label>Zahlungsweise<select id="k-pint">${Object.keys(INTERVALLE).map(k=>

      </div>
      ${meta.praemie ? `<p class="hint">Prämie gelesen aus: „${escapeHTML(meta.praemie.quelle)}“${

        : '<p class="hint">Keine Prämie im Text gefunden. Trag sie hier ein, dann rechnet die Bilanz von Anfang an mit.</p>'}
      ${vorschlaege.length ? `
        <div class="grouplabel">Übernehmen</div>
        ${vorschlaege.map((v,i)=>`
          <label class="vorschlag">
            <input type="checkbox" data-v="${i}" ${v.sicher?'checked':''}>
            <span>
              <b>${v.icon} ${escapeHTML(v.name)}</b>
              <span class="vlimit">${v.limitTyp==='betrag' ? 'bis ' + fmtEUR(v.limit)

                ${escapeHTML(ZEITRAEUME[v.zeitraum].label)}</span>
              <span class="vquelle">„${escapeHTML(v.quelle)}“</span>
            </span>
          </label>`).join('')}`
        : '<p class="hint">Nichts Verwertbares gefunden. Viele Polizzen sind Scans oder Tabellen – füge die Leistungen aus dem Katalog hinzu.</p>'}
    </div>
    <div class="sheet-foot">
      <button id="vKatalog" class="grow">Aus Katalog wählen</button>
      <button class="primary grow" id="vOk">Übernehmen</button>
    </div>`);

  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
  const speichern = async (auswahl)=>{
    const p = policy || { id: uid(), art:'kranken', versicherer:'', tarif:'', beginn:'', leistungen:[], docs:[], praemien:[] };

    /* Kopfdaten aus den Feldern uebernehmen – der Nutzer hat sie

/* ==================================================================
   DRUCK-INFRASTRUKTUR
   Kein PDF-Generator im Bundle: Chrome auf Android bietet im Druck-
   dialog "Als PDF speichern". Das spart eine 300-KB-Bibliothek und
   liefert ein PDF, das der Nutzer selbst benennt und ablegt.
   ================================================================== */
function drucke(html, titel){
  const ziel = document.getElementById('printarea');
  ziel.innerHTML = `<h1 class="p-titel">${escapeHTML(titel)}</h1>` + html +
    `<p class="p-fuss">Erstellt am ${fmtDateTime(new Date().toISOString())} · Privatly</p>`;
  document.body.classList.add('printing');
  const aufraeumen = ()=>{
    document.body.classList.remove('printing');
    ziel.innerHTML = '';
    window.removeEventListener('afterprint', aufraeumen);
  };
  window.addEventListener('afterprint', aufraeumen);
  setTimeout(()=> window.print(), 120);
  setTimeout(aufraeumen, 60000);   // Fallback, falls afterprint ausbleibt
}
function csvDownload(zeilen, name){
  const esc = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const txt = '﻿' + zeilen.map(r=> r.map(esc).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob([txt], { type:'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 20000);
}

/* ---------- Steuer-Export: selbst getragene Krankheitskosten ---------- */
function steuerJahre(){
  const j = new Set(invoices.map(i=> (i.date||'').slice(0,4)).filter(Boolean));
  return [...j].sort().reverse();
}
function steuerDaten(jahr){
  const rel = invoices.filter(i=> (i.date||'').slice(0,4) === String(jahr))
                      .sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const rows = rel.map(i=>{
    const betrag = Number(i.amount)||0;
    const zurueck = erstattetGesamt(i);
    return { i, betrag, zurueck, selbst: Math.max(0, betrag - zurueck),
             offen: i.erstattetOegk == null && i.erstattetKv == null };
  });
  return {
    rows,
    summeBetrag: rows.reduce((s,r)=> s + r.betrag, 0),
    summeZurueck: rows.reduce((s,r)=> s + r.zurueck, 0),
    summeSelbst: rows.reduce((s,r)=> s + r.selbst, 0),
    offen: rows.filter(r=> r.offen).length,
  };
}

  const jahre = steuerJahre();
  if(!jahre.length){ toast('Noch keine Rechnungen mit Datum erfasst'); return; }

    const d = steuerDaten(jahr);
    sheet.querySelector('#stBody').innerHTML = `

      </div>
      <div class="steuersumme">
        <span>Selbst getragen ${jahr}</span>

        die zählen hier voll als selbst getragen. Trag die Erstattung nach, sonst ist die Zahl zu hoch.</p>` : ''}
      <div class="grouplabel">Belege</div>

        ${d.rows.map(r=>`<li><span>${fmtDate(r.i.date)} · ${escapeHTML(r.i.title||'Rechnung')}</span>

        Einkommen ab. Diese Aufstellung ist eine Vorarbeit für die Arbeitnehmerveranlagung, keine
        Steuerberatung – ich bin kein Steuerberater. Prüfung und Einreichung bleiben bei dir.</p>`;
  };

  openSheet(`
    <div class="sheet-head"><h2>Steuer-Übersicht</h2>
      <button class="icon-btn" data-close aria-label="Schließen">✕</button></div>
    <div class="sheet-body">

/* ---------- Selbstbehalt-Simulation ---------- */
function openSimSheet(){
  const jahre = steuerJahre().slice(0,6).reverse();
  if(!jahre.length){ toast('Noch keine Rechnungen erfasst'); return; }
  let sb = 300, quote = 80;

  const zeichne = ()=>{
    const rows = jahre.map(j=>{
      const d = steuerDaten(j);
      const ist = d.summeZurueck;
      const modell = Math.max(0, (d.summeBetrag - sb)) * quote/100;
      return { j, kosten:d.summeBetrag, ist, modell };
    });
    sheet.querySelector('#simBody').innerHTML = `
      <table class="simtab">
        <tr><th>Jahr</th><th>Kosten</th><th>tatsächlich zurück</th><th>Modell</th><th>Δ</th></tr>
        ${rows.map(r=>`<tr>
          <td>${r.j}</td><td>${fmtEUR(r.kosten)}</td><td>${fmtEUR(r.ist)}</td>
          <td>${fmtEUR(r.modell)}</td>
          <td class="${r.modell-r.ist>=0?'plus':'minus'}">${r.modell-r.ist>=0?'+':''}${fmtEUR(r.modell-r.ist)}</td>
        </tr>`).join('')}
      </table>
      <p class="disclaimer">Stark vereinfachtes Modell: Es zieht den Selbstbehalt einmal pro Jahr von den
        Gesamtkosten ab und wendet einen festen Prozentsatz an. Echte Tarife rechnen je Leistungsart,
        mit Teillimits und Wartezeiten. Die Zahlen taugen als Größenordnung für ein Gespräch,
        nicht als Entscheidungsgrundlage – und ich bin kein Versicherungsberater.</p>`;
  };

  openSheet(`
    <div class="sheet-head"><h2>Was wäre bei anderem Selbstbehalt?</h2>
      <button class="icon-btn" data-close aria-label="Schließen">✕</button></div>
    <div class="sheet-body">
      <div class="row2">
        <div class="field"><label>Selbstbehalt pro Jahr (€)</label>
          <input type="number" inputmode="numeric" id="simSb" value="300"></div>
        <div class="field"><label>Erstattung darüber (%)</label>
          <input type="number" inputmode="numeric" id="simQ" value="80"></div>
      </div>
      <div id="simBody"></div>
    </div>`);
  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
  const upd = ()=>{
    sb    = Number(sheet.querySelector('#simSb').value) || 0;
    quote = Math.min(100, Math.max(0, Number(sheet.querySelector('#simQ').value) || 0));
    zeichne();
  };
  sheet.querySelector('#simSb').addEventListener('input', upd);
  sheet.querySelector('#simQ').addEventListener('input', upd);
  zeichne();
}

/* ==================================================================
   MAKLER-EXPORT
   Eine kompakte Uebersicht, die man dem eigenen Versicherungsmakler
   zeigen oder schicken kann: offene Vorgaenge mit Fristen, Stand der
   Leistungstoepfe, Praemien-Bilanz. Kein Konto, keine Freigabe fuer
   den Makler in dieser App noetig – nur ein Blatt, das er sonst
   muehsam telefonisch erfragen muesste.
   ================================================================== */
function maklerDaten(){
  const offene = invoices.filter(i=> i.status !== 'abgeschlossen')
                         .sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const toepfe = leistungen.map(l=>{
    const v = verbrauchFuer(l, policy, usage);
    const rest = restVon(l, v);
    const limitBekannt = l.limitTyp === 'betrag' || l.limitTyp === 'anzahl';
    return { l, v, rest, limitBekannt };
  });
  const jahr = new Date().getFullYear();
  const bilanz = (policy && (policy.praemien||[]).length) ? {
    jahrP: praemienImJahr(policy, jahr), jahrE: erstattungenImJahr(jahr, 'erstattetKv'),
    gesamtP: praemienSumme(policy), gesamtE: erstattungenGesamt('erstattetKv'),
  } : null;
  return { offene, toepfe, bilanz, jahr };
}
function toepfeZeilen(toepfe){
  return toepfe.map(t=>{
    const verbraucht = t.limitBekannt ? (t.l.limitTyp==='anzahl' ? t.v.genutzt + '×' : fmtEUR(t.v.genutzt)) : fmtEUR(t.v.summe);
    const rest = t.rest != null ? (t.l.limitTyp==='anzahl' ? t.rest + '×' : fmtEUR(t.rest)) : '–';
    return { name:t.l.name, verbraucht, rest };
  });
}

/* ==================================================================
   VERTRAGS-COCKPIT
   Alle Polizzen, nicht nur die Krankenversicherung. Der Versicherer
   kennt dein Kuendigungsfenster genau – du sollst es auch kennen.
   ================================================================== */
const VERTRAGSARTEN = {
  kranken:  { label:'Krankenversicherung', icon:'🏥' },
  haushalt: { label:'Haushalt & Eigenheim', icon:'🏠' },
  kfz:      { label:'Kfz',                  icon:'🚗' },
  rechts:   { label:'Rechtsschutz',         icon:'⚖️' },
  unfall:   { label:'Unfall',               icon:'🩼' },
  leben:    { label:'Leben & Vorsorge',     icon:'📈' },
  sonstige: { label:'Sonstige',             icon:'📄' },
};
/* Naechster Kuendigungstermin: Hauptfaelligkeit minus Frist. */
function kuendigungsFenster(v){
  if(!v.hauptfaelligkeit) return null;
  const [, m, t] = v.hauptfaelligkeit.split('-').map(Number);
  const heute = new Date();
  let jahr = heute.getFullYear();
  const hf = ()=> new Date(jahr, m-1, t, 12);
  if(hf() < heute) jahr++;
  const stichtag = new Date(jahr, m-1, t, 12);
  stichtag.setMonth(stichtag.getMonth() - (Number(v.kuendigungsfrist)||3));
  const tage = Math.ceil((stichtag - heute) / 86400000);
  return { stichtag, tage, hauptfaellig: new Date(jahr, m-1, t, 12) };
}

  vertraege = await stAll('policies');

}

  });
  el.innerHTML = `
    ${sortiert.length ? sortiert.map(v=>{
      const art = VERTRAGSARTEN[v.art || 'kranken'];

                                         : fmtEUR(rest) + ' frei von ' + fmtEUR(l.limit))
              : (l.limitTyp === 'prozent' ? l.limit + ' % der Kosten gedeckt' : 'ohne Limit erfasst')}
              · ${escapeHTML(ZEITRAEUME[l.zeitraum].label)}</span></span>
          <button type="button" class="docbtn" data-topf="${l.id}" aria-label="Öffnen">›</button>
        </div>`;
      }).join('') : '<p class="hint">Zu diesem Anlass hast du noch keine passenden Leistungen erfasst.</p>'}

      ${t.vertr.length ? `<div class="grouplabel">Betroffene Verträge</div>
        ${t.vertr.map(v=>`<div class="chtopf"><span class="lic">${VERTRAGSARTEN[v.art].icon}</span>
          <span class="hmain"><b>${escapeHTML(v.versicherer || VERTRAGSARTEN[v.art].label)}</b>
          <span>${escapeHTML(VERTRAGSARTEN[v.art].label)}</span></span></div>`).join('')}` : ''}

      ${t.fehlend.length ? `<div class="grouplabel">Wäre hier relevant, fehlt aber</div>
        <p class="hint">${t.fehlend.map(k=> k.icon + ' ' + escapeHTML(k.name)).join(' · ')}<br>
        Falls deine Polizze das abdeckt, ergänze es unter Versicherung – sonst rechnet die App ohne.</p>` : ''}

      <div class="grouplabel">Woran es meistens scheitert</div>
      <ol class="steps">${a.schritte.map(s=> `<li>${escapeHTML(s)}</li>`).join('')}</ol>

      <p class="disclaimer">Administrative Hinweise, keine medizinische Beratung. Ob eine Behandlung
        angezeigt ist, klärst du ärztlich; ob sie gedeckt ist, steht in deiner Polizze.</p>
    </div>
    <div class="sheet-foot">
      <button class="primary grow" id="anRechnung">Rechnung dafür anlegen</button>
    </div>`);

  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
  sheet.querySelectorAll('[data-topf]').forEach(b=> b.addEventListener('click', ()=>{
    const id = b.dataset.topf; closeSheet(); setView('deckung');
    setTimeout(()=> openLeistungSheet(id), 120);
  }));
  sheet.querySelector('#anRechnung').addEventListener('click', ()=>{
    closeSheet(); setView('rechnungen'); openEditor(null);
  });
}

/* Zaehler in der Navigation und Banner in der Rechnungsansicht */
/* Zaehlt dringende Chancen und zeigt sie als kleines Abzeichen auf dem
   "Mehr"-Tab (dort sind Verträge/Chancen jetzt untergebracht) sowie als
   Zeile in der "Mehr"-Liste selbst. Die eigentliche Warnung dazu laeuft
   als Alert-Karte auf der Uebersicht, siehe renderAlerts(). */
function updateChancenZaehler(){
  const h = (policy || vertraege.length) ? chancenHinweise() : [];
  const dringend = h.filter(x=> x.stufe === 'hoch').length;
  const btn = document.querySelector('.mainbtn[data-view="mehr"]');
  if(btn){
    let b = btn.querySelector('.navcnt');
    if(h.length){
      if(!b){ b = document.createElement('span'); b.className = 'navcnt'; btn.appendChild(b); }
      b.textContent = h.length;
      b.classList.toggle('hoch', dringend > 0);
    } else if(b) b.remove();
  }
  const zeile = document.getElementById('mrChancenBadge');
  if(zeile){
    zeile.hidden = !h.length;
    if(h.length){ zeile.textContent = h.length; zeile.classList.toggle('hoch', dringend > 0); }
  }
}

/* ---------- Ansichtswechsel ----------
   Vier echte Tabs (Uebersicht/Rechnungen/Deckung/Mehr) + eine FAB, die
   immer "Rechnung anlegen" ist – der haeufigste Fall. Eine Leistung
   legt man ueber den Button in der Deckung-Seite selbst an. Vertraege
   und Chancen haengen als Unterseiten an "Mehr" – der Tab bleibt dabei
   optisch aktiv, es braucht keinen eigenen Zurueck-Button, weil die
   Navigation unten immer sichtbar bleibt.

   Die zuletzt aktive Ansicht wird gemerkt: ein Reload (z. B. durch
   Pull-to-refresh) soll dort weitermachen, wo man war, statt immer auf
   die Uebersicht zurueckzuspringen. */
const VIEWS = ['uebersicht','rechnungen','deckung','vertraege','chancen','mehr'];
let currentView = 'uebersicht';
try{
  const gespeichert = localStorage.getItem('rt_lastView');
  if(VIEWS.includes(gespeichert)) currentView = gespeichert;
}catch(e){ /* localStorage nicht verfuegbar – Start bei Uebersicht */ }

function setView(v){
  currentView = v;
  try{ localStorage.setItem('rt_lastView', v); }catch(e){ /* unkritisch */ }
  document.getElementById('view-uebersicht').hidden = (v !== 'uebersicht');
  document.getElementById('view-rechnungen').hidden = (v !== 'rechnungen');
  document.getElementById('view-deckung').hidden    = (v !== 'deckung');
  document.getElementById('view-vertraege').hidden  = (v !== 'vertraege');
  document.getElementById('view-chancen').hidden    = (v !== 'chancen');
  document.getElementById('view-mehr').hidden       = (v !== 'mehr');
  const navKey = (v === 'vertraege' || v === 'chancen') ? 'mehr' : v;
  document.querySelectorAll('.mainbtn').forEach(b=>
    b.setAttribute('aria-selected', String(b.dataset.view === navKey)));
  if(v === 'uebersicht') render();
  if(v === 'deckung')   loadDeckung();
  if(v === 'vertraege') loadVertraege();
  if(v === 'chancen')   loadChancen();
}
document.querySelectorAll('.mainbtn').forEach(b=>
  b.addEventListener('click', ()=> setView(b.dataset.view)));

/* ---------- Start ----------
   Policy/Vertraege VOR dem ersten sichtbaren Rendern laden – sonst
   fehlen auf der Uebersicht (Standard-Landing-Ansicht) die Chancen-
   Hinweise und das Mehr-Abzeichen, weil beide bisher nur beim Besuch
   von Deckung/Vertraege/Chancen befuellt wurden. */
openDB().then(loadAll).then(loadPolicyState).then(()=>{ render(); setView(currentView); }).then(handleSharedFiles);

/* ---------- Service Worker inklusive Update-Hinweis ----------
   Laeuft nur unter https:// oder localhost. Meldet sich ein neuer
   Service Worker an, erscheint unten ein Banner statt eines stillen
   Wechsels – so bekommt das Handy neue Versionen ohne Handarbeit. */
if('serviceWorker' in navigator){
  window.addEventListener('load', async ()=>{
    try{
      const reg = await navigator.serviceWorker.register('./sw.js');
      const showUpdate = ()=> document.getElementById('updatebar').classList.add('show');

      /* Zwei Faelle, beide noetig: der neue Worker kann schon fertig
         installiert warten, bevor dieser Code laeuft (dann feuert
         'updatefound' nie mehr), oder er installiert erst danach. */
      if(reg.waiting && navigator.serviceWorker.controller) showUpdate();
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', ()=>{
          if(nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate();
        });
      });
      document.addEventListener('visibilitychange', ()=>{
        if(document.visibilityState === 'visible') reg.update().catch(()=>{});
      });
    }catch(err){ console.warn('Service Worker nicht registriert:', err); }
  });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(reloading) return; reloading = true; location.reload();
  });
}
document.getElementById('btnUpdate').addEventListener('click', ()=>{
  document.getElementById('updatebar').classList.remove('show');
  navigator.serviceWorker.getRegistration().then(reg=>{
    if(reg && reg.waiting) reg.waiting.postMessage('skipWaiting');
    else location.reload();
  });
});
</script>
