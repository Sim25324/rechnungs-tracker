<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Rechnungs-Tracker – Wahlarzt &amp; Apotheke</title>

<!-- PWA -->
<link rel="manifest" href="./manifest.json">
<meta name="theme-color" content="#2563eb">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Rechnungen">
<link rel="icon" type="image/png" sizes="192x192" href="./icons/icon-192.png">
<link rel="apple-touch-icon" href="./icons/icon-192.png">
<style>
/* =======================================================================
   Mobile first. Alle Basisregeln gelten fuer das Handy;
   groessere Screens bekommen Erweiterungen ueber min-width-Queries.
   ======================================================================= */
:root{
  color-scheme: light;
  --blue:#2563eb; --blue-l:#eff6ff;
  --teal:#0891b2; --teal-l:#ecfeff;
  --amber:#d97706; --amber-l:#fffbeb;
  --violet:#7c3aed; --violet-l:#f5f3ff;
  --green:#16a34a; --green-l:#f0fdf4;
  --ink:#0f172a; --sub:#475569; --line:#e2e8f0; --bg:#f1f5f9;
  --tap:44px;                       /* Mindestgroesse fuer Touch-Ziele */
  --sat: env(safe-area-inset-top,0px);
  --sab: env(safe-area-inset-bottom,0px);
  --sal: env(safe-area-inset-left,0px);
  --sar: env(safe-area-inset-right,0px);
}
*{ box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
html{ -webkit-text-size-adjust:100%; }
body{
  margin:0; background:var(--bg); color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
  font-size:15px; line-height:1.45;
  overscroll-behavior-y:none;
}
body.locked{ overflow:hidden; }

button, .btn{
  font-family:inherit; font-size:15px; font-weight:600;
  min-height:var(--tap); padding:10px 16px;
  border-radius:10px; border:1px solid var(--line);
  background:#fff; color:var(--ink);
  cursor:pointer; touch-action:manipulation;
  display:inline-flex; align-items:center; justify-content:center; gap:6px;
}
button:active{ transform:scale(.97); }
button.primary{ background:var(--blue); color:#fff; border-color:var(--blue); }
button.danger{ background:#fff; color:#dc2626; border-color:#fecaca; }
button.ghost{ border-color:transparent; background:transparent; color:var(--sub); }
button:disabled{ opacity:.5; }
/* Hover-Effekte nur dort, wo es echten Hover gibt – auf Touch bleiben sie sonst kleben */
@media (hover:hover) and (pointer:fine){
  button:hover{ background:#f1f5f9; }
  button.primary:hover{ background:#1d4ed8; }
  button.danger:hover{ background:#fef2f2; }
}

/* ---------- Kopfzeile ---------- */
.topbar{
  position:sticky; top:0; z-index:30;
  background:#fff; border-bottom:1px solid var(--line);
  padding:calc(10px + var(--sat)) calc(12px + var(--sar)) 10px calc(12px + var(--sal));
  display:flex; align-items:center; gap:8px;
}
.topbar h1{
  font-size:16px; margin:0; flex:1; min-width:0;
  white-space:nowrap; overflow:hidden; text-overflow:ellipsis;
}
.saved-indicator{ font-size:11px; color:var(--green); font-weight:600; white-space:nowrap; }
.icon-btn{
  width:var(--tap); height:var(--tap); min-height:var(--tap);
  padding:0; border-radius:50%; border:1px solid var(--line);
  background:#fff; font-size:17px; flex:none;
}

/* ---------- Info-Buttons und Popover ---------- */
.info-btn{
  width:26px; height:26px; min-height:26px; padding:0; flex:none;
  border-radius:50%; border:1px solid #bfdbfe; background:var(--blue-l);
  color:var(--blue); font-size:13px; font-weight:800; line-height:1;
}
.popover{
  position:fixed; z-index:80; max-width:min(320px, calc(100vw - 24px));
  background:#0f172a; color:#e2e8f0; font-size:13px; line-height:1.5;
  border-radius:10px; padding:12px 14px; box-shadow:0 12px 32px rgba(0,0,0,.3);
  display:none;
}
.popover.open{ display:block; }
.popover b{ color:#fff; }

/* ---------- Kennzahlen ---------- */
.stats{
  display:grid; grid-template-columns:1fr 1fr; gap:8px;
  padding:10px calc(12px + var(--sar)) 4px calc(12px + var(--sal));
}
.stat{ background:#fff; border:1px solid var(--line); border-radius:10px; padding:8px 12px; }
.stat .n{ font-size:17px; font-weight:800; line-height:1.2; }
.stat .l{ font-size:11px; color:var(--sub); }

/* ---------- Status-Tabs (nur Handy/Tablet) ---------- */
.tabs{
  display:flex; gap:6px; overflow-x:auto; scrollbar-width:none;
  padding:8px calc(12px + var(--sar)) 8px calc(12px + var(--sal));
  position:sticky; top:calc(var(--tap) + var(--sat) + 12px); z-index:20;
  background:var(--bg);
}
.tabs::-webkit-scrollbar{ display:none; }
.tab{
  flex:none; min-height:38px; padding:7px 13px; border-radius:20px;
  border:1px solid var(--line); background:#fff; color:var(--sub);
  font-size:13px; font-weight:700; white-space:nowrap;
  display:inline-flex; align-items:center; gap:6px; touch-action:manipulation;
}
.tab .n{
  background:#e2e8f0; color:#475569; border-radius:20px;
  font-size:11px; font-weight:800; padding:1px 7px; min-width:20px;
}
.tab[aria-selected="true"]{ background:var(--tc); border-color:var(--tc); color:#fff; }
.tab[aria-selected="true"] .n{ background:rgba(255,255,255,.28); color:#fff; }

/* ---------- Board ---------- */
.board{
  display:flex; gap:12px; overflow-x:auto; scroll-snap-type:x mandatory;
  padding:4px calc(12px + var(--sar)) 96px calc(12px + var(--sal));
  scrollbar-width:none;
}
.board::-webkit-scrollbar{ display:none; }
.col{
  flex:0 0 86vw; scroll-snap-align:center;
  background:#fff; border:1.5px solid var(--line); border-radius:14px;
  display:flex; flex-direction:column; min-height:52vh;
}
.col.dragover{ border-color:var(--col-c,#2563eb); background:var(--col-bg,#eff6ff); }
.col-head{
  padding:12px 14px; border-bottom:1px solid var(--line); border-radius:13px 13px 0 0;
  font-size:14px; font-weight:800; color:var(--col-c,#334155); background:var(--col-bg,#f8fafc);
  display:flex; justify-content:space-between; align-items:center; gap:8px;
}
.col-head .count{
  background:var(--col-c,#94a3b8); color:#fff; border-radius:20px;
  font-size:11px; padding:2px 9px; font-weight:800; flex:none;
}
.col-body{ padding:10px; display:flex; flex-direction:column; gap:10px; flex:1; }
.empty{
  flex:1; display:flex; align-items:center; justify-content:center; text-align:center;
  color:#94a3b8; font-size:13px; border:1.5px dashed #e2e8f0; border-radius:10px; padding:22px 14px;
}
.col-foot{ padding:0 10px 10px; }
.col-foot button{ width:100%; border-style:dashed; color:var(--sub); }

/* ---------- Karte ---------- */
.card{
  background:#fff; border:1px solid var(--line); border-left:5px solid var(--col-c,#94a3b8);
  border-radius:10px; box-shadow:0 1px 2px rgba(0,0,0,.05);
  display:flex; align-items:stretch; overflow:hidden;
}
.card.dragging{ opacity:.35; }
.card-main{
  flex:1; min-width:0; padding:11px 12px; background:none; border:none;
  text-align:left; font:inherit; color:inherit; min-height:var(--tap);
  display:block; cursor:pointer; touch-action:manipulation;
}
.card .title{ font-weight:700; font-size:14px; line-height:1.3; margin-bottom:4px; word-break:break-word; }
.card .meta{ font-size:12.5px; color:var(--sub); display:flex; justify-content:space-between; gap:8px; }
.card .amt{ font-weight:800; color:var(--ink); }
.card .tags{ display:flex; flex-wrap:wrap; gap:5px; margin-top:7px; }
.card .file-tag{
  font-size:11px; color:var(--sub); background:#f1f5f9; border-radius:6px;
  padding:3px 7px; max-width:100%; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.card .review-tag{
  font-size:11px; background:#fef3c7; color:#92400e; border-radius:6px; padding:3px 7px; font-weight:700;
}
.card .wait-tag{
  font-size:11px; background:#e0e7ff; color:#3730a3; border-radius:6px; padding:3px 7px; font-weight:700;
}
.card-move{
  flex:none; width:46px; min-height:var(--tap); border:none; border-left:1px solid var(--line);
  background:#f8fafc; color:var(--sub); font-size:19px; border-radius:0;
}

/* ---------- Aktionsleiste unten ---------- */
.actionbar{
  position:fixed; z-index:35; left:0; right:0; bottom:0;
  padding:10px calc(12px + var(--sar)) calc(10px + var(--sab)) calc(12px + var(--sal));
  background:linear-gradient(to top, #f1f5f9 62%, rgba(241,245,249,0));
  display:flex; gap:8px; align-items:center;
}
.actionbar .grow{ flex:1; }
.actionbar .primary{ box-shadow:0 6px 18px rgba(37,99,235,.35); }

/* ---------- Bottom-Sheet (ersetzt das Desktop-Modal) ---------- */
.overlay{
  position:fixed; inset:0; background:rgba(15,23,42,.5); z-index:60;
  display:none; align-items:flex-end; justify-content:center;
}
.overlay.open{ display:flex; }
.sheet{
  background:#fff; width:100%; max-height:92dvh;
  border-radius:18px 18px 0 0; display:flex; flex-direction:column;
  animation:slideUp .22s ease-out; overscroll-behavior:contain;
}
@keyframes slideUp{ from{ transform:translateY(100%); } to{ transform:translateY(0); } }
@media (prefers-reduced-motion:reduce){ .sheet{ animation:none; } }
.sheet-grip{ width:40px; height:4px; background:#cbd5e1; border-radius:4px; margin:9px auto 3px; flex:none; }
.sheet-head{
  padding:6px 16px 12px; border-bottom:1px solid var(--line); flex:none;
  display:flex; align-items:center; gap:8px;
}
.sheet-head h2{ font-size:16px; margin:0; flex:1; }
.sheet-body{
  padding:14px 16px; overflow-y:auto; flex:1; -webkit-overflow-scrolling:touch;
  padding-bottom:calc(14px + var(--sab));
}
.sheet-foot{
  padding:10px 16px calc(10px + var(--sab)); border-top:1px solid var(--line);
  display:flex; gap:8px; flex:none; background:#fff;
}
.sheet-foot .grow{ flex:1; }

/* ---------- Formularfelder ---------- */
.field{ margin-bottom:14px; }
.field label{ display:flex; align-items:center; gap:6px; font-size:13px; font-weight:700; color:var(--sub); margin-bottom:6px; }
.field input, .field textarea, .field select{
  width:100%; padding:11px 12px; border:1px solid #cbd5e1; border-radius:10px;
  font-family:inherit; font-size:16px;  /* 16px verhindert Auto-Zoom beim Fokus */
  min-height:var(--tap); background:#fff; color:var(--ink);
}
.field textarea{ resize:vertical; min-height:80px; }
.field input:focus, .field textarea:focus, .field select:focus{
  outline:2px solid var(--blue); outline-offset:-1px; border-color:var(--blue);
}
.row2{ display:grid; grid-template-columns:1fr 1fr; gap:10px; }

.filepick{ display:grid; grid-template-columns:1fr 1fr; gap:8px; }
.filepick button{ flex-direction:column; gap:3px; padding:12px 8px; font-size:13px; min-height:64px; }
.filepick .ic{ font-size:20px; }
.filechip{
  margin-top:10px; display:flex; align-items:center; gap:8px;
  background:#f1f5f9; border-radius:10px; padding:9px 12px; font-size:13px;
}
.filechip .nm{ flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
#analyze-status{ font-size:13px; color:var(--sub); margin-top:9px; min-height:18px; }
#analyze-status.ok{ color:var(--green); font-weight:700; }
.preview{ margin-top:10px; }
.preview img{ max-width:100%; border-radius:8px; border:1px solid var(--line); display:block; }

/* Statuswahl im Verschieben-Sheet */
.statuslist{ display:flex; flex-direction:column; gap:8px; }
.statuslist button{
  width:100%; justify-content:flex-start; gap:10px; padding:14px 14px; min-height:56px;
  border-left:5px solid var(--sc); font-size:15px; text-align:left;
}
.statuslist button[aria-current="true"]{ background:var(--sbg); border-color:var(--sc); }
.statuslist .tick{ margin-left:auto; color:var(--sc); font-weight:800; }
.statuslist button:disabled{ opacity:.45; }
.grouplabel{
  display:flex; align-items:center; gap:7px;
  font-size:12px; font-weight:800; color:#64748b; text-transform:uppercase;
  letter-spacing:.04em; margin:18px 0 8px;
}
.grouplabel:first-of-type{ margin-top:4px; }
.hint{ font-size:12.5px; color:#94a3b8; margin:8px 0 0; }
.steps{ margin:0; padding-left:22px; font-size:14px; line-height:1.55; color:#334155; }
.steps li{ margin-bottom:7px; }

.linklike{
  border:none; background:none; padding:0; min-height:0; font:inherit;
  color:var(--blue); text-decoration:underline; font-weight:700; cursor:pointer;
}

/* Karte: Weg-Kennzeichnung und naechster Schritt */
.card .weg-tag{
  font-size:11px; background:var(--wbg,#f1f5f9); color:var(--wc,#475569);
  border:1px solid var(--wc,#cbd5e1); border-radius:6px; padding:2px 7px; font-weight:700;
}
.card .nextstep{
  display:block; margin-top:7px; font-size:12px; font-weight:700; color:#0f766e;
  background:#f0fdfa; border-radius:6px; padding:4px 8px;
}
.statuslist button.irrelevant{ opacity:.55; }

/* Prozess-Uebersicht */
.wegcard{
  border:1.5px solid var(--wc); border-radius:12px; padding:14px;
  margin:12px 0; background:var(--wbg);
}
.wegcard.an{ box-shadow:0 0 0 3px color-mix(in srgb, var(--wc) 25%, transparent); }
.wegtitle{
  display:flex; align-items:center; gap:8px; flex-wrap:wrap;
  font-weight:800; font-size:14.5px; color:var(--wc); margin-bottom:10px;
}
.wegnow{
  font-size:10.5px; background:var(--wc); color:#fff; border-radius:20px;
  padding:2px 9px; font-weight:800; text-transform:uppercase; letter-spacing:.03em;
}
.wegsteps{ margin:0; padding-left:20px; font-size:13.5px; line-height:1.5; color:#334155; }
.wegsteps li{ margin-bottom:9px; }
.wegsteps li b{ display:block; color:#0f172a; }
.wegsteps li span{ color:#475569; }
.wegsteps li.opt{ opacity:.85; }
.optmark{
  font-size:10px; background:#e2e8f0; color:#475569; border-radius:5px;
  padding:1px 6px; font-weight:700; vertical-align:middle;
}
.weghint{
  margin:11px 0 0; font-size:12.5px; line-height:1.5; color:#475569;
  background:rgba(255,255,255,.75); border-radius:8px; padding:9px 11px;
}
.merk{
  border-left:3px solid #f59e0b; background:#fffbeb; border-radius:0 8px 8px 0;
  padding:9px 12px; margin-bottom:8px; font-size:13px; line-height:1.5;
}
.merk b{ display:block; color:#92400e; margin-bottom:2px; }
.merk span{ color:#78350f; }

/* Dokumentenliste */
.docrow{
  display:flex; align-items:center; gap:8px; padding:8px 10px; margin-bottom:7px;
  background:#f8fafc; border:1px solid var(--line); border-radius:10px;
}
.docicon{ font-size:18px; flex:none; }
.docmain{ flex:1; min-width:0; }
.docmain .dockind{
  width:100%; font-size:13px; font-weight:700; padding:5px 8px; min-height:34px;
  border:1px solid #cbd5e1; border-radius:7px; background:#fff; color:var(--ink);
}
.docname{
  display:block; font-size:11.5px; color:#64748b; margin-top:3px;
  overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
}
.docbtn{
  flex:none; width:36px; min-height:36px; padding:0; border-radius:8px;
  font-size:15px; background:#fff;
}
.docbtn.del{ color:#dc2626; border-color:#fecaca; }

/* Bedarfsanzeige */
.bedarf{
  display:flex; flex-wrap:wrap; gap:4px 8px; align-items:baseline;
  font-size:12.5px; padding:8px 11px; border-radius:8px; margin-top:7px;
  background:#fef2f2; border:1px solid #fecaca; color:#991b1b;
}
.bedarf.ok{ background:#f0fdf4; border-color:#bbf7d0; color:#166534; }
.bedarf b{ font-weight:800; }

/* Karten- und Kennzahlen-Warnungen */
.card .late-tag{
  font-size:11px; background:#fee2e2; color:#991b1b; border-radius:6px;
  padding:3px 7px; font-weight:800;
}
.card .nextstep.miss{ color:#991b1b; background:#fef2f2; }
.stat.warn{ border-color:#fecaca; background:#fef2f2; }
.stat.warn .n{ color:#991b1b; }
.stat.late{ border-color:#fdba74; background:#fff7ed; }
.stat.late .n{ color:#9a3412; }

/* Hauptnavigation zwischen den zwei Modulen */
.mainnav{
  display:flex; gap:6px; padding:8px calc(12px + var(--sar)) 0 calc(12px + var(--sal));
  background:var(--bg);
}
.mainbtn{
  flex:1; min-height:42px; border-radius:10px; font-size:14px; font-weight:700;
  background:#fff; color:var(--sub); border:1px solid var(--line);
}
.mainbtn[aria-selected="true"]{ background:var(--ink); color:#fff; border-color:var(--ink); }

/* Erkannt-Kasten (Teilen-Triage, Polizzen-Analyse) */
.erkannt{
  background:#eff6ff; border:1px solid #bfdbfe; border-radius:10px; padding:11px 13px;
  font-size:13px; line-height:1.5;
}
.erkannt b{ display:block; color:#1e3a8a; margin-bottom:3px; font-size:14px; }
.erkannt span{ color:#1e40af; }

/* Deckungs-Ansicht */
#view-deckung{ padding:10px calc(12px + var(--sar)) 96px calc(12px + var(--sal)); }
.leer{
  background:#fff; border:1.5px dashed var(--line); border-radius:14px;
  padding:28px 20px; text-align:center;
}
.leer.klein{ padding:20px 16px; }
.leer-ic{ font-size:40px; margin-bottom:6px; }
.leer h2{ font-size:17px; margin:0 0 8px; }
.leer p{ font-size:13.5px; color:var(--sub); line-height:1.55; margin:0 0 16px; }
.leer button{ width:100%; margin-bottom:8px; }

.polhead{
  display:flex; align-items:center; gap:10px; background:#0f172a; color:#fff;
  border-radius:12px; padding:13px 15px; margin-bottom:12px;
}
.polhead div{ flex:1; min-width:0; }
.polhead b{ display:block; font-size:15px; }
.polhead span{ font-size:12px; color:#cbd5e1; }
.polhead .icon-btn{ background:rgba(255,255,255,.15); border-color:transparent; color:#fff; }

.lcard{
  display:block; width:100%; text-align:left; background:#fff; border:1px solid var(--line);
  border-radius:12px; padding:13px 14px; margin-bottom:10px; min-height:0;
}
.lcard.warn{ border-color:#fdba74; background:#fff7ed; }
.lcard.voll{ border-color:#fecaca; background:#fef2f2; }
.lhead{ display:flex; align-items:center; gap:8px; margin-bottom:9px; }
.lic{ font-size:19px; }
.lname{ font-weight:800; font-size:15px; flex:1; min-width:0; }
.lbadge{ font-size:10.5px; font-weight:800; border-radius:20px; padding:3px 9px; }
.lbadge.warn{ background:#fed7aa; color:#9a3412; }
.lbadge.voll{ background:#fecaca; color:#991b1b; }
.lbar{ height:9px; background:#e2e8f0; border-radius:9px; overflow:hidden; margin-bottom:7px; }
.lbar span{ display:block; height:100%; background:var(--blue); border-radius:9px; }
.lcard.warn .lbar span{ background:#f97316; }
.lcard.voll .lbar span{ background:#dc2626; }
.lzahlen{ display:flex; justify-content:space-between; gap:10px; font-size:13px; color:var(--sub); }
.lzahlen b{ color:var(--ink); font-size:14px; }
.lmeta{ font-size:11.5px; color:#94a3b8; margin-top:5px; }

.vorschlag{
  display:flex; gap:10px; align-items:flex-start; background:#fff; border:1px solid var(--line);
  border-radius:10px; padding:11px 12px; margin-bottom:8px; cursor:pointer;
}
.vorschlag input{ width:22px; height:22px; margin-top:2px; flex:none; }
.vorschlag b{ display:block; font-size:14px; margin-bottom:2px; }
.vlimit{ display:block; font-size:12.5px; color:var(--blue); font-weight:700; }
.vquelle{ display:block; font-size:11px; color:#94a3b8; margin-top:4px; font-style:italic; }
.kopfgrid{ display:grid; grid-template-columns:1fr 1fr; gap:9px; }
.kopfgrid label{ display:block; font-size:11.5px; font-weight:700; color:var(--sub); }
.kopfgrid input, .kopfgrid select{
  width:100%; margin-top:4px; padding:9px 10px; border:1px solid #cbd5e1;
  border-radius:8px; font-family:inherit; font-size:15px; min-height:40px; background:#fff; color:var(--ink);
}

.vliste{ list-style:none; margin:10px 0 0; padding:0; }
.vliste li{
  display:flex; align-items:center; gap:9px; padding:9px 11px; margin-bottom:6px;
  background:#f8fafc; border-radius:9px; font-size:13px;
}
.vliste li span{ flex:1; min-width:0; color:var(--sub); }
.vliste li b{ color:var(--ink); white-space:nowrap; }

.disclaimer{
  font-size:12px; line-height:1.55; color:#92400e; background:#fffbeb;
  border:1px solid #fde68a; border-radius:10px; padding:11px 13px; margin:14px 0 0;
}

/* Bilanz */
.bilanz{ background:#fff; border:1px solid var(--line); border-radius:12px; padding:14px; margin-bottom:12px; }
.bhead{ display:flex; align-items:center; gap:10px; margin-bottom:12px; }

<script src="./vendor/tesseract/tesseract.min.js"></script>
<script>
/* ---------- Spalten ---------- */
const COLUMNS = [
  { key:'bezahlt',          title:'1 · Bezahlt',                    short:'Bezahlt',      c:'#2563eb', bg:'#eff6ff' },
  { key:'oegk_eingereicht', title:'2 · Bei ÖGK eingereicht',        short:'ÖGK offen',    c:'#0891b2', bg:'#ecfeff' },
  { key:'oegk_erstattet',   title:'3 · ÖGK-Erstattung erhalten',    short:'ÖGK erhalten', c:'#7c3aed', bg:'#f5f3ff' },
  { key:'kv_eingereicht',   title:'4 · Bei privater KV eingereicht',short:'Private KV',   c:'#d97706', bg:'#fffbeb' },
  { key:'abgeschlossen',    title:'5 · Abgeschlossen',              c:'#16a34a', short:'Fertig', bg:'#f0fdf4' },
];
const colByKey = Object.fromEntries(COLUMNS.map(c=>[c.key,c]));

/* ==================================================================
   Die drei Erstattungswege. Wichtig: sie sind NICHT gleich.
   Beim Kassenrezept gibt es gar keinen ÖGK-Schritt – eine solche
   Rechnung darf nie in "Bei ÖGK eingereicht" haengen bleiben.
   Jeder Schritt verweist auf die Spalte, die er im Board bedeutet
   (oder auf null, wenn er ausserhalb des Boards passiert).
   ================================================================== */
const WEGE = {
  wahlarzt: {
    label:'Wahlarzt', kurz:'Wahlarzt', icon:'🩺', c:'#2563eb', bg:'#eff6ff',
    steps:[
      { t:'Arzttermin',              d:'Bei einem Wahlarzt deiner Wahl.',                          status:null },
      { t:'Rechnung zahlen',         d:'Honorarnote direkt beim Arzt bezahlen.',                    status:'bezahlt' },
      { t:'Bei ÖGK einreichen',      d:'Läuft bei vielen Ordinationen automatisch über den Arzt.',  status:'oegk_eingereicht' },
      { t:'ÖGK-Rückzahlung',         d:'Nach einigen Wochen, rund 20 % der Kosten – mit Beleg.',    status:'oegk_erstattet' },
      { t:'Bei privater KV einreichen', d:'ÖGK-Beleg und Restbetrag bei der Versicherung einreichen.', status:'kv_eingereicht' },
    ],
    hinweis:'Übernimmt die ÖGK die Leistung gar nicht, entfallen die beiden ÖGK-Schritte – dann geht die Rechnung direkt an die private Versicherung.'
  },
  kassenrezept: {
    label:'Apotheke – Kassenrezept', kurz:'Kassenrezept', icon:'💊', c:'#0891b2', bg:'#ecfeff',
    steps:[
      { t:'Rezept einlösen',            d:'Du zahlst nur die Rezeptgebühr (7,55 € pro Packung).', status:'bezahlt' },
      { t:'Bei privater KV einreichen', d:'Beleg direkt bei der privaten Versicherung einreichen.', status:'kv_eingereicht' },
    ],
    hinweis:'Kein ÖGK-Schritt: Die Kasse hat ihren Anteil schon in der Apotheke übernommen.'
  },
  privatrezept: {
    label:'Apotheke – Privatrezept / freier Kauf', kurz:'Privatrezept', icon:'🧾', c:'#d97706', bg:'#fffbeb',
    steps:[
      { t:'Kauf zahlen',                d:'Du zahlst den vollen Apothekenpreis.',                    status:'bezahlt' },
      { t:'ÖGK einreichen (falls möglich)', d:'Nur wenn das Präparat im Kassenkatalog steht.',        status:'oegk_eingereicht', optional:true },
      { t:'Bei privater KV einreichen', d:'Beleg und Restbetrag bei der Versicherung einreichen.',    status:'kv_eingereicht' },
    ],
    hinweis:'Der ÖGK-Schritt ist optional. Steht das Präparat nicht im Kassenkatalog, geht der Beleg direkt an die private Versicherung.'
  },
};
const WEG_KEYS  = Object.keys(WEGE);
const wegOf     = inv => WEGE[inv && inv.weg] || WEGE.wahlarzt;

/* ==================================================================
   Dokumentenrollen. Eine Karte traegt mehrere Dateien mit je einer
   Rolle – nicht mehr eine einzige Datei. Der haeufigste Ablehnungs-
   grund ist ein fehlender Zahlungsnachweis, und die private Kasse
   will zusaetzlich den ÖGK-Bescheid, den es beim Einreichen bei der
   ÖGK noch gar nicht gibt. Deshalb waechst die Karte mit dem Vorgang.
   ================================================================== */
const DOCKINDS = {
  rechnung:         { label:'Rechnung / Honorarnote', kurz:'Rechnung',        icon:'🧾' },
  zahlungsnachweis: { label:'Zahlungsnachweis',       kurz:'Zahlung',         icon:'💳' },
  oegk_bescheid:    { label:'ÖGK-Bescheid',           kurz:'ÖGK-Bescheid',    icon:'🏛' },
  sonstiges:        { label:'Sonstiges',              kurz:'Sonstiges',       icon:'📎' },
};
const DOCKIND_KEYS = Object.keys(DOCKINDS);

/* Welche Rollen braucht dieses Ziel bei diesem Weg? */
const BEDARF = {
  wahlarzt:     { oegk:['rechnung','zahlungsnachweis'], kv:['rechnung','oegk_bescheid'] },
  kassenrezept: {                                       kv:['rechnung'] },
  privatrezept: { oegk:['rechnung','zahlungsnachweis'], kv:['rechnung'] },
};
function bedarfFuer(inv, targetKey){
  const b = (BEDARF[inv.weg || 'wahlarzt'] || {})[targetKey];
  const need = b ? b.slice() : ['rechnung'];
  /* Privatrezept: Der ÖGK-Bescheid wird erst dann verlangt, wenn dort
     ueberhaupt eingereicht wurde – sonst gibt es keinen. */
  if((inv.weg === 'privatrezept') && targetKey === 'kv' && inv.submittedOegkAt) need.push('oegk_bescheid');
  return [...new Set(need)];
}
const docKinds     = inv => new Set((inv.docs||[]).map(d=> d.kind));
const fehlendeDocs = (inv, t) => { const h = docKinds(inv); return bedarfFuer(inv, t).filter(k=> !h.has(k)); };
const docsFuer     = (inv, t) => { const need = bedarfFuer(inv, t);
  return (inv.docs||[]).filter(d=> need.includes(d.kind)); };

/* Altbestand aus der Einzeldatei-Zeit auf docs[] heben. */
function migrate(inv){
  let touched = false;
  if(!Array.isArray(inv.docs)){
    inv.docs = inv.fileData ? [{
      id: uid(), kind:'rechnung', name: inv.fileName || 'Rechnung',
      type: inv.fileType || '', data: inv.fileData, addedAt: inv.createdAt || new Date().toISOString()
    }] : [];
    touched = true;
  }
  if(!inv.weg){ inv.weg = 'wahlarzt'; touched = true; }
  return touched;
}

/* Ab wann gilt ein Vorgang als ueberfaellig? Erfahrungswerte, keine
   gesetzlichen Fristen – sie sollen nur ans Nachfragen erinnern. */
const FRIST = { oegk_eingereicht: 42, kv_eingereicht: 35 };
function ueberfaellig(inv){
  const grenze = FRIST[inv.status];
  if(!grenze) return 0;
  const stamp = inv.status === 'oegk_eingereicht' ? inv.submittedOegkAt : inv.submittedKvAt;
  const d = daysSince(stamp);
  return (d !== null && d > grenze) ? d : 0;
}

/* Welche Spalte kommt fuer diesen Beleg als naechstes? */
function naechsterSchritt(inv){
  const weg = wegOf(inv);
  const idx = weg.steps.findIndex(s=> s.status === inv.status);
  if(inv.status === 'abgeschlossen') return null;
  for(let i = idx + 1; i < weg.steps.length; i++){
    if(weg.steps[i].status) return weg.steps[i];
  }
  return { t:'Abschließen', d:'Alles erstattet – Karte auf „Abgeschlossen“ setzen.', status:'abgeschlossen' };
}
/* Spalten, die auf diesem Weg ueberhaupt vorkommen. */
function statusRelevant(weg, key){
  if(key === 'bezahlt' || key === 'abgeschlossen') return true;
  return WEGE[weg] ? WEGE[weg].steps.some(s=> s.status === key) : true;
}

/* ==================================================================
   MODUL 2: DECKUNG
   Welche Leistungen deckt meine private Krankenversicherung, mit
   welchem Limit, und wie viel davon ist dieses Jahr schon weg?
   Die Versicherer-Apps zeigen das nicht – deshalb hier.
   ================================================================== */

/* Uebliche Toepfe in oesterreichischen Privat-Krankenversicherungen.
   Dienen als Vorlage und als Suchbegriffe fuer die Polizzen-Analyse. */
const LEISTUNGS_KATALOG = [
  { key:'impfungen',      name:'Impfungen',                    icon:'💉', such:['impfung','impfungen','schutzimpfung','vakzin'] },
  { key:'vorsorge',       name:'Vorsorgeuntersuchung',         icon:'🩺', such:['vorsorge','gesundenuntersuchung','check-up','checkup'] },
  { key:'wahlarzt',       name:'Wahlarzt / Arzthonorare',      icon:'👨‍⚕️', such:['wahlarzt','arzthonorar','ärztliche behandlung','honorarnote'] },
  { key:'medikamente',    name:'Medikamente',                  icon:'💊', such:['medikament','arzneimittel','heilmittel'] },
  { key:'zahnbehandlung', name:'Zahnbehandlung',               icon:'🦷', such:['zahnbehandlung','zahnärztlich','konservierend'] },
  { key:'zahnersatz',     name:'Zahnersatz',                   icon:'🦷', such:['zahnersatz','prothetik','krone','implantat'] },
  { key:'sehbehelfe',     name:'Seh- und Hörbehelfe',          icon:'👓', such:['sehbehelf','brille','kontaktlinsen','hörgerät','hörbehelf'] },
  { key:'heilbehelfe',    name:'Heilbehelfe & Hilfsmittel',    icon:'🩹', such:['heilbehelf','hilfsmittel','bandage','einlagen'] },

/* ==================================================================
   Betrags- und Limitmuster in Polizzentexten.
   Polizzen sind fast immer Tabellen: "Impfungen .......... 150,00".
   Deshalb werden Fuellzeichen entfernt und auch der blanke Betrag am
   Zeilenende akzeptiert – aber nur, wenn die Zeile ein Leistungswort
   enthaelt, sonst faengt man Seitenzahlen und Paragraphen ein.
   ================================================================== */
function zahlAus(s){
  const v = parseFloat(String(s).replace(/\s/g,'').replace(/\.(?=\d{3}\b)/g,'').replace(',','.'));
  return isNaN(v) ? null : v;
}
function findeLimitImText(zeile, zeileHatLeistungswort){
  /* Punktfuehrungen, Unterstriche und Mehrfachleerzeichen raus */
  const t = String(zeile||'').replace(/[.․]{2,}|_{2,}/g,' ').replace(/\s+/g,' ').trim();

  /* 1. Stueckzahl zuerst: "10 Sitzungen" ist eindeutig und wuerde sonst
        von einem Betragsmuster als "10 EUR" eingesammelt. */
  let m = t.match(/(\d{1,3})\s*(?:mal\b|x\b|Sitzungen|Behandlungen|Einheiten|Stück|Konsultationen|Therapieeinheiten)/i);
  if(m){
    const v = parseInt(m[1],10);
    if(v > 0 && v < 500) return { typ:'anzahl', wert:v };
  }

  /* 2. Betrag mit Kontextwort. Waehrungszeichen ODER Nachkommastellen
        sind Pflicht – sonst wird aus "höchstens 3 Monate" ein Limit.
        Steht VOR der Prozentpruefung: ein Euro-Betrag ist das staerkere
        Signal, der Prozentsatz daneben ist meist der Selbstbehalt. */
  m = t.match(/(?:bis zu|max(?:imal)?\.?|höchstens|Höchstbetrag(?:\s*von)?|begrenzt mit|Limit(?:\s*von)?)[^\d%]{0,18}(?:(?:EUR|€)\s*(\d{1,3}(?:[.\s]\d{3})*(?:,\d{1,2})?|\d+(?:,\d{1,2})?)|(\d{1,3}(?:[.\s]\d{3})*,\d{2}))/i)
   || t.match(/(?:EUR|€)\s*(\d{1,3}(?:[.\s]\d{3})*(?:,\d{1,2})?|\d+(?:,\d{1,2})?)\s*(?:,-{1,2}|-{1,2})?\s*(?:pro|je|p\.a\.|jährlich|im\s+Jahr|alle\s+\d+\s*Jahre|innerhalb)/i)
   || t.match(/(\d{1,3}(?:[.\s]\d{3})*(?:,\d{1,2})?)\s*(?:EUR|€)\s*(?:pro|je|p\.a\.|jährlich|alle\s+\d+\s*Jahre)/i);
  if(m){
    const v = zahlAus(m[1] || m[2]);
    if(v != null && v > 0 && v < 1000000) return { typ:'betrag', wert:v };
  }

  /* 3. Prozentsatz – Selbstbehalts- und Wartezeitklauseln vorher
        entfernen, sonst wird der Selbstbehalt zum Deckungsgrad. */
  const ohneSB = t.replace(/Selbstbehalt[^,;.]{0,30}/ig,' ').replace(/Wartezeit[^,;.]{0,30}/ig,' ');
  m = ohneSB.match(/(\d{1,3})\s*(?:,\d)?\s*%/);
  if(m){
    const v = parseInt(m[1],10);
    if(v > 0 && v <= 100) return { typ:'prozent', wert:v };
  }

  /* 4. Nackter Betrag mit Waehrung irgendwo in der Zeile */
  m = t.match(/(?:EUR|€)\s*(\d{1,3}(?:[.\s]\d{3})*(?:,\d{1,2})?|\d+(?:,\d{1,2})?)/i)
   || t.match(/(\d{1,3}(?:[.\s]\d{3})*(?:,\d{1,2})?)\s*(?:EUR|€)/i);
  if(m){
    const v = zahlAus(m[1]);
    if(v != null && v > 0 && v < 1000000) return { typ:'betrag', wert:v };
  }

  /* 5. Tabellenfall: Betrag am Zeilenende ohne Waehrungszeichen.
        Nur zulassen, wenn die Zeile selbst die Leistung benennt. */
  if(zeileHatLeistungswort){
    m = t.match(/(\d{1,3}(?:[.\s]\d{3})*,\d{2}|\d{2,6})\s*(?:,-{1,2}|-{1,2})?\s*$/);
    if(m){
      const v = zahlAus(m[1]);
      if(v != null && v >= 20 && v < 1000000) return { typ:'betrag', wert:v };
    }
  }
  return null;
}

/* Selbstbehalt und Wartezeit als Zusatzinfo zum Topf */
function findeSelbstbehalt(t){
  const m = String(t).match(/Selbstbehalt[^\d%]{0,20}(?:(?:EUR|€)\s*(\d{1,3}(?:[.\s]\d{3})*(?:,\d{1,2})?)|(\d{1,3})\s*%)/i);
  if(!m) return '';
  return m[1] ? 'Selbstbehalt ' + zahlAus(m[1]) + ' EUR' : 'Selbstbehalt ' + m[2] + ' %';
}
function findeWartezeit(t){
  const m = String(t).match(/Wartezeit[^\d]{0,20}(\d{1,2})\s*(Monate?|Jahre?|Wochen?)/i);
  return m ? 'Wartezeit ' + m[1] + ' ' + m[2] : '';
}

/* ==================================================================
   Kopfdaten der Polizze: Versicherer, Beginn, Hauptfaelligkeit,
   Polizzennummer und – neu – die Praemie samt Zahlungsweise.
   ================================================================== */
const VERSICHERER_RE = /\b(Generali|UNIQA|Merkur|Wiener\s+St[äa]dtische|Allianz|Donau\s+Versicherung|Helvetia|Zurich|Muki|Grazer\s+Wechselseitige|GRAWE|Ergo|Nürnberger|Wüstenrot|Sparkassen\s+Versicherung)\b/i;

function findeDatumNach(text, labels, nurTagMonat){
  for(const lab of labels){
    const re = new RegExp(lab + '[^\\d]{0,30}(\\d{1,2})\\s*[.\\/-]\\s*(\\d{1,2})' +
                          (nurTagMonat ? '' : '\\s*[.\\/-]\\s*(\\d{2,4})'), 'i');
    const m = String(text).match(re);
    if(!m) continue;
    if(nurTagMonat) return { tag:Number(m[1]), monat:Number(m[2]) };
    const iso = alsPolizzenDatum(m[1], m[2], m[3]);
    if(iso) return iso;
  }
  return null;
}
/* Eigene Datumspruefung: anders als bei Rechnungen duerfen Polizzen
   weit in der Vergangenheit beginnen und in der Zukunft liegen. */
function alsPolizzenDatum(d, m, y){
  if(String(y).length === 2) y = (Number(y) > 70 ? '19' : '20') + y;
  const dd = Number(d), mm = Number(m), yy = Number(y);
  if(mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;
  if(yy < 1950 || yy > new Date().getFullYear() + 30) return null;
  return `${yy}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
}

function findePraemie(text, zeilen){
  const kandidaten = [];
  const zeilenArr = zeilen && zeilen.length ? zeilen : String(text||'').split(/\r?\n/);

  /* Globale Zahlungsweise als Rueckfallebene */
  let globalInt = null;
  const zw = String(text).match(/(?:Zahlungsweise|Zahlungsart|Prämienzahlung|zahlbar)\s*:?\s*(monatlich|vierteljährlich|halbjährlich|jährlich)/i);
  if(zw) globalInt = { 'monatlich':'monatlich', 'vierteljährlich':'quartal',
                       'halbjährlich':'halbjahr', 'jährlich':'jahr' }[zw[1].toLowerCase()];

  zeilenArr.forEach(z=>{
    const t = String(z||'').replace(/[.․]{2,}|_{2,}/g,' ').replace(/\s+/g,' ');
    const l = t.toLowerCase();
    if(!/prämie|praemie|beitrag/.test(l)) return;
    /* Was keine zu zahlende Praemie ist */
    if(/rückerstattung|rückvergütung|gewinnbeteiligung|beitragsrückerstattung|befreiung/.test(l)) return;

    let intervall = null, score = 0;
    if(/monatsprämie|monatlich|pro monat|je monat|p\.\s?m\./.test(l)){ intervall = 'monatlich'; score += 6; }
    else if(/vierteljähr|quartal/.test(l))                          { intervall = 'quartal';   score += 6; }
    else if(/halbjähr/.test(l))                                     { intervall = 'halbjahr';  score += 6; }
    else if(/jahresprämie|jährlich|pro jahr|p\.\s?a\./.test(l))     { intervall = 'jahr';      score += 6; }

    if(/gesamtprämie|zu zahlen|zahlbetrag|folgeprämie|prämie inkl|inkl\. versicherungssteuer/.test(l)) score += 5;
    if(/^prämie\b|prämie\s*:/.test(l)) score += 3;

    const m = t.match(/(?:EUR|€)\s*(\d{1,3}(?:[.\s]\d{3})*(?:,\d{1,2})?|\d+(?:,\d{1,2})?)/i)
           || t.match(/(\d{1,3}(?:[.\s]\d{3})*,\d{2})\s*(?:EUR|€)?/);
    if(!m) return;
    const betrag = zahlAus(m[1]);
    if(betrag == null || betrag <= 0 || betrag > 100000) return;

    kandidaten.push({ betrag, intervall: intervall || globalInt || 'monatlich',
                      score, sicher: score >= 6 || !!globalInt, quelle: t.slice(0,120) });
  });

  if(!kandidaten.length) return null;
  const max = Math.max(...kandidaten.map(k=> k.score));
  /* Bei Gleichstand die kleinste Zahl: die Gesamtjahressumme steht oft
     daneben, gemeint ist aber der wiederkehrende Zahlbetrag. */
  return kandidaten.filter(k=> k.score === max).sort((a,b)=> a.betrag - b.betrag)[0];
}

function polizzenKopf(text){
  const vers = String(text).match(VERSICHERER_RE);
  const beginn = findeDatumNach(text, [
    'Versicherungsbeginn','Vertragsbeginn','Beginn\\s+der\\s+Versicherung',
    'Versicherungsdauer\\s*(?:von|ab)','Beginn'
  ]);
  const hf = findeDatumNach(text, ['Hauptfälligkeit','Hauptfälligkeitstag','jährlich\\s+am'], true);
  const nr = String(text).match(/(?:Polizzen-?\s?(?:nummer|nr)\.?|Versicherungsschein-?\s?Nr\.?|Vertrags-?\s?(?:nummer|nr)\.?)\s*:?\s*([A-Za-z0-9][A-Za-z0-9\/\-.]{3,24})/i);
  return {
    versicherer: vers ? vers[1].replace(/\s+/g,' ') : '',
    beginn: beginn || '',
    hauptfaelligkeit: hf ? `${new Date().getFullYear()}-${String(hf.monat).padStart(2,'0')}-${String(hf.tag).padStart(2,'0')}` : '',
    polizzennr: nr ? nr[1].replace(/[.\-]$/,'') : '',
    praemie: findePraemie(text, String(text).split(/\r?\n/)),
  };
}
function findeZeitraum(zeile){
  const t = zeile.toLowerCase();
  if(/alle\s*(?:drei|3)\s*jahre|3-jahres/.test(t)) return 'drei';
  if(/alle\s*(?:fünf|5)\s*jahre|5-jahres/.test(t)) return 'fuenf';
  if(/einmalig|einmal\s+pro\s+vertrag/.test(t))    return 'einmalig';
  return 'jahr';
}

/* Polizzentext durchgehen und Leistungsvorschlaege bauen.
   Ergebnis sind VORSCHLAEGE – bestaetigt werden sie vom Nutzer. */
/* Nennt diese Zeile eine ANDERE Leistung? Dann endet der Geltungs-
   bereich des aktuellen Topfes dort – sonst zieht man sich den Betrag
   des Nachbarn und dessen Selbstbehalt herein. */
function anderesLeistungswort(zeile, ausserKey){
  const l = String(zeile||'').toLowerCase();
  return LEISTUNGS_KATALOG.some(k=> k.key !== ausserKey && k.such.length && k.such.some(s=> l.includes(s)));
}
const OHNE_LIMIT_RE = /ohne\s+(?:limit|begrenzung|höchstbetrag)|unbegrenzt|in\s+voller\s+höhe|zur\s+gänze/i;

function analysierePolizze(text){
  const zeilen = String(text||'').split(/\r?\n/).map(z=> z.trim()).filter(z=> z.length > 2);
  const treffer = new Map();

  zeilen.forEach((z, i)=>{
    const lower = z.toLowerCase();
    for(const kat of LEISTUNGS_KATALOG){
      if(!kat.such.length) continue;
      if(!kat.such.some(s=> lower.includes(s))) continue;

      /* Geltungsbereich: die Zeile selbst, danach hoechstens zwei
         Folgezeilen – und nur solange dort keine andere Leistung
         beginnt. Jede Zeile wird EINZELN geprueft, nicht als Block. */
      const bereich = [{ t:z, eigen:true, guete:3 }];
      for(let k = 1; k <= 2; k++){
        const n = zeilen[i+k];
        if(!n || anderesLeistungswort(n, kat.key)) break;
        bereich.push({ t:n, eigen:false, guete:3-k });
      }

      let limit = null, guete = 0, fundZeile = z;
      const explizitOffen = bereich.some(b=> OHNE_LIMIT_RE.test(b.t));
      if(!explizitOffen){
        for(const b of bereich){
          const l = findeLimitImText(b.t, b.eigen);
          if(l){ limit = l; guete = b.guete; fundZeile = b.t; break; }
        }
      }

      /* Zeitraum und Zusaetze nur aus dem eigenen Bereich lesen. */
      const eigenerText = bereich.map(b=> b.t).join(' ');
      const kandidat = {
        key: kat.key, name: kat.name, icon: kat.icon,
        limitTyp: limit ? limit.typ : 'unbegrenzt',
        limit:    limit ? limit.wert : 0,
        zeitraum: findeZeitraum(fundZeile + ' ' + z),
        notizZusatz: [findeSelbstbehalt(eigenerText), findeWartezeit(eigenerText)].filter(Boolean).join(' · '),
        quelle:   (z + (fundZeile !== z ? ' | ' + fundZeile : '')).replace(/\s+/g,' ').slice(0,140),
        sicher:   !!limit || explizitOffen,
        guete:    limit ? guete : (explizitOffen ? 1 : 0),
      };
      const alt = treffer.get(kat.key);
      if(!alt || kandidat.guete > alt.guete) treffer.set(kat.key, kandidat);
      break;
    }
  });
  return [...treffer.values()];
}

/* ==================================================================
   PRAEMIEN UND BILANZ
   Praemien werden als Zeitreihe gefuehrt: jeder Eintrag gilt ab seinem
   Datum bis zum naechsten. So wird die jaehrliche Indexanpassung
   sichtbar – der Punkt, an dem die Asymmetrie am staerksten wirkt,
   weil einzelne Erhoehungen klein aussehen und sich still aufsummieren.
   ================================================================== */
const INTERVALLE = {
  monatlich: { label:'monatlich',      proJahr:12 },
  quartal:   { label:'vierteljährlich', proJahr:4 },
  halbjahr:  { label:'halbjährlich',   proJahr:2 },
  jahr:      { label:'jährlich',       proJahr:1 },
};
const monatsBetrag = e => (Number(e.betrag)||0) * (INTERVALLE[e.intervall]||INTERVALLE.monatlich).proJahr / 12;

/* Summe aller Praemien zwischen zwei Zeitpunkten, monatsweise.
   Gerechnet wird auf Jahr-Monat-Ganzzahlen statt mit Date-Objekten:
   'YYYY-MM-DD' parst als UTC-Mitternacht, ein daraus gebautes lokales
   Datum liegt in Mitteleuropa eine Stunde davor – dadurch fiel bei der
   ersten Fassung jeweils der Startmonat aus der Summe. */
/* Lokales Datum als 'YYYY-MM-DD'. NICHT toISOString() verwenden: das
   rechnet nach UTC um und verschiebt in Mitteleuropa auf den Vortag. */
const isoLocal = d => d.getFullYear() + '-' + String(d.getMonth()+1).padStart(2,'0')
                    + '-' + String(d.getDate()).padStart(2,'0');
const ymOf = iso => { const [y,m] = String(iso||'').split('-').map(Number);
                      return (y||0) * 12 + ((m||1) - 1); };
function praemienSumme(pol, vonISO, bisISO){
  const liste = ((pol && pol.praemien) || []).filter(e=> e.ab)
                  .slice().sort((a,b)=> a.ab.localeCompare(b.ab));
  if(!liste.length) return 0;
  const heute  = new Date();
  const heuteISO = heute.getFullYear() + '-' + String(heute.getMonth()+1).padStart(2,'0') + '-01';
  const vonYM = ymOf(vonISO || liste[0].ab);
  const bisYM = ymOf(bisISO || heuteISO);
  if(bisYM < vonYM) return 0;
  let summe = 0;
  for(let ym = vonYM; ym <= bisYM && ym - vonYM < 1200; ym++){
    let gueltig = null;
    for(const e of liste){ if(ymOf(e.ab) <= ym) gueltig = e; }
    if(gueltig) summe += monatsBetrag(gueltig);
  }
  return summe;
}
const praemienImJahr = (pol, jahr) =>
  praemienSumme(pol, jahr+'-01-01', Math.min(jahr,new Date().getFullYear()) === new Date().getFullYear()
    ? isoLocal(new Date()) : jahr+'-12-31');

/* Was ist tatsaechlich zurueckgekommen – nicht was beantragt wurde. */
const erstattetGesamt = inv => (Number(inv.erstattetOegk)||0) + (Number(inv.erstattetKv)||0);
function erstattungenImJahr(jahr, feld){
  return invoices.filter(i=> (i.date||'').slice(0,4) === String(jahr))
                 .reduce((s,i)=> s + (Number(i[feld])||0), 0);
}
function erstattungenGesamt(feld){
  return invoices.reduce((s,i)=> s + (Number(i[feld])||0), 0);
}
/* Erstattungsquote je Weg: was kam zurueck, gemessen am Rechnungsbetrag. */
function quoteJeWeg(){
  const out = {};
  WEG_KEYS.forEach(w=>{
    const rel = invoices.filter(i=> (i.weg||'wahlarzt') === w && Number(i.amount) > 0 && erstattetGesamt(i) > 0);
    if(!rel.length) return;
    const ein = rel.reduce((s,i)=> s + Number(i.amount), 0);
    const zur = rel.reduce((s,i)=> s + erstattetGesamt(i), 0);
    out[w] = { n: rel.length, ein, zur, quote: ein ? Math.round(zur/ein*100) : 0 };
  });
  return out;
}

/* ==================================================================
   FRISTENWAECHTER
   ÖGK: 42 Monate ab Leistungsdatum (quelle: oegk.at). Private
   Versicherer setzen eigene, oft deutlich kuerzere Fristen – deshalb
   pro Polizze konfigurierbar.
   ================================================================== */
const FRIST_OEGK_MONATE = 42;
function fristStatus(inv){
  if(!inv.date || inv.status === 'abgeschlossen') return null;
  const monate = (inv.status === 'bezahlt' || inv.status === 'oegk_eingereicht')
    ? FRIST_OEGK_MONATE
    : ((policy && Number(policy.fristMonate)) || FRIST_OEGK_MONATE);
  const [fy,fm,fd] = inv.date.split('-').map(Number);
  const ende = new Date(fy, fm-1, fd, 12);
  ende.setMonth(ende.getMonth() + monate);
  const tage = Math.floor((ende - Date.now()) / 86400000);
  if(tage < 0)   return { stufe:'abgelaufen', tage, ende };
  if(tage <= 90) return { stufe:'knapp',      tage, ende };
  return null;
}

/* Welche der erfassten Töpfe und Verträge passen zu diesem Anlass? */
function anlassTreffer(anlass){
  const meine = (leistungen||[]).filter(l=> (anlass.toepfe||[]).includes(l.key));
  const vertr = (vertraege||[]).filter(v=> (anlass.vertraege||[]).includes(v.art));
  const fehlend = (anlass.toepfe||[]).filter(k=> !(leistungen||[]).some(l=> l.key === k))
                    .map(k=> katalogByKey[k]).filter(Boolean);
  return { meine, vertr, fehlend };
}

/* ---- Periodenende, fuer Verfallswarnungen ---- */
function periodeEnde(policy, zeitraum){
  const start = periodeStart(policy, zeitraum);
  const jahre = Math.max(1, (ZEITRAEUME[zeitraum]||ZEITRAEUME.jahr).monate / 12);
  const [y,m,d] = start.split('-').map(Number);
  const e = new Date(y + jahre, m-1, d, 12);   // Mittag: immun gegen Sommerzeitwechsel
  e.setDate(e.getDate() - 1);
  return e;
}

/* ==================================================================
   Hinweise, die sich allein aus den eigenen Daten ergeben.
   Jeder Hinweis nennt einen konkreten naechsten Schritt – reine
   Feststellungen ohne Handlung sind nur Rauschen.
   ================================================================== */
function chancenHinweise(){
  const h = [];
  const heute = new Date();

  /* 1. Töpfe, die ungenutzt auslaufen */
  (leistungen||[]).forEach(l=>{
    if(l.limitTyp !== 'betrag' && l.limitTyp !== 'anzahl') return;
    if(!l.limit) return;
    const v = verbrauchFuer(l, policy, usage);
    const rest = restVon(l, v);
    if(rest === null || rest <= 0) return;
    const ende = periodeEnde(policy, l.zeitraum);
    const tage = Math.ceil((ende - heute) / 86400000);
    if(tage < 0 || tage > 120) return;
    const anteil = l.limit ? rest / l.limit : 0;
    h.push({
      stufe: tage <= 45 ? 'hoch' : 'mittel',
      icon: l.icon || '⏳',
      titel: `${l.name}: ${l.limitTyp === 'anzahl' ? rest + '×' : fmtEUR(rest)} verfallen in ${tage} Tagen`,
      text: `Der Topf läuft am ${fmtDate(isoLocal(ende))} ab. ` +
            (anteil > 0.9 ? 'Bisher hast du daraus nichts abgerufen.' : 'Der Rest verfällt ungenutzt.'),
      aktion:'leistung', ziel:l.id,
    });
  });

  /* 2. Mehrjahres-Töpfe, die wieder frei sind */
  (leistungen||[]).forEach(l=>{
    if(l.zeitraum === 'jahr' || l.zeitraum === 'einmalig') return;
    const v = verbrauchFuer(l, policy, usage);
    if(v.genutzt > 0) return;
    const alle = (usage||[]).filter(u=> u.leistungId === l.id);
    if(!alle.length) return;                       // nie genutzt: eigener Fall oben
    h.push({
      stufe:'mittel', icon:l.icon || '🔄',
      titel:`${l.name}: Rahmen ist wieder frei`,
      text:`Die neue Periode läuft seit ${fmtDate(periodeStart(policy, l.zeitraum))}. ` +
           `Zuletzt genutzt am ${fmtDate(alle.map(u=>u.datum).sort().reverse()[0])}.`,
      aktion:'leistung', ziel:l.id,
    });
  });

  /* 3. Rechnungen, die nur bei einer Stelle waren */
  invoices.forEach(inv=>{
    if(inv.status === 'abgeschlossen') return;
    const w = inv.weg || 'wahlarzt';
    if(inv.submittedOegkAt && !inv.submittedKvAt && (BEDARF[w]||{}).kv){
      h.push({ stufe:'mittel', icon:'🏥',
        titel:`„${inv.title || 'Rechnung'}“ war noch nicht bei der privaten Versicherung`,
        text:`Bei der ÖGK eingereicht am ${fmtDate(inv.submittedOegkAt)}. Der Restbetrag ist damit noch offen.`,
        aktion:'rechnung', ziel:inv.id });
    }
    if(!inv.submittedOegkAt && !inv.submittedKvAt && Number(inv.amount) > 0 && inv.status === 'bezahlt'){
      h.push({ stufe:'mittel', icon:'📤',
        titel:`„${inv.title || 'Rechnung'}“ ist nirgends eingereicht`,
        text:`${fmtEUR(inv.amount)} vom ${fmtDate(inv.date)} – bisher hast du dafür nichts zurückgeholt.`,
        aktion:'rechnung', ziel:inv.id });
    }
  });

  /* 4. Fristen, die auslaufen */
  invoices.forEach(inv=>{
    const f = fristStatus(inv);
    if(!f) return;
    h.push({
      stufe: f.stufe === 'abgelaufen' ? 'hoch' : 'hoch',
      icon: f.stufe === 'abgelaufen' ? '⛔' : '⏰',
      titel: f.stufe === 'abgelaufen'
        ? `„${inv.title || 'Rechnung'}“: Einreichfrist ist abgelaufen`
        : `„${inv.title || 'Rechnung'}“: nur noch ${f.tage} Tage Zeit`,
      text: f.stufe === 'abgelaufen'
        ? `Die Frist endete am ${fmtDate(isoLocal(f.ende))}. Ein Versuch kann sich trotzdem lohnen – manche Stellen kulanzen.`
        : `Frist bis ${fmtDate(isoLocal(f.ende))}. Danach ist der Anspruch weg.`,
      aktion:'rechnung', ziel:inv.id });
  });

  /* 5. Kündigungsfenster */
  (vertraege||[]).forEach(v=>{
    const f = kuendigungsFenster(v);
    if(!f || f.tage < 0 || f.tage > 60) return;
    h.push({ stufe:'mittel', icon:'📄',
      titel:`${v.versicherer || (VERTRAGSARTEN[v.art||'sonstige'].label)}: Kündigungsfenster schließt in ${f.tage} Tagen`,
      text:`Stichtag ${fmtDate(isoLocal(f.stichtag))}. Wenn du wechseln oder anpassen willst, ist jetzt der Zeitpunkt.`,
      aktion:'vertrag', ziel:v.id });
  });

  /* 6. Keine Unfallversicherung erfasst */
  if((vertraege||[]).length && !(vertraege||[]).some(v=> v.art === 'unfall')){
    h.push({ stufe:'niedrig', icon:'🩹',
      titel:'Keine Unfallversicherung erfasst',
      text:'Falls du eine hast, trag sie ein. Nach einem Sturz zählen bei diesen Verträgen oft nur wenige Tage Meldefrist – dann muss klar sein, wo du meldest.',
      aktion:'vertrag', ziel:null });
  }

  const rang = { hoch:0, mittel:1, niedrig:2 };
  return h.sort((a,b)=> rang[a.stufe] - rang[b.stufe]);
}

/* ---- Berechnung: was ist verbraucht, was bleibt ---- */
/* Liefert den Periodenbeginn als 'YYYY-MM-DD'. Reine Stringrechnung,
   damit keine Zeitzone hineinspielt (siehe Hinweis bei praemienSumme). */
function periodeStart(policy, zeitraum){
  const heute  = new Date();
  const hJ = heute.getFullYear();
  const hM = heute.getMonth() + 1;
  const hT = heute.getDate();
  if(zeitraum === 'einmalig') return '2000-01-01';
  const monate = (ZEITRAEUME[zeitraum]||ZEITRAEUME.jahr).monate;
  const jahre  = Math.max(1, monate/12);

  if(!policy || !policy.beginn){
    /* Ohne Polizzenbeginn: Kalenderjahr, bei Mehrjahrestoepfen n Jahre zurueck */
    return (hJ - (jahre - 1)) + '-01-01';
  }
  /* Versicherungsjahr: letzter Jahrestag des Polizzenbeginns */
  const [, bM, bT] = policy.beginn.split('-').map(Number);
  let ankerJ = hJ;
  if(hM < bM || (hM === bM && hT < bT)) ankerJ -= 1;   // Jahrestag heuer noch nicht erreicht
  ankerJ -= (jahre - 1);
  return ankerJ + '-' + String(bM).padStart(2,'0') + '-' + String(bT).padStart(2,'0');
}
function verbrauchFuer(leistung, policy, alleUsage){
  const ab = periodeStart(policy, leistung.zeitraum);
  /* Stringvergleich: 'YYYY-MM-DD' sortiert lexikografisch korrekt. */
  const rel = alleUsage.filter(u=> u.leistungId === leistung.id && String(u.datum||'') >= ab);
  const summe = rel.reduce((s,u)=> s + (Number(u.betrag)||0), 0);
  const anzahl = rel.reduce((s,u)=> s + (Number(u.menge)||1), 0);
  return { ab, eintraege: rel, summe, anzahl,
           genutzt: leistung.limitTyp === 'anzahl' ? anzahl : summe };
}
function restVon(leistung, v){
  if(leistung.limitTyp === 'unbegrenzt' || leistung.limitTyp === 'prozent') return null;
  return Math.max(0, Number(leistung.limit||0) - v.genutzt);
}

/* ---------- IndexedDB ---------- */
let db;
function openDB(){
  return new Promise((resolve,reject)=>{
    /* Version 2: Polizzen und Leistungsverbrauch kommen dazu.
       Bestehende invoices bleiben unberuehrt. */
    const req = indexedDB.open('rechnungs-tracker', 2);
    req.onupgradeneeded = e=>{
      const d = e.target.result;
      if(!d.objectStoreNames.contains('invoices')) d.createObjectStore('invoices', { keyPath:'id' });
      if(!d.objectStoreNames.contains('policies')) d.createObjectStore('policies', { keyPath:'id' });
      if(!d.objectStoreNames.contains('usage'))    d.createObjectStore('usage',    { keyPath:'id' });
    };
    req.onsuccess = e=>{ db = e.target.result; resolve(db); };
    req.onerror = e=> reject(e);
  });
}
/* Generischer Zugriff fuer die neuen Stores */
function stAll(store){
  return new Promise((resolve,reject)=>{
    const r = db.transaction(store,'readonly').objectStore(store).getAll();
    r.onsuccess = ()=> resolve(r.result || []); r.onerror = e=> reject(e);
  });
}
function stPut(store, rec){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).put(rec);
    tx.oncomplete = ()=>{ markSaved(); resolve(); }; tx.onerror = e=> reject(e);
  });
}
function stDel(store, id){
  return new Promise((resolve,reject)=>{
    const tx = db.transaction(store,'readwrite');
    tx.objectStore(store).delete(id);
    tx.oncomplete = ()=>{ markSaved(); resolve(); }; tx.onerror = e=> reject(e);
  });
}

const uid = ()=> 'inv_' + Date.now().toString(36) + Math.random().toString(36).slice(2,8);
const fmtEUR = n => (n===''||n===null||n===undefined||isNaN(n)) ? '–' : Number(n).toLocaleString('de-AT',{style:'currency',currency:'EUR'});
const fmtDate = iso => iso ? new Date(iso).toLocaleDateString('de-AT') : '–';
const fmtDateTime = iso => { const d=new Date(iso); return d.toLocaleDateString('de-AT')+' '+d.toLocaleTimeString('de-AT',{hour:'2-digit',minute:'2-digit'}); };
const escapeHTML = s => String(s).replace(/[&<>"']/g, c=> ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));

function fileToDataURL(file){
  return new Promise((resolve,reject)=>{
    const r = new FileReader();
    r.onload = ()=> resolve(r.result); r.onerror = reject;
    r.readAsDataURL(file);
  });
}
function dataURLtoBlob(dataURL, type){
  const [head, b64] = dataURL.split(',');
  const mime = type || (head.match(/:(.*?);/)||[])[1] || 'application/octet-stream';
  const bin = atob(b64); const arr = new Uint8Array(bin.length);
  for(let i=0;i<bin.length;i++) arr[i] = bin.charCodeAt(i);
  return new Blob([arr], { type:mime });
}
/* Data-URLs sind fuer PDF-Vorschau auf Android unbrauchbar – Blob-URL nutzen. */
function dataURLtoBlobURL(dataURL, type){
  try{ return URL.createObjectURL(dataURLtoBlob(dataURL, type)); }
  catch(e){ return null; }
}
async function copyToClipboard(text){
  try{ await navigator.clipboard.writeText(text); return true; }
  catch(e){ return false; }
}
const daysSince = iso => iso ? Math.floor((Date.now() - new Date(iso).getTime()) / 86400000) : null;
function toast(msg){
  const t = document.getElementById('toast');

  clearTimeout(toast._t);

let pdfjsPromise = null;
function getPdfjs(){
  if(!pdfjsPromise){
    pdfjsPromise = import('./vendor/pdfjs/pdf.min.mjs').then(mod=>{
      mod.GlobalWorkerOptions.workerSrc = './vendor/pdfjs/pdf.worker.min.mjs';
      return mod;
    });
  }
  return pdfjsPromise;
}
let tesseractWorkerPromise = null;
function getTesseractWorker(){
  if(!tesseractWorkerPromise){
    tesseractWorkerPromise = Tesseract.createWorker('deu', 1, {
      workerPath:'./vendor/tesseract/worker.min.js',
      corePath:'./vendor/tesseract/',
      langPath:'./vendor/tesseract/lang/',
      gzip:true,
    });
  }
  return tesseractWorkerPromise;
}
async function analyzePDF(file){
  const pdfjsLib = await getPdfjs();
  const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const allLines = [];
  for(let p=1; p<=doc.numPages; p++){
    const content = await (await doc.getPage(p)).getTextContent();
    let curY = null, curLine = [];
    for(const item of content.items){
      const y = Math.round(item.transform[5]);
      if(curY === null || Math.abs(y - curY) > 2){
        if(curLine.length) allLines.push(curLine.join(''));
        curLine = [item.str]; curY = y;
      } else curLine.push(item.str);
    }
    if(curLine.length) allLines.push(curLine.join(''));
  }
  return parseInvoiceText(allLines.join('\n'), allLines);
}
/* ==================================================================
   Bildvorverarbeitung vor der OCR.
   Handyfotos sind schief belichtet, zu gross und farbig – Tesseract
   arbeitet auf sauberem Graustufenbild mit gestrecktem Kontrast
   deutlich besser. Kostet Sekundenbruchteile, spart Fehlerkennungen.
   ================================================================== */
async function bildAufbereiten(file){
  try{
    const bmp = await createImageBitmap(file);
    /* Zielgroesse: lange Kante ~1800px. Kleinere Bilder werden hochskaliert
       (OCR braucht Mindesthoehe pro Zeichen), riesige heruntergerechnet. */
    const lang  = Math.max(bmp.width, bmp.height);
    const scale = Math.min(2.5, Math.max(0.4, 1800 / lang));
    const w = Math.round(bmp.width * scale), h = Math.round(bmp.height * scale);

    const c = document.createElement('canvas');
    c.width = w; c.height = h;
    const ctx = c.getContext('2d', { willReadFrequently:true });
    ctx.imageSmoothingQuality = 'high';
    ctx.drawImage(bmp, 0, 0, w, h);
    if(bmp.close) bmp.close();

    const img = ctx.getImageData(0, 0, w, h);
    const d = img.data;

    /* 1. Graustufen, dabei Histogramm fuer die Kontrastspreizung sammeln */
    const hist = new Uint32Array(256);
    for(let i = 0; i < d.length; i += 4){
      const g = (d[i]*0.299 + d[i+1]*0.587 + d[i+2]*0.114) | 0;
      d[i] = d[i+1] = d[i+2] = g;
      hist[g]++;
    }
    /* 2. Perzentile statt Min/Max – robust gegen einzelne dunkle Pixel */
    const gesamt = w * h;
    let lo = 0, hi = 255, acc = 0;
    for(let i = 0; i < 256; i++){ acc += hist[i]; if(acc > gesamt * 0.02){ lo = i; break; } }
    acc = 0;
    for(let i = 255; i >= 0; i--){ acc += hist[i]; if(acc > gesamt * 0.02){ hi = i; break; } }
    const spanne = Math.max(1, hi - lo);

    /* 3. Kontrast strecken und leicht anheben */
    for(let i = 0; i < d.length; i += 4){
      let v = (d[i] - lo) / spanne * 255;
      v = v < 0 ? 0 : v > 255 ? 255 : v;
      v = v < 128 ? v * 0.85 : 255 - (255 - v) * 0.85;   // Schwarz dunkler, Weiss heller
      d[i] = d[i+1] = d[i+2] = v | 0;
    }
    ctx.putImageData(img, 0, 0);
    return c;
  }catch(err){
    console.warn('Vorverarbeitung übersprungen:', err);
    return null;
  }
}

async function analyzeImage(file){
  const worker  = await getTesseractWorker();
  const quelle  = (await bildAufbereiten(file)) || (await fileToDataURL(file));
  const { data } = await worker.recognize(quelle);
  const text = data.text || '';

}
function normalizeAmount(raw){
  raw = String(raw).trim();
  if(raw.includes(',')) raw = raw.replace(/\./g,'').replace(',', '.');
  else if(/\.\d{1,2}$/.test(raw)){ /* bereits Dezimalpunkt */ }
  else raw = raw.replace(/\./g,'');
  return parseFloat(raw);
}

/* ==================================================================
   BETRAG – gewichtet statt "erster Treffer".
   Der erste Euro-Betrag auf einer Honorarnote ist fast nie die Summe,
   sondern ein Einzelposten. Deshalb werden alle Kandidaten gesammelt
   und nach Umfeld bewertet: Summenwoerter zaehlen stark positiv,
   Zwischensummen und Steuerzeilen negativ, unten im Dokument leicht
   positiv. Erst dann wird ausgewaehlt.
   ================================================================== */
const AMOUNT_RE = /(?:€|EUR)\s*(\d{1,3}(?:[.\s]\d{3})*(?:[.,]\d{1,2})?|\d+(?:[.,]\d{1,2})?)|(\d{1,3}(?:[.\s]\d{3})*(?:[.,]\d{1,2})?|\d+[.,]\d{1,2})\s*(?:€|EUR)/gi;
function extractAmount(text, lines){
  const zeilen = (lines && lines.length ? lines : String(text||'').split(/\r?\n/)).map(z=> String(z||''));
  const kandidaten = [];

  zeilen.forEach((z, i)=>{
    const l = z.toLowerCase();
    let score = 0;
    if(/gesamtbetrag|rechnungsbetrag|endbetrag|zahlbetrag|zu\s*zahlen|gesamtsumme|honorar\s*gesamt|rechnungssumme|zu\s*bezahlen|offener\s*betrag/.test(l)) score += 10;
    else if(/\bsumme\b|\bgesamt\b|\btotal\b|\bbetrag\b/.test(l))                                     score += 5;
    if(/zwischensumme|netto|mwst|ust\b|umsatzsteuer|steuer|rabatt|skonto|anzahlung|guthaben|übertrag/.test(l)) score -= 8;
    if(/rezeptgebühr|selbstbehalt|einzelpreis|stück|packung/.test(l))                                 score -= 4;
    if(/erstatt|rückersatz|refund|kassenanteil/.test(l))                                              score -= 6;
    score += Math.round((i / Math.max(1, zeilen.length)) * 3);   // weiter unten = eher Summe

    let m;
    AMOUNT_RE.lastIndex = 0;
    while((m = AMOUNT_RE.exec(z)) !== null){
      const n = normalizeAmount(m[1] || m[2]);
      if(isNaN(n) || n <= 0 || n >= 100000) continue;
      kandidaten.push({ n, score });
    }
  });

  if(!kandidaten.length) return null;
  const maxScore = Math.max(...kandidaten.map(k=> k.score));
  /* Bei Gleichstand der groesste Betrag – die Summe ist nie kleiner als ihre Posten. */
  return kandidaten.filter(k=> k.score === maxScore).reduce((a,b)=> b.n > a.n ? b : a).n;
}

/* ==================================================================
   DATUM – Label schlaegt Position, Plausibilitaet schlaegt beides.
   Ein Beleg enthaelt Druckdatum, Faelligkeit, Geburtsdatum und
   Leistungsdatum. Gesucht ist das Leistungsdatum.
   ================================================================== */
const MONATE = { jan:1,feb:2,mär:3,mae:3,mar:3,apr:4,mai:5,jun:6,jul:7,aug:8,sep:9,okt:10,nov:11,dez:12 };
function alsISO(d, m, y){
  if(String(y).length === 2) y = (Number(y) > 70 ? '19' : '20') + y;
  const dd = Number(d), mm = Number(m), yy = Number(y);
  if(mm < 1 || mm > 12 || dd < 1 || dd > 31) return null;
  const iso = `${String(yy).padStart(4,'0')}-${String(mm).padStart(2,'0')}-${String(dd).padStart(2,'0')}`;
  const jetzt = new Date(), jahr = jetzt.getFullYear();
  if(yy < jahr - 8 || yy > jahr + 1) return null;                       // unplausibel
  if(new Date(iso) > new Date(Date.now() + 2*86400000)) return null;    // Zukunft
  return iso;
}
function datumKandidaten(zeile){
  const out = [];
  let m;
  const re1 = /(\d{1,2})\s*[.\/-]\s*(\d{1,2})\s*[.\/-]\s*(\d{2,4})/g;
  while((m = re1.exec(zeile)) !== null){ const iso = alsISO(m[1],m[2],m[3]); if(iso) out.push(iso); }
  const re2 = /(\d{4})-(\d{2})-(\d{2})/g;
  while((m = re2.exec(zeile)) !== null){ const iso = alsISO(m[3],m[2],m[1]); if(iso) out.push(iso); }
  const re3 = /(\d{1,2})\.?\s*([A-Za-zä]{3,9})\.?\s*(\d{4})/g;
  while((m = re3.exec(zeile)) !== null){
    const mo = MONATE[m[2].slice(0,3).toLowerCase()];
    if(mo){ const iso = alsISO(m[1], mo, m[3]); if(iso) out.push(iso); }
  }
  return out;
}
function extractDate(text, lines){
  const zeilen = (lines && lines.length ? lines : String(text||'').split(/\r?\n/));
  const treffer = [];
  zeilen.forEach(z=>{
    const l = String(z||'').toLowerCase();
    let score = 0;
    if(/leistungsdatum|behandlungsdatum|datum der (leistung|behandlung)|leistungszeitraum|therapiedatum/.test(l)) score += 10;
    else if(/rechnungsdatum|rechnung vom|beleg vom|ausstellungsdatum/.test(l)) score += 6;
    else if(/\bdatum\b|\bam\b/.test(l)) score += 2;
    if(/geburt|geb\.|geboren|gültig bis|fällig|zahlbar bis|valuta|druckdatum/.test(l)) score -= 8;
    datumKandidaten(String(z||'')).forEach(iso=> treffer.push({ iso, score }));
  });
  if(!treffer.length) return null;
  const max = Math.max(...treffer.map(t=> t.score));
  /* Bei Gleichstand das aelteste – das Leistungsdatum liegt vor dem Druckdatum. */
  return treffer.filter(t=> t.score === max).map(t=> t.iso).sort()[0];
}

/* ==================================================================
   AUSSTELLER – Zeilen bewerten statt die erste nehmen.
   ================================================================== */
function extractIssuer(lines){
  const zeilen = (lines||[]).map(l=> String(l||'').trim()).filter(Boolean).slice(0,25);
  let best = null, bestScore = -99;
  zeilen.forEach((z, i)=>{
    if(z.length < 4 || z.length > 90) return;
    let score = 0;
    if(/^(Dr\.|DDr\.|Dipl|Mag\.|Prim\.|Univ|Doz\.|OA\b|MR\b|Prof\.)/i.test(z)) score += 10;
    if(/apotheke|ordination|zahnarzt|arztpraxis|institut|labor|ambulatorium|therapiezentrum|physiotherapie/i.test(z)) score += 8;
    if(/\b(fach)?arzt|ärztin|facharzt für|allgemeinmedizin|zahnmedizin/i.test(z)) score += 5;
    if(/gmbh|og\b|kg\b|e\.u\.|verein/i.test(z)) score += 2;
    /* Was sicher nicht der Aussteller ist */
    if(/honorarnote|rechnung|beleg|seite \d|uid|atu\d|iban|bic|tel\.|telefon|e-?mail|www\.|@|\d{4}\s+\w+straße|steuernummer|kundennummer/i.test(z)) score -= 10;
    if(/^\d/.test(z)) score -= 4;
    score += Math.max(0, 4 - i);                       // oben im Dokument bevorzugt
    if(score > bestScore){ bestScore = score; best = z; }
  });
  return bestScore > 0 ? best.replace(/\s{2,}/g,' ').slice(0,80) : (zeilen[0]||'').slice(0,80);
}

function extractRechnungsnr(text){
  const m = String(text||'').match(/(?:Rechnungs-?\s?(?:nummer|nr)\.?|Beleg-?\s?Nr\.?|Honorarnote\s*Nr\.?|Faktura\s*Nr\.?)\s*:?\s*([A-Za-z0-9][A-Za-z0-9\/\-.]{1,24})/i);
  return m ? m[1].replace(/[.\-]$/,'') : '';
}
function extractIBAN(text){
  const m = String(text||'').replace(/\s+/g,' ')
    .match(/\b([A-Z]{2}\d{2}(?:\s?[A-Z0-9]{4}){2,7}(?:\s?[A-Z0-9]{1,4})?)\b/);
  return m ? m[1].replace(/\s+/g,'') : '';
}

function parseInvoiceText(text, lines){
  return {
    amount:      extractAmount(text, lines),
    date:        extractDate(text, lines),
    issuer:      extractIssuer(lines),
    rechnungsnr: extractRechnungsnr(text),
    iban:        extractIBAN(text),
    rawText:     text,
  };
}
/* ==================================================================
   QR-Code auf dem Beleg ("Zahlen mit Code", EPC069-12 / Stuzza).
   Liefert Betrag, Empfaenger und Referenz exakt statt geraten.
   Faellt still auf OCR zurueck, wenn kein Code da ist oder die
   BarcodeDetector-API fehlt (z. B. Firefox, aeltere Systeme).
   ================================================================== */
function parseEPC(raw){
  const l = String(raw).split(/\r?\n/);
  if((l[0]||'').trim().toUpperCase() !== 'BCD') return null;
  const m = (l[7]||'').trim().match(/^EUR\s*([\d.]+)$/i);
  const amount = m ? parseFloat(m[1]) : null;
  return {
    creditor : (l[5]||'').trim(),
    iban     : (l[6]||'').trim(),
    amount   : (amount && amount > 0 && amount < 100000) ? amount : null,
    reference: (l[9]||'').trim() || (l[10]||'').trim(),
  };
}
async function qrCapable(){
  if(!('BarcodeDetector' in window)) return false;
  try{ return (await BarcodeDetector.getSupportedFormats()).includes('qr_code'); }
  catch(e){ return false; }
}
async function pdfFirstPageCanvas(file){
  const pdfjsLib = await getPdfjs();
  const doc  = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
  const page = await doc.getPage(1);
  const vp   = page.getViewport({ scale:2 });   // 2x: kleine QR-Codes bleiben lesbar
  const canvas = document.createElement('canvas');
  canvas.width = vp.width; canvas.height = vp.height;
  await page.render({ canvasContext: canvas.getContext('2d'), viewport: vp }).promise;
  return canvas;
}
async function scanPaymentQR(file){
  try{
    if(!await qrCapable()) return null;
    let source;
    if(file.type === 'application/pdf')            source = await pdfFirstPageCanvas(file);
    else if(file.type.startsWith('image/'))        source = await createImageBitmap(file);
    else return null;

    const codes = await new BarcodeDetector({ formats:['qr_code'] }).detect(source);
    if(source.close) source.close();
    for(const c of codes){
      const p = parseEPC(c.rawValue);
      if(p && (p.amount != null || p.creditor)) return p;
    }
  }catch(err){ console.warn('QR-Erkennung übersprungen:', err); }
  return null;
}

/* ==================================================================
   Was ist das ueberhaupt fuer ein Dokument?
   Wird beim Teilen aus einer fremden App gebraucht: Eine Honorarnote,
   ein Kontoauszug und ein ÖGK-Bescheid sehen fuer die App sonst gleich
   aus. Bewusst nur Stichwortgewichtung – kein Modell, keine Cloud.
   ================================================================== */
function klassifiziere(text){
  const t = String(text||'').toLowerCase();
  if(t.length < 20) return { kind:'rechnung', score:0, sicher:false };
  const s = { rechnung:0, zahlungsnachweis:0, oegk_bescheid:0 };
  const hit = (re, k, w) => { if(re.test(t)) s[k] += w; };

  /* ÖGK-Bescheid – Absender und Vorgangsworte */
  hit(/österreichische gesundheitskasse|\bögk\b|gesundheitskasse/, 'oegk_bescheid', 4);
  hit(/kostenerstattung|erstattungsmitteilung|leistungsinformation|mitteilung über/, 'oegk_bescheid', 3);
  hit(/wir haben (ihnen|für sie)|zur anweisung gebracht|überwiesen wurde/, 'oegk_bescheid', 2);
  hit(/ablehnung|abgelehnt|keine kostenerstattung|nicht erstattet/, 'oegk_bescheid', 2);
  hit(/versicherungsnummer|sozialversicherungsnummer/, 'oegk_bescheid', 1);

  /* Zahlungsnachweis – Bank- und Buchungssprache */
  hit(/kontoauszug|umsatzliste|umsatzübersicht|buchungsbestätigung/, 'zahlungsnachweis', 4);
  hit(/zahlungsbestätigung|überweisungsbestätigung|einzahlungsbeleg|zahlungsbeleg/, 'zahlungsnachweis', 4);
  hit(/auftraggeber|empfänger.*iban|valuta|buchungstag|umsatz\b/, 'zahlungsnachweis', 2);
  hit(/betrag dankend erhalten|bezahlt am|zahlungseingang|saldo/, 'zahlungsnachweis', 2);

  /* Rechnung – Rechnungssprache */
  hit(/honorarnote|rechnungsnummer|rechnungs-?nr|beleg-?nr/, 'rechnung', 4);
  hit(/leistungsdatum|behandlungsdatum|ordination|apotheke|zahnarzt/, 'rechnung', 2);
  hit(/zu zahlen|gesamtbetrag|rechnungsbetrag|endbetrag|zahlbar/, 'rechnung', 2);
  hit(/uid-?nr|steuernummer|mwst|ust\b/, 'rechnung', 1);

  const best = Object.keys(s).reduce((a,b)=> s[a] >= s[b] ? a : b);
  return { kind: s[best] > 0 ? best : 'rechnung', score: s[best], sicher: s[best] >= 4, alle: s };
}

/* Welche vorhandene Karte passt zu diesem Dokument?
   Nach Plausibilitaet sortiert – entschieden wird vom Nutzer, weil ein
   ÖGK-Bescheid den Erstattungsbetrag nennt, nicht den Rechnungsbetrag. */
function passendeKarten(kind, result){
  const betrag = result && result.amount;
  const datum  = result && result.date;
  const text   = ((result && result.rawText) || '').toLowerCase();

  return invoices.map(inv=>{
    let p = 0;
    if(inv.status === 'abgeschlossen') p -= 3;
    /* Rolle passt zum Stand des Vorgangs */
    if(kind === 'oegk_bescheid'    && ['oegk_eingereicht','oegk_erstattet'].includes(inv.status)) p += 4;
    if(kind === 'zahlungsnachweis' && inv.status === 'bezahlt') p += 3;
    /* Betrag exakt */
    if(betrag != null && inv.amount !== '' && Math.abs(Number(inv.amount) - betrag) < 0.02) p += 5;
    /* Aussteller taucht im Text auf */
    const titel = String(inv.title||'').toLowerCase().replace(/[^a-zäöüß ]/g,'').trim();
    if(titel.length > 4 && text.includes(titel.split(' ')[0])) p += 3;
    /* Zeitliche Naehe */
    if(datum && inv.date){
      const diff = Math.abs(new Date(datum) - new Date(inv.date)) / 86400000;
      if(diff < 120) p += 2; else if(diff < 365) p += 1;
    }
    /* Diese Rolle fehlt der Karte noch */
    if(!docKinds(inv).has(kind)) p += 2;
    return { inv, p };
  }).filter(x=> x.p > 2).sort((a,b)=> b.p - a.p).slice(0,5);
}

async function analyzeInvoiceFile(file){
  let base = null;
  try{
    if(file.type === 'application/pdf')            base = await analyzePDF(file);
    else if(file.type && file.type.startsWith('image/')) base = await analyzeImage(file);
  }catch(err){ console.error('Analyse fehlgeschlagen:', err); }

  /* QR schlaegt OCR: exakte Werte ueberschreiben geratene. */
  const qr = await scanPaymentQR(file);
  if(qr){
    base = base || { amount:null, date:null, issuer:'', rawText:'' };
    if(qr.amount   != null) base.amount = qr.amount;
    if(qr.creditor)         base.issuer = qr.creditor;
    base.reference = qr.reference || '';
    base.iban      = qr.iban || '';
    base.fromQR    = true;
  }
  return base;
}

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = COLUMNS.map((c,i)=>`
    <button class="tab" role="tab" data-idx="${i}" style="--tc:${c.c}"
            aria-selected="${i===activeCol}">
      ${escapeHTML(c.short)}<span class="n">${invoices.filter(v=>v.status===c.key).length}</span>
    </button>`).join('');
  el.querySelectorAll('.tab').forEach(t=>{
    t.addEventListener('click', ()=> scrollToCol(Number(t.dataset.idx)));
  });
}

let activeCol = 0;
function scrollToCol(idx){
  const board = document.getElementById('board');
  const col = board.children[idx];
  if(!col) return;
  activeCol = idx;
  if(!isDesktop()) board.scrollTo({ left: col.offsetLeft - board.offsetLeft - 12, behavior:'smooth' });
  syncTabs();
}
function syncTabs(){
  document.querySelectorAll('#tabs .tab').forEach(t=>
    t.setAttribute('aria-selected', String(Number(t.dataset.idx) === activeCol)));
}

function renderBoard(){
  const board = document.getElementById('board');
  board.innerHTML = '';
  COLUMNS.forEach((col, idx)=>{
    const items = invoices.filter(i=> i.status === col.key)
                          .sort((a,b)=> (b.updatedAt||'').localeCompare(a.updatedAt||''));
    const colEl = document.createElement('div');
    colEl.className = 'col';
    colEl.style.setProperty('--col-c', col.c);
    colEl.style.setProperty('--col-bg', col.bg);
    colEl.dataset.key = col.key;
    colEl.innerHTML = `
      <div class="col-head"><span>${escapeHTML(col.title)}</span><span class="count">${items.length}</span></div>
      <div class="col-body"></div>
      <div class="col-foot"><button data-add="${col.key}">+ Rechnung hier anlegen</button></div>`;

    const body = colEl.querySelector('.col-body');
    if(items.length === 0) body.innerHTML = `<div class="empty">Noch keine Rechnung hier</div>`;
    else items.forEach(inv=> body.appendChild(renderCard(inv, col)));

    colEl.querySelector('[data-add]').addEventListener('click', ()=> openEditor(null, col.key));

    /* Drag & Drop bleibt als Desktop-Komfort erhalten – auf Touch feuert
       die HTML5-Drag-API keine Events, dort greift der ⇄-Button. */
    ['dragenter','dragover'].forEach(evt=> colEl.addEventListener(evt, e=>{
      e.preventDefault(); colEl.classList.add('dragover');
    }));
    colEl.addEventListener('dragleave', e=>{ if(!colEl.contains(e.relatedTarget)) colEl.classList.remove('dragover'); });
    colEl.addEventListener('drop', async e=>{
      e.preventDefault(); colEl.classList.remove('dragover');
      if(e.dataTransfer.files && e.dataTransfer.files.length){
        for(const file of e.dataTransfer.files) await createInvoiceFromFile(file, col.key);
        await loadAll();
        toast('Rechnung hinzugefügt – wird analysiert …');
      } else {
        const id = e.dataTransfer.getData('text/plain');
        if(id) await moveInvoice(id, col.key);
      }
    });
    board.appendChild(colEl);
  });
  syncTabs();
}

/* Wie lange liegt der Beleg schon bei der jeweiligen Stelle? */
function liegezeit(inv){
  const stamp = inv.status === 'oegk_eingereicht' ? inv.submittedOegkAt
              : inv.status === 'kv_eingereicht'   ? inv.submittedKvAt : null;
  const d = daysSince(stamp);
  if(d === null) return '';
  if(d === 0) return 'heute eingereicht';
  return 'seit ' + d + ' Tag' + (d === 1 ? '' : 'en');
}

/* Eine Zeile pro Karte: entweder was fehlt, oder was als Naechstes ansteht.
   Fehlende Dokumente haben Vorrang – sie blockieren den naechsten Schritt. */
function kartenHinweis(inv){
  const schritt = naechsterSchritt(inv);
  if(!schritt) return '';
  const ziel = schritt.status === 'oegk_eingereicht' ? 'oegk'
             : schritt.status === 'kv_eingereicht'   ? 'kv' : null;
  if(ziel){
    const fehlt = fehlendeDocs(inv, ziel);
    if(fehlt.length){
      return `<span class="nextstep miss">⚠ fehlt: ${escapeHTML(fehlt.map(k=> DOCKINDS[k].kurz).join(', '))}</span>`;
    }
  }
  return `<span class="nextstep">→ ${escapeHTML(schritt.t)}</span>`;
}

      <span class="tags">

        ${(inv.docs||[]).length ? `<span class="file-tag">📎 ${(inv.docs||[]).length}</span>` : ''}
        ${ueberfaellig(inv) ? `<span class="late-tag">🔔 seit ${ueberfaellig(inv)} Tagen – nachfragen</span>`
          : (liegezeit(inv) ? `<span class="wait-tag">⏳ ${liegezeit(inv)}</span>` : '')}
