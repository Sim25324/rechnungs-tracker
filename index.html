/* Board-Scroll haelt die Tabs synchron */
(function(){
  const board = document.getElementById('board');
  let ticking = false;
  board.addEventListener('scroll', ()=>{
    if(ticking || isDesktop()) return;
    ticking = true;
    requestAnimationFrame(()=>{
      const mid = board.scrollLeft + board.clientWidth/2;
      let best = 0, bestD = Infinity;
      [...board.children].forEach((c,i)=>{
        const d = Math.abs((c.offsetLeft - board.offsetLeft) + c.offsetWidth/2 - mid);
        if(d < bestD){ bestD = d; best = i; }
      });
      if(best !== activeCol){ activeCol = best; syncTabs(); }
      ticking = false;
    });
  }, { passive:true });
})();

/* ---------- Datensatz-Operationen ---------- */
async function createInvoiceFromFile(file, status){
  const now = new Date().toISOString();
  const id = uid();
  await dbPut({
    id, title: file.name.replace(/\.[a-z0-9]+$/i,''), amount:'', date: now.slice(0,10), note:'',
    status, weg:'wahlarzt', fileName:file.name, fileType:file.type, fileData: await fileToDataURL(file),
    createdAt:now, updatedAt:now, needsReview:false,
    history:[{ status, at:now, label: colByKey[status].title }]
  });
  analyzeAndFill(id, file);   // laeuft im Hintergrund weiter
  return id;
}
async function analyzeAndFill(id, file){
  const result = await analyzeInvoiceFile(file);
  if(!result) return;
  const current = (await dbAll()).find(i=> i.id === id);
  if(!current) return;
  let changed = false;
  const defaultTitle = file.name.replace(/\.[a-z0-9]+$/i,'');
  if(result.amount != null && (current.amount === '' || current.amount == null)){ current.amount = result.amount; changed = true; }
  if(result.date && !current.date){ current.date = result.date; changed = true; }
  if(result.issuer && current.title === defaultTitle){ current.title = result.issuer; changed = true; }
  if(result.reference && !current.reference){ current.reference = result.reference; changed = true; }
  if(result.iban && !current.iban){ current.iban = result.iban; changed = true; }
  if(result.rechnungsnr && !current.rechnungsnr){ current.rechnungsnr = result.rechnungsnr; changed = true; }
  if(changed){
    current.needsReview = true;
    current.updatedAt = new Date().toISOString();
    await dbPut(current); await loadAll();
    toast('🔍 „' + (current.title || defaultTitle) + '“ analysiert – bitte prüfen');
  }
}
async function moveInvoice(id, newStatus){
  const inv = invoices.find(i=> i.id === id);
  if(!inv || inv.status === newStatus) return;
  inv.status = newStatus;
  inv.updatedAt = new Date().toISOString();
  inv.history = inv.history || [];
  inv.history.push({ status:newStatus, at: inv.updatedAt, label: colByKey[newStatus].title });
  await dbPut(inv); await loadAll();
  /* Mitscrollen: sonst verschwindet die Karte am Handy kommentarlos
     in eine Spalte, die gerade gar nicht sichtbar ist. */
  const idx = COLUMNS.findIndex(c=> c.key === newStatus);
  if(idx >= 0) scrollToCol(idx);
  toast('Verschoben nach: ' + colByKey[newStatus].short);
}
async function deleteInvoice(id){
  if(!confirm('Diese Rechnung wirklich löschen?')) return;
  await dbDelete(id); closeSheet(); await loadAll();
  toast('Rechnung gelöscht');
}

/* ==================================================================
   Beleg an eine fremde App weitergeben (Web Share API Level 2).
   Absichtlich kein Auto-Status: navigator.share() loest bereits auf,
   sobald Android die Datei uebergeben hat – ob du im Kassenformular
   dann wirklich abgeschickt hast, weiss diese App nicht. Deshalb
   fragt sie danach einmal nach, statt es zu behaupten.
   ================================================================== */
function shareSummary(inv){
  return [
    inv.title || 'Rechnung',
    inv.date ? 'Datum: ' + fmtDate(inv.date) : null,
    (inv.amount !== '' && inv.amount != null) ? 'Betrag: ' + fmtEUR(inv.amount) : null,
    inv.reference ? 'Referenz: ' + inv.reference : null,
  ].filter(Boolean).join('\n');
}

/* Dateiname, der im Auswaehler der Kassen-App sofort auffindbar ist:
   nach Datum sortierbar, mit Aussteller und Betrag, ohne Umlaute und
   Sonderzeichen (manche Uploader stolpern darueber). */
function belegDateiname(inv, doc, mitRolle){
  const clean = s => String(s||'')
    .replace(/ä/gi,'ae').replace(/ö/gi,'oe').replace(/ü/gi,'ue').replace(/ß/g,'ss')
    .normalize('NFD').replace(/[̀-ͯ]/g,'')
    .replace(/[^A-Za-z0-9]+/g,'-').replace(/^-+|-+$/g,'').slice(0,40);
  const d      = doc || (inv.docs||[])[0] || { name: inv.fileName, type: inv.fileType, kind:'rechnung' };
  const ext    = (d.name||'').match(/\.[a-z0-9]+$/i);
  const datum  = inv.date || isoLocal(new Date());
  const betrag = (inv.amount !== '' && inv.amount != null && !isNaN(inv.amount) && inv.amount !== 0)
               ? '_' + String(Number(inv.amount).toFixed(2)).replace('.','-') + 'EUR' : '';
  /* Rolle mit in den Namen, sobald mehrere Dateien gleichzeitig
     abgelegt werden – sonst sind sie im Auswaehler nicht zu trennen. */
  const rolle  = mitRolle ? '_' + clean(DOCKINDS[d.kind] ? DOCKINDS[d.kind].kurz : 'Beleg') : '';
  return 'Rechnung_' + datum + '_' + (clean(inv.title) || 'Beleg') + betrag + rolle +
         (ext ? ext[0] : (d.type === 'application/pdf' ? '.pdf' : '.jpg'));
}

function invoiceFile(inv){
  const d = (inv.docs||[]).find(x=> x.kind === 'rechnung') || (inv.docs||[])[0];
  if(!d) throw new Error('kein Dokument');
  return new File([dataURLtoBlob(d.data, d.type)],
                  belegDateiname(inv, d, false), { type: d.type || 'application/octet-stream' });
}

/* Hauptweg: Beleg in Downloads ablegen. Von dort holt ihn der
   Dateiauswaehler der ÖGK- bzw. Versicherungs-App. */
async function saveForUpload(id, targetKey){
  const inv    = invoices.find(i=> i.id === id);
  const target = SEND_TARGETS.find(t=> t.key === targetKey);
  if(!inv || !target) return;

  /* Vollstaendigkeit VOR dem Upload pruefen. Ein fehlender Zahlungs-
     nachweis kostet sonst Wochen, weil die Ablehnung erst spaeter kommt. */
  const fehlt = fehlendeDocs(inv, targetKey);
  if(fehlt.length){ zeigeFehlend(id, target, fehlt); return; }

  const docs = docsFuer(inv, targetKey);
  if(!docs.length){ toast('Keine Dokumente angehängt'); return; }

  const namen = [];
  for(let i = 0; i < docs.length; i++){
    const d = docs[i];
    const name = belegDateiname(inv, d, docs.length > 1);
    let url;
    try{ url = dataURLtoBlobURL(d.data, d.type); }catch(e){ continue; }
    if(!url) continue;
    const a = document.createElement('a');
    a.href = url; a.download = name; a.rel = 'noopener';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=> URL.revokeObjectURL(url), 30000);
    namen.push(name);
    /* Browser drosseln Mehrfach-Downloads – kurz Luft lassen. */
    if(i < docs.length - 1) await new Promise(r=> setTimeout(r, 450));
  }

  await copyToClipboard(shareSummary(inv));
  showUploadSteps(id, target, namen);
}

      setTimeout(()=> URL.revokeObjectURL(url), 30000);

/* Nebenweg: alles, was Teilen tatsaechlich annimmt (Mail, Cloud, Chat). */
async function shareInvoice(id){
  const inv = invoices.find(i=> i.id === id);
  if(!inv || !inv.fileData){ toast('Kein Beleg angehängt'); return; }
  let file;
  try{ file = invoiceFile(inv); }catch(e){ toast('Beleg konnte nicht gelesen werden'); return; }
  if(!(navigator.canShare && navigator.canShare({ files:[file] }))){
    toast('Teilen wird hier nicht unterstützt – nimm „speichern“'); return;
  }
  await copyToClipboard(shareSummary(inv));
  try{ await navigator.share({ files:[file], title: inv.title || 'Rechnung', text: shareSummary(inv) }); }
  catch(err){ if(!err || err.name !== 'AbortError') toast('Teilen abgebrochen'); }
}

    if(d){ d.kind = s.value; renderDocs(); renderBedarf(); }

    renderDocs(); renderBedarf();
  }));

/* Neues Dokument aufnehmen. Rolle wird geraten: das erste ist die
   Rechnung, danach Zahlungsnachweis, sonst Sonstiges. Umstellbar. */
function rateRolle(){
  const have = new Set(pendingDocs.map(d=> d.kind));
  if(!have.has('rechnung'))         return 'rechnung';
  if(!have.has('zahlungsnachweis')) return 'zahlungsnachweis';
  return 'sonstiges';
}

async function setPendingFile(file){
  const doc = { id: uid(), kind: rateRolle(), name: file.name || 'Beleg',
                type: file.type || '', data: await fileToDataURL(file),
                addedAt: new Date().toISOString() };
  pendingDocs.push(doc);
  renderDocs(); renderBedarf();

  /* Analysiert wird nur die Rechnung – ein Zahlungsnachweis hat keine
     Rechnungsdaten und wuerde die Felder mit Unsinn ueberschreiben. */
  if(doc.kind !== 'rechnung') return;

  const statusEl = document.getElementById('analyze-status');
  if(statusEl){ statusEl.className=''; statusEl.textContent = '🔍 Beleg wird lokal analysiert …'; }
  const result = await analyzeInvoiceFile(file);
  const el = document.getElementById('analyze-status');
  if(!el) return;   /* Sheet wurde inzwischen geschlossen */
  if(result && (result.amount != null || result.date || result.issuer)){
    el.className = 'ok';
    el.textContent = result.fromQR
      ? '✓ aus Zahlungs-QR gelesen – exakte Werte'
      : '✓ automatisch erkannt – bitte prüfen';
    const a = document.getElementById('f-amount'), d = document.getElementById('f-date'), t = document.getElementById('f-title');
    /* QR-Werte sind exakt und duerfen ueberschreiben, OCR-Werte nur fuellen. */
    if(a && result.amount != null && (!a.value || result.fromQR)) a.value = result.amount;
    if(d && result.date) d.value = result.date;
    if(t && result.issuer && (!t.value || result.fromQR)) t.value = result.issuer;
    pendingRef  = result.reference || result.rechnungsnr || '';
    pendingIban = result.iban || '';
    const rw = document.getElementById('refWrap');
    if(rw) rw.innerHTML = pendingRef ? `<div class="filechip"><span>🔖</span><span class="nm">Referenz: ${escapeHTML(pendingRef)}</span></div>` : '';
  } else el.textContent = 'Keine automatische Erkennung möglich – bitte manuell ausfüllen.';
}

async function saveEditor(id){
  const title  = document.getElementById('f-title').value.trim() || 'Ohne Bezeichnung';
  const amount = document.getElementById('f-amount').value;
  const date   = document.getElementById('f-date').value;
  const status = document.getElementById('f-status').value;
  const weg    = (document.getElementById('f-weg')||{}).value || 'wahlarzt';
  const eOegk  = document.getElementById('f-eoegk').value;
  const eKv    = document.getElementById('f-ekv').value;
  const ablehnung = document.getElementById('f-abl').value.trim();
  const note   = document.getElementById('f-note').value;
  const now    = new Date().toISOString();

  if(id){
    const inv = invoices.find(i=> i.id === id);
    const statusChanged = inv.status !== status;
    Object.assign(inv, { title, amount, date, note, status, weg, needsReview:false, updatedAt:now,
                         reference: pendingRef, iban: pendingIban,
                         erstattetOegk: eOegk === '' ? null : Number(eOegk),
                         erstattetKv:   eKv   === '' ? null : Number(eKv), ablehnung });
    inv.docs = pendingDocs;
    const haupt = pendingDocs.find(d=> d.kind === 'rechnung') || pendingDocs[0];
    inv.fileName = haupt ? haupt.name : ''; inv.fileType = haupt ? haupt.type : ''; inv.fileData = haupt ? haupt.data : '';
    inv.history = inv.history || [];
    if(statusChanged) inv.history.push({ status, at:now, label: colByKey[status].title });
    await dbPut(inv);
  } else {
    await dbPut({
      id: uid(), title, amount, date, note, status, weg,
      erstattetOegk: eOegk === '' ? null : Number(eOegk),
      erstattetKv:   eKv   === '' ? null : Number(eKv), ablehnung,
      docs: pendingDocs,
      fileName: (pendingDocs[0]||{}).name || '',
      fileType: (pendingDocs[0]||{}).type || '',
      fileData: (pendingDocs[0]||{}).data || '',
      reference: pendingRef, iban: pendingIban,
      createdAt:now, updatedAt:now, needsReview:false,
      history:[{ status, at:now, label: colByKey[status].title }]
    });
  }
  closeSheet(); await loadAll();
  const idx = COLUMNS.findIndex(c=> c.key === status);
  if(idx >= 0) scrollToCol(idx);
  toast('Gespeichert');
}

async function importBackup(e){
  const file = e.target.files[0];
  if(!file) return;
  try{
    const data = JSON.parse(await file.text());
    if(!Array.isArray(data)) throw new Error('Ungültiges Format');
    for(const rec of data) await dbPut(rec);
    closeSheet(); await loadAll();
    toast(data.length + ' Rechnung(en) wiederhergestellt');
  }catch(err){ alert('Import fehlgeschlagen: ' + err.message); }
  e.target.value = '';
}

/* ==================================================================
   Empfang: aus einer anderen App hierher geteilte Belege.
   Der Service Worker hat sie in den Cache 'rt-share' gelegt und auf
   ./?shared=N umgeleitet. Hier abholen, Cache leeren, Karte anlegen.
   ================================================================== */
async function handleSharedFiles(){
  const params = new URLSearchParams(location.search);
  if(!params.has('shared') && !params.has('neu')) return;

  const n = Number(params.get('shared') || 0);
  history.replaceState(null, '', './');       // Query aus der Adresse nehmen

  if(params.has('neu')){ openEditor(null); return; }
  if(!n){ toast('Es kam keine Datei an'); return; }

  let files = [];
  try{
    const cache = await caches.open('rt-share');
    for(const req of await cache.keys()){
      const res  = await cache.match(req);
      if(!res) continue;
      const blob = await res.blob();
      const name = decodeURIComponent(res.headers.get('x-filename') || 'beleg');
      files.push(new File([blob], name, { type: blob.type || res.headers.get('content-type') || '' }));
      await cache.delete(req);
    }
  }catch(err){ console.warn('Geteilte Datei nicht lesbar:', err); }

  if(!files.length){ toast('Es kam keine Datei an'); return; }

  if(files.length === 1){
    await triageGeteiltesDokument(files[0]);
  } else {
    for(const f of files) await createInvoiceFromFile(f, 'bezahlt');
    await loadAll();
    toast(files.length + ' Belege übernommen – werden analysiert …');
  }
}

}

/* ---------- Bilanz: gezahlt gegen zurueckbekommen ---------- */
function bilanzBlock(){
  const praemien = (policy && policy.praemien) || [];
  if(!praemien.length){
    return `<div class="leer klein" style="margin-bottom:12px">
      <p style="margin-bottom:12px">Trage deine Prämie ein, um zu sehen, was du über die Laufzeit
         gezahlt hast – und wie sich das zu den Erstattungen verhält.</p>
      <button class="primary" id="praemBtn">💶 Prämie erfassen</button></div>`;
  }
  const jahr    = new Date().getFullYear();
  const startJ  = Number(praemien.slice().sort((a,b)=> a.ab.localeCompare(b.ab))[0].ab.slice(0,4));
  const gesamtP = praemienSumme(policy);
  const gesamtE = erstattungenGesamt('erstattetKv');
  const jahrP   = praemienImJahr(policy, jahr);
  const jahrE   = erstattungenImJahr(jahr, 'erstattetKv');

  const jahre = [];
  for(let j = startJ; j <= jahr; j++) jahre.push(j);
  const maxWert = Math.max(1, ...jahre.map(j=> Math.max(praemienImJahr(policy,j), erstattungenImJahr(j,'erstattetKv'))));

  /* Praemienentwicklung: erster gegen aktuellen Monatswert */
  const sortiert = praemien.slice().sort((a,b)=> a.ab.localeCompare(b.ab));
  const ersterM  = monatsBetrag(sortiert[0]);
  const aktM     = monatsBetrag(sortiert[sortiert.length-1]);
  const steigung = ersterM > 0 ? Math.round((aktM/ersterM - 1) * 100) : 0;

  return `
    <div class="bilanz">
      <div class="bhead">
        <b>Bilanz seit ${startJ}</b>
        <button class="icon-btn" id="praemBtn" aria-label="Prämien bearbeiten">✎</button>
      </div>
      <div class="bzahlen">
        <div><span class="bl">gezahlt gesamt</span><b class="bp">${fmtEUR(gesamtP)}</b></div>
        <div><span class="bl">erstattet gesamt</span><b class="be">${fmtEUR(gesamtE)}</b></div>
      </div>
      <div class="bzahlen klein">
        <div><span class="bl">${jahr} gezahlt</span><b>${fmtEUR(jahrP)}</b></div>
        <div><span class="bl">${jahr} erstattet</span><b>${fmtEUR(jahrE)}</b></div>
      </div>

      <div class="grouplabel" style="margin:14px 0 8px">Jahr für Jahr</div>
      <div class="jahre">
        ${jahre.slice(-8).map(j=>{
          const p = praemienImJahr(policy,j), e = erstattungenImJahr(j,'erstattetKv');
          return `<div class="jrow">
            <span class="jj">${j}</span>
            <span class="jbars">
              <span class="jb p" style="width:${Math.round(p/maxWert*100)}%"></span>
              <span class="jb e" style="width:${Math.round(e/maxWert*100)}%"></span>
            </span>
            <span class="jw">${fmtEUR(p)} / ${fmtEUR(e)}</span>
          </div>`;
        }).join('')}
      </div>
      <p class="blegende"><span class="dot p"></span>Prämie &nbsp; <span class="dot e"></span>Erstattung</p>

      ${sortiert.length > 1 ? `<div class="bsteigung ${steigung>0?'hoch':''}">
        Prämienentwicklung: ${fmtEUR(ersterM)} → ${fmtEUR(aktM)} im Monat
        ${steigung !== 0 ? `<b>${steigung > 0 ? '+' : ''}${steigung} %</b> seit ${sortiert[0].ab.slice(0,4)}` : ''}
      </div>` : ''}

      <p class="disclaimer" style="margin-top:12px">Diese Gegenüberstellung sagt <b>nicht</b>, ob sich
        die Versicherung lohnt. Du bezahlst Absicherung gegen den teuren Fall, nicht einzelne
        Erstattungen. Aussagekräftig ist sie für eine andere Frage: ob Preis und Deckung noch
        zueinander passen – besonders wenn die Prämie steigt und die Leistungen gleich bleiben.</p>
    </div>
    ${quotenBlock()}`;
}

function quotenBlock(){
  const q = quoteJeWeg();
  const keys = Object.keys(q);
  if(!keys.length) return '';
  return `
    <div class="grouplabel">Erstattungsquote aus deinen Daten</div>
    <div class="quoten">
      ${keys.map(k=>`<div class="qrow">
        <span class="qn">${WEGE[k].icon} ${escapeHTML(WEGE[k].kurz)}</span>
        <span class="qbar"><span style="width:${Math.min(100,q[k].quote)}%"></span></span>
        <span class="qv"><b>${q[k].quote} %</b><span>${q[k].n} Rechnungen</span></span>
      </div>`).join('')}
    </div>
    <p class="hint">Anteil, der von Rechnungsbetrag zurückkam – ÖGK und private Versicherung zusammen.
      Beruht nur auf Rechnungen, bei denen du eine Erstattung eingetragen hast.</p>`;
}

function leistungKarte(l){
  const v    = verbrauchFuer(l, policy, usage);
  const rest = restVon(l, v);
  const limitBekannt = l.limitTyp === 'betrag' || l.limitTyp === 'anzahl';
  const pct  = limitBekannt && l.limit > 0 ? Math.min(100, Math.round(v.genutzt / l.limit * 100)) : 0;
  const kritisch = limitBekannt && pct >= 80;
  const voll     = limitBekannt && pct >= 100;
  const einheit  = l.limitTyp === 'anzahl' ? '' : '€';

  const wert = n => l.limitTyp === 'anzahl' ? n + '×' : fmtEUR(n);

  return `
    <button class="lcard ${voll?'voll':(kritisch?'warn':'')}" data-leistung="${l.id}" type="button">
      <div class="lhead">
        <span class="lic">${l.icon || '📋'}</span>
        <span class="lname">${escapeHTML(l.name)}</span>
        ${voll ? '<span class="lbadge voll">aufgebraucht</span>'
               : (kritisch ? '<span class="lbadge warn">fast aufgebraucht</span>' : '')}
      </div>
      ${limitBekannt ? `
        <div class="lbar"><span style="width:${pct}%"></span></div>
        <div class="lzahlen">
          <span><b>${wert(v.genutzt)}</b> verbraucht</span>
          <span>${rest !== null ? '<b>' + wert(rest) + '</b> übrig' : ''}</span>
        </div>
        <div class="lmeta">Limit ${wert(l.limit)} ${escapeHTML(ZEITRAEUME[l.zeitraum].label)}
          · seit ${fmtDate(v.ab)} · ${v.eintraege.length} Eintrag${v.eintraege.length===1?'':'e'}</div>`
      : `
        <div class="lzahlen"><span><b>${fmtEUR(v.summe)}</b> erfasst</span></div>
        <div class="lmeta">${l.limitTyp === 'prozent'
            ? l.limit + ' % der Kosten werden ersetzt'
            : 'Kein Limit hinterlegt'} · ${escapeHTML(ZEITRAEUME[l.zeitraum].label)}</div>`}
    </button>`;
}

/* ---------- Polizze einlesen ---------- */
async function polizzeEinlesen(file){
  openSheet(`<div class="sheet-head"><h2>Polizze wird gelesen …</h2></div>
    <div class="sheet-body"><p class="hint">Text- und Bilderkennung läuft lokal auf dem Gerät.
      Bei gescannten Polizzen dauert das eine Weile.</p></div>`);

  let text = '';
  try{
    if(file.type === 'application/pdf'){
      const pdfjsLib = await getPdfjs();
      const doc = await pdfjsLib.getDocument({ data: await file.arrayBuffer() }).promise;
      const teile = [];
      for(let p=1; p<=Math.min(doc.numPages, 25); p++){
        const c = await (await doc.getPage(p)).getTextContent();
        let y=null, line=[];
        for(const it of c.items){
          const yy = Math.round(it.transform[5]);
          if(y===null || Math.abs(yy-y)>2){ if(line.length) teile.push(line.join('')); line=[it.str]; y=yy; }
          else line.push(it.str);
        }
        if(line.length) teile.push(line.join(''));
      }
      text = teile.join('\n');
    } else {
      const worker = await getTesseractWorker();
      text = (await worker.recognize(await fileToDataURL(file))).data.text || '';
    }
  }catch(err){ console.error('Polizze nicht lesbar:', err); }

  const vorschlaege = analysierePolizze(text);
  const kopf        = polizzenKopf(text);
  const dataURL     = await fileToDataURL(file);
  zeigePolizzeVorschlaege(vorschlaege, Object.assign(kopf, {
    doc:{ id:uid(), kind:'sonstiges', name:file.name, type:file.type, data:dataURL, addedAt:new Date().toISOString() },
  }));
}

    <div class="sheet-body">

        <b>${vorschlaege.length} Leistung${vorschlaege.length===1?'':'en'} erkannt</b>
        <span>Das ist eine Lesehilfe, keine Vertragsauslegung. Prüfe jeden Eintrag gegen deine

      </div>
      <div class="grouplabel">Vertragsdaten</div>
      <div class="kopfgrid">
        <label>Versicherer<input type="text" id="k-vers" value="${escapeHTML(meta.versicherer||'')}" placeholder="nicht erkannt"></label>
        <label>Polizzennummer<input type="text" id="k-nr" value="${escapeHTML(meta.polizzennr||'')}" placeholder="nicht erkannt"></label>

        <label>Hauptfälligkeit<input type="date" id="k-hf" value="${meta.hauptfaelligkeit||''}"></label>
        <label>Prämie (€)<input type="number" step="0.01" inputmode="decimal" id="k-pbetrag"
          value="${meta.praemie ? meta.praemie.betrag : ''}" placeholder="nicht erkannt"></label>
        <label>Zahlungsweise<select id="k-pint">${Object.keys(INTERVALLE).map(k=>
          `<option value="${k}" ${meta.praemie && meta.praemie.intervall===k ? 'selected':''}>${escapeHTML(INTERVALLE[k].label)}</option>`).join('')}</select></label>
      </div>
      ${meta.praemie ? `<p class="hint">Prämie gelesen aus: „${escapeHTML(meta.praemie.quelle)}“${
        meta.praemie.sicher ? '' : ' – unsicher, bitte prüfen'}</p>`
        : '<p class="hint">Keine Prämie im Text gefunden. Trag sie hier ein, dann rechnet die Bilanz von Anfang an mit.</p>'}
      ${vorschlaege.length ? `
        <div class="grouplabel">Übernehmen</div>
        ${vorschlaege.map((v,i)=>`
          <label class="vorschlag">
            <input type="checkbox" data-v="${i}" ${v.sicher?'checked':''}>
            <span>
              <b>${v.icon} ${escapeHTML(v.name)}</b>
              <span class="vlimit">${v.limitTyp==='betrag' ? 'bis ' + fmtEUR(v.limit)
                : v.limitTyp==='prozent' ? v.limit + ' % der Kosten'
                : v.limitTyp==='anzahl' ? v.limit + '× ' : 'kein Limit erkannt'}
                ${escapeHTML(ZEITRAEUME[v.zeitraum].label)}</span>
              <span class="vquelle">„${escapeHTML(v.quelle)}“</span>
            </span>
          </label>`).join('')}`
        : '<p class="hint">Nichts Verwertbares gefunden. Viele Polizzen sind Scans oder Tabellen – füge die Leistungen aus dem Katalog hinzu.</p>'}
    </div>
    <div class="sheet-foot">
      <button id="vKatalog" class="grow">Aus Katalog wählen</button>
      <button class="primary grow" id="vOk">Übernehmen</button>
    </div>`);

  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
  const speichern = async (auswahl)=>{
    const p = policy || { id: uid(), art:'kranken', versicherer:'', tarif:'', beginn:'', leistungen:[], docs:[], praemien:[] };

    /* Kopfdaten aus den Feldern uebernehmen – der Nutzer hat sie
       gesehen und ggf. korrigiert, also gelten sie. */
    const g = sel => { const el = sheet.querySelector(sel); return el ? el.value.trim() : ''; };
    if(g('#k-vers'))   p.versicherer      = g('#k-vers');
    if(g('#k-nr'))     p.polizzennr       = g('#k-nr');
    if(g('#k-beginn')) p.beginn           = g('#k-beginn');
    if(g('#k-hf'))     p.hauptfaelligkeit = g('#k-hf');

    /* Praemie als ersten Eintrag der Zeitreihe anlegen, ab Vertragsbeginn.
       Nur wenn es noch keine gibt – sonst wuerde ein erneutes Einlesen
       die gepflegte Historie mit Dubletten zumuellen. */
    const pb = Number(g('#k-pbetrag'));
    if(pb > 0 && !(p.praemien||[]).length){
      p.praemien = [{ id: uid(), ab: p.beginn || isoLocal(new Date()),
                      betrag: pb, intervall: g('#k-pint') || 'monatlich' }];
    }

    if(meta.doc)  p.docs = (p.docs||[]).concat([meta.doc]);
    p.leistungen = (p.leistungen||[]).concat(auswahl.map(v=>({
      id: uid(), key:v.key, name:v.name, icon:v.icon,
      limitTyp:v.limitTyp, limit:v.limit, zeitraum:v.zeitraum,
      notiz: [v.notizZusatz, v.quelle].filter(Boolean).join(' — ')
    })));
    await stPut('policies', p);
    closeSheet(); await loadDeckung(); await loadVertraege();
    toast(auswahl.length ? auswahl.length + ' Leistung(en) übernommen' : 'Vertragsdaten gespeichert');
  };
  sheet.querySelector('#vOk').addEventListener('click', ()=>{
    const gewaehlt = [...sheet.querySelectorAll('[data-v]')].filter(c=> c.checked)
                      .map(c=> vorschlaege[Number(c.dataset.v)]);
    speichern(gewaehlt);
  });
  sheet.querySelector('#vKatalog').addEventListener('click', async ()=>{
    await speichern([]);
    openKatalogSheet();
  });

/* ==================================================================
   DRUCK-INFRASTRUKTUR
   Kein PDF-Generator im Bundle: Chrome auf Android bietet im Druck-
   dialog "Als PDF speichern". Das spart eine 300-KB-Bibliothek und
   liefert ein PDF, das der Nutzer selbst benennt und ablegt.
   ================================================================== */
function drucke(html, titel){
  const ziel = document.getElementById('printarea');
  ziel.innerHTML = `<h1 class="p-titel">${escapeHTML(titel)}</h1>` + html +
    `<p class="p-fuss">Erstellt am ${fmtDateTime(new Date().toISOString())} · Rechnungs-Tracker</p>`;
  document.body.classList.add('printing');
  const aufraeumen = ()=>{
    document.body.classList.remove('printing');
    ziel.innerHTML = '';
    window.removeEventListener('afterprint', aufraeumen);
  };
  window.addEventListener('afterprint', aufraeumen);
  setTimeout(()=> window.print(), 120);
  setTimeout(aufraeumen, 60000);   // Fallback, falls afterprint ausbleibt
}
function csvDownload(zeilen, name){
  const esc = v => '"' + String(v==null?'':v).replace(/"/g,'""') + '"';
  const txt = '﻿' + zeilen.map(r=> r.map(esc).join(';')).join('\r\n');
  const url = URL.createObjectURL(new Blob([txt], { type:'text/csv;charset=utf-8' }));
  const a = document.createElement('a');
  a.href = url; a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=> URL.revokeObjectURL(url), 20000);
}

/* ---------- Steuer-Export: selbst getragene Krankheitskosten ---------- */
function steuerJahre(){
  const j = new Set(invoices.map(i=> (i.date||'').slice(0,4)).filter(Boolean));
  return [...j].sort().reverse();
}
function steuerDaten(jahr){
  const rel = invoices.filter(i=> (i.date||'').slice(0,4) === String(jahr))
                      .sort((a,b)=> (a.date||'').localeCompare(b.date||''));
  const rows = rel.map(i=>{
    const betrag = Number(i.amount)||0;
    const zurueck = erstattetGesamt(i);
    return { i, betrag, zurueck, selbst: Math.max(0, betrag - zurueck),
             offen: i.erstattetOegk == null && i.erstattetKv == null };
  });
  return {
    rows,
    summeBetrag: rows.reduce((s,r)=> s + r.betrag, 0),
    summeZurueck: rows.reduce((s,r)=> s + r.zurueck, 0),
    summeSelbst: rows.reduce((s,r)=> s + r.selbst, 0),
    offen: rows.filter(r=> r.offen).length,
  };
}
function openSteuerSheet(){
  const jahre = steuerJahre();
  if(!jahre.length){ toast('Noch keine Rechnungen mit Datum erfasst'); return; }
  let jahr = jahre[0];

  const zeichne = ()=>{
    const d = steuerDaten(jahr);
    sheet.querySelector('#stBody').innerHTML = `
      <div class="bzahlen">
        <div><span class="bl">Rechnungen ${jahr}</span><b>${fmtEUR(d.summeBetrag)}</b></div>
        <div><span class="bl">erstattet</span><b class="be">${fmtEUR(d.summeZurueck)}</b></div>
      </div>
      <div class="steuersumme">
        <span>Selbst getragen ${jahr}</span>
        <b>${fmtEUR(d.summeSelbst)}</b>
      </div>
      ${d.offen ? `<p class="hint" style="color:#92400e">${d.offen} Rechnung(en) ohne erfasste Erstattung –
        die zählen hier voll als selbst getragen. Trag die Erstattung nach, sonst ist die Zahl zu hoch.</p>` : ''}
      <div class="grouplabel">Belege</div>
      <ul class="vliste">
        ${d.rows.map(r=>`<li><span>${fmtDate(r.i.date)} · ${escapeHTML(r.i.title||'Rechnung')}</span>
          <b>${fmtEUR(r.selbst)}</b></li>`).join('') || '<li><span>Keine Rechnungen in diesem Jahr</span></li>'}
      </ul>
      <p class="disclaimer">Krankheitskosten können in Österreich als außergewöhnliche Belastung geltend
        gemacht werden; ob und in welcher Höhe sie sich auswirken, hängt vom Selbstbehalt nach deinem
        Einkommen ab. Diese Aufstellung ist eine Vorarbeit für die Arbeitnehmerveranlagung, keine
        Steuerberatung – ich bin kein Steuerberater. Prüfung und Einreichung bleiben bei dir.</p>`;
  };

  openSheet(`
    <div class="sheet-head"><h2>Steuer-Übersicht</h2>
      <button class="icon-btn" data-close aria-label="Schließen">✕</button></div>
    <div class="sheet-body">
      <div class="field"><label>Jahr</label>

  sheet.querySelector('#stCsv').addEventListener('click', ()=>{
    const d = steuerDaten(jahr);
    csvDownload([
      ['Datum','Bezeichnung','Belegart','Rechnungsbetrag','ÖGK erstattet','Private KV erstattet','Selbst getragen'],
      ...d.rows.map(r=> [r.i.date, r.i.title||'', wegOf(r.i).label,
        (Number(r.i.amount)||0).toFixed(2), (Number(r.i.erstattetOegk)||0).toFixed(2),
        (Number(r.i.erstattetKv)||0).toFixed(2), r.selbst.toFixed(2)]),
      [], ['','','SUMME', d.summeBetrag.toFixed(2), '', '', d.summeSelbst.toFixed(2)],
    ], 'krankheitskosten-' + jahr + '.csv');
  });
  sheet.querySelector('#stPrint').addEventListener('click', ()=>{
    const d = steuerDaten(jahr);
    drucke(`

        Arbeitnehmerveranlagung. Keine Steuerberatung.</p>`,

  zeichne();

/* ---------- Selbstbehalt-Simulation ---------- */
function openSimSheet(){
  const jahre = steuerJahre().slice(0,6).reverse();
  if(!jahre.length){ toast('Noch keine Rechnungen erfasst'); return; }
  let sb = 300, quote = 80;

  const zeichne = ()=>{
    const rows = jahre.map(j=>{
      const d = steuerDaten(j);
      const ist = d.summeZurueck;
      const modell = Math.max(0, (d.summeBetrag - sb)) * quote/100;
      return { j, kosten:d.summeBetrag, ist, modell };
    });
    sheet.querySelector('#simBody').innerHTML = `
      <table class="simtab">
        <tr><th>Jahr</th><th>Kosten</th><th>tatsächlich zurück</th><th>Modell</th><th>Δ</th></tr>
        ${rows.map(r=>`<tr>
          <td>${r.j}</td><td>${fmtEUR(r.kosten)}</td><td>${fmtEUR(r.ist)}</td>
          <td>${fmtEUR(r.modell)}</td>
          <td class="${r.modell-r.ist>=0?'plus':'minus'}">${r.modell-r.ist>=0?'+':''}${fmtEUR(r.modell-r.ist)}</td>
        </tr>`).join('')}
      </table>
      <p class="disclaimer">Stark vereinfachtes Modell: Es zieht den Selbstbehalt einmal pro Jahr von den
        Gesamtkosten ab und wendet einen festen Prozentsatz an. Echte Tarife rechnen je Leistungsart,
        mit Teillimits und Wartezeiten. Die Zahlen taugen als Größenordnung für ein Gespräch,
        nicht als Entscheidungsgrundlage – und ich bin kein Versicherungsberater.</p>`;
  };

  openSheet(`
    <div class="sheet-head"><h2>Was wäre bei anderem Selbstbehalt?</h2>
      <button class="icon-btn" data-close aria-label="Schließen">✕</button></div>
    <div class="sheet-body">
      <div class="row2">
        <div class="field"><label>Selbstbehalt pro Jahr (€)</label>
          <input type="number" inputmode="numeric" id="simSb" value="300"></div>
        <div class="field"><label>Erstattung darüber (%)</label>
          <input type="number" inputmode="numeric" id="simQ" value="80"></div>
      </div>
      <div id="simBody"></div>
    </div>`);
  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
  const upd = ()=>{
    sb    = Number(sheet.querySelector('#simSb').value) || 0;
    quote = Math.min(100, Math.max(0, Number(sheet.querySelector('#simQ').value) || 0));
    zeichne();
  };
  sheet.querySelector('#simSb').addEventListener('input', upd);
  sheet.querySelector('#simQ').addEventListener('input', upd);
  zeichne();
}

/* ==================================================================
   VERTRAGS-COCKPIT
   Alle Polizzen, nicht nur die Krankenversicherung. Der Versicherer
   kennt dein Kuendigungsfenster genau – du sollst es auch kennen.

const VERTRAGSARTEN = {

  haushalt: { label:'Haushalt & Eigenheim', icon:'🏠' },
  kfz:      { label:'Kfz',                  icon:'🚗' },

};
/* Naechster Kuendigungstermin: Hauptfaelligkeit minus Frist. */
function kuendigungsFenster(v){
  if(!v.hauptfaelligkeit) return null;
  const [, m, t] = v.hauptfaelligkeit.split('-').map(Number);
  const heute = new Date();
  let jahr = heute.getFullYear();
  const hf = ()=> new Date(jahr, m-1, t, 12);
  if(hf() < heute) jahr++;
  const stichtag = new Date(jahr, m-1, t, 12);
  stichtag.setMonth(stichtag.getMonth() - (Number(v.kuendigungsfrist)||3));
  const tage = Math.ceil((stichtag - heute) / 86400000);
  return { stichtag, tage, hauptfaellig: new Date(jahr, m-1, t, 12) };
}

let vertraege = [];
async function loadVertraege(){
  vertraege = await stAll('policies');
  renderVertraege();
  updateChancenZaehler();
}
function renderVertraege(){
  const el = document.getElementById('vertraege');
  const sortiert = vertraege.slice().sort((a,b)=>{
    const fa = kuendigungsFenster(a), fb = kuendigungsFenster(b);
    return (fa ? fa.tage : 99999) - (fb ? fb.tage : 99999);
  });
  el.innerHTML = `
    ${sortiert.length ? sortiert.map(v=>{
      const art = VERTRAGSARTEN[v.art || 'kranken'];
      const f   = kuendigungsFenster(v);
      const dringend = f && f.tage <= 60 && f.tage >= 0;
      const monat = (v.praemien||[]).length
        ? monatsBetrag((v.praemien||[]).slice().sort((a,b)=> b.ab.localeCompare(a.ab))[0]) : null;
      return `
      <button class="vcard ${dringend?'dringend':''}" data-vertrag="${v.id}" type="button">
        <div class="vhead"><span class="lic">${art.icon}</span>
          <span class="lname">${escapeHTML(v.versicherer || art.label)}</span>
          ${monat != null ? `<span class="vpraemie">${fmtEUR(monat)}/Mon.</span>` : ''}</div>
        <div class="lmeta">${escapeHTML(art.label)}${v.tarif ? ' · ' + escapeHTML(v.tarif) : ''}</div>
        ${f ? `<div class="vfrist ${dringend?'an':''}">
            Kündigung bis <b>${fmtDate(isoLocal(f.stichtag))}</b>
            ${f.tage >= 0 ? `· noch ${f.tage} Tage` : ''}
            · Hauptfälligkeit ${fmtDate(isoLocal(f.hauptfaellig))}
          </div>` : '<div class="lmeta">Keine Hauptfälligkeit hinterlegt</div>'}
      </button>`;
    }).join('') : `<div class="leer"><div class="leer-ic">📄</div>
        <h2>Noch keine Verträge</h2>
        <p>Erfasse deine Polizzen mit Hauptfälligkeit und Kündigungsfrist. Die App warnt dich,
           bevor das Kündigungsfenster zugeht – daran erinnert dich sonst niemand.</p></div>`}
    <div class="statuslist" style="margin-top:12px">
      <button type="button" id="vNeu" style="--sc:#2563eb;--sbg:#eff6ff">➕ Vertrag hinzufügen</button>
    </div>`;
  el.querySelector('#vNeu').addEventListener('click', ()=> openVertragSheet(null));
  el.querySelectorAll('[data-vertrag]').forEach(b=>
    b.addEventListener('click', ()=> openVertragSheet(b.dataset.vertrag)));
}
function openVertragSheet(id){
  const v = id ? vertraege.find(x=> x.id === id)
              : { id:uid(), art:'sonstige', versicherer:'', tarif:'', polizzennr:'',
                  hauptfaelligkeit:'', kuendigungsfrist:3, leistungen:[], docs:[], praemien:[] };
  if(!v) return;
  openSheet(`
    <div class="sheet-head"><h2>${id ? 'Vertrag' : 'Neuer Vertrag'}</h2>
      <button class="icon-btn" data-close aria-label="Schließen">✕</button></div>
    <div class="sheet-body">
      <div class="field"><label>Art</label>
        <select id="v-art">${Object.keys(VERTRAGSARTEN).map(k=>
          `<option value="${k}" ${k===(v.art||'sonstige')?'selected':''}>${VERTRAGSARTEN[k].icon} ${escapeHTML(VERTRAGSARTEN[k].label)}</option>`).join('')}</select></div>
      <div class="field"><label>Versicherer</label>
        <input type="text" id="v-vers" value="${escapeHTML(v.versicherer||'')}" placeholder="z. B. Generali"></div>
      <div class="row2">
        <div class="field"><label>Tarif</label>
          <input type="text" id="v-tarif" value="${escapeHTML(v.tarif||'')}"></div>
        <div class="field"><label>Polizzennummer</label>
          <input type="text" id="v-nr" value="${escapeHTML(v.polizzennr||'')}"></div>
      </div>
      <div class="row2">
        <div class="field"><label>Hauptfälligkeit</label>
          <input type="date" id="v-hf" value="${v.hauptfaelligkeit||''}"></div>
        <div class="field"><label>Kündigungsfrist (Monate)</label>
          <input type="number" inputmode="numeric" id="v-kf" value="${v.kuendigungsfrist||3}"></div>
      </div>
      <p class="hint">Die Kündigungsfrist steht in den Bedingungen – bei Sachversicherungen meist
        ein bis drei Monate vor der Hauptfälligkeit.</p>
      ${(v.art||'') === 'kranken' ? '<p class="hint">Diese Polizze wird auch im Bereich Deckung verwendet.</p>' : ''}
    </div>
    <div class="sheet-foot">
      ${id ? '<button class="danger" id="vDel">Löschen</button>' : ''}
      <button class="primary grow" id="vSave">Speichern</button>
    </div>`);
  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
  sheet.querySelector('#vSave').addEventListener('click', async ()=>{
    v.art              = sheet.querySelector('#v-art').value;
    v.versicherer      = sheet.querySelector('#v-vers').value.trim();
    v.tarif            = sheet.querySelector('#v-tarif').value.trim();
    v.polizzennr       = sheet.querySelector('#v-nr').value.trim();
    v.hauptfaelligkeit = sheet.querySelector('#v-hf').value;
    v.kuendigungsfrist = Number(sheet.querySelector('#v-kf').value) || 3;
    await stPut('policies', v);
    closeSheet(); await loadVertraege(); await loadDeckung(); toast('Gespeichert');
  });
  const d = sheet.querySelector('#vDel');
  if(d) d.addEventListener('click', async ()=>{
    if(!confirm('Diesen Vertrag löschen? Erfasste Leistungen und Prämien gehen mit verloren.')) return;
    await stDel('policies', v.id);
    closeSheet(); await loadVertraege(); await loadDeckung(); toast('Gelöscht');
  });
}

/* ==================================================================
   CHANCEN-ANSICHT
   ================================================================== */
async function loadChancen(){
  if(!policy && !vertraege.length){
    const pols = await stAll('policies');
    policy     = pols.find(p=> (p.art||'kranken') === 'kranken') || null;
    leistungen = policy ? (policy.leistungen||[]) : [];
    usage      = await stAll('usage');
    vertraege  = pols;
  }
  renderChancen();
}

function renderChancen(){
  const el = document.getElementById('chancen');
  const h  = chancenHinweise();

  el.innerHTML = `
    <div class="chintro">
      <b>Was steht dir zu, das gerade liegen bleibt?</b>
      <span>Versicherer werten laufend aus, welche Leistungen du nicht abrufst.
        Diese Seite dreht das um: Sie zeigt, was aus deiner erfassten Polizze noch offen ist
        und wo Fristen laufen.</span>
    </div>

    <div class="grouplabel">Ich habe gerade …
      <button class="info-btn" data-info="chancen" aria-label="Wie ist das gemeint?">i</button></div>
    <div class="anlassgrid">
      ${ANLAESSE.map(a=>`<button type="button" class="anlass" data-anlass="${a.key}">
        <span class="aic">${a.icon}</span><span>${escapeHTML(a.label)}</span></button>`).join('')}
    </div>

    <div class="grouplabel">Hinweise aus deinen Daten ${h.length ? `<span class="cnt">${h.length}</span>` : ''}</div>
    ${h.length ? h.map((x,i)=>`
      <div class="hinweis ${x.stufe}" data-hin="${i}">
        <span class="hic">${x.icon}</span>
        <span class="hmain"><b>${escapeHTML(x.titel)}</b><span>${escapeHTML(x.text)}</span></span>
        ${x.ziel ? '<span class="hgo">›</span>' : ''}
      </div>`).join('')
      : `<p class="hint">Nichts offen – oder es sind noch zu wenig Daten erfasst.
         Trag Polizze, Leistungstöpfe und Verträge ein, dann wird diese Liste nützlich.</p>`}

    <p class="disclaimer">Diese Hinweise beziehen sich ausschließlich auf <b>Verwaltung und Fristen</b>.
      Sie sagen nichts darüber, ob eine Behandlung medizinisch sinnvoll oder nötig ist – das entscheidet
      ärztlich. Und ob eine Leistung tatsächlich gedeckt ist, steht in deiner Polizze, nicht hier.</p>`;

  el.querySelectorAll('[data-anlass]').forEach(b=>
    b.addEventListener('click', ()=> openAnlassSheet(b.dataset.anlass)));
  el.querySelectorAll('[data-hin]').forEach(b=> b.addEventListener('click', ()=>{
    const x = h[Number(b.dataset.hin)];
    if(!x || !x.ziel) { if(x && x.aktion === 'vertrag') setView('vertraege'); return; }
    if(x.aktion === 'rechnung'){ setView('rechnungen'); openEditor(x.ziel); }
    if(x.aktion === 'leistung'){ setView('deckung');    setTimeout(()=> openLeistungSheet(x.ziel), 120); }
    if(x.aktion === 'vertrag'){  setView('vertraege');  setTimeout(()=> openVertragSheet(x.ziel), 120); }
  }));
}

function openAnlassSheet(key){
  const a = ANLAESSE.find(x=> x.key === key);
  if(!a) return;
  const t = anlassTreffer(a);

  openSheet(`
    <div class="sheet-head"><h2>${a.icon} ${escapeHTML(a.label)}</h2>
      <button class="icon-btn" data-close aria-label="Schließen">✕</button></div>
    <div class="sheet-body">
      ${a.dringend ? `<div class="eilig">⏱ <b>Hier zählt Tempo.</b> Bei Unfällen verlangen viele Polizzen
        die Meldung binnen weniger Tage. Erst melden, dann alles Weitere.</div>` : ''}

      <div class="grouplabel">Was du erfasst hast und was noch frei ist</div>
      ${t.meine.length ? t.meine.map(l=>{
        const v = verbrauchFuer(l, policy, usage);
        const rest = restVon(l, v);
        return `<div class="chtopf">
          <span class="lic">${l.icon||'📋'}</span>
          <span class="hmain"><b>${escapeHTML(l.name)}</b>
            <span>${rest !== null
              ? (l.limitTyp === 'anzahl' ? rest + '× frei von ' + l.limit + '×'
                                         : fmtEUR(rest) + ' frei von ' + fmtEUR(l.limit))
              : (l.limitTyp === 'prozent' ? l.limit + ' % der Kosten gedeckt' : 'ohne Limit erfasst')}
              · ${escapeHTML(ZEITRAEUME[l.zeitraum].label)}</span></span>
          <button type="button" class="docbtn" data-topf="${l.id}" aria-label="Öffnen">›</button>
        </div>`;
      }).join('') : '<p class="hint">Zu diesem Anlass hast du noch keine passenden Leistungen erfasst.</p>'}

      ${t.vertr.length ? `<div class="grouplabel">Betroffene Verträge</div>
        ${t.vertr.map(v=>`<div class="chtopf"><span class="lic">${VERTRAGSARTEN[v.art].icon}</span>
          <span class="hmain"><b>${escapeHTML(v.versicherer || VERTRAGSARTEN[v.art].label)}</b>
          <span>${escapeHTML(VERTRAGSARTEN[v.art].label)}</span></span></div>`).join('')}` : ''}

      ${t.fehlend.length ? `<div class="grouplabel">Wäre hier relevant, fehlt aber</div>
        <p class="hint">${t.fehlend.map(k=> k.icon + ' ' + escapeHTML(k.name)).join(' · ')}<br>
        Falls deine Polizze das abdeckt, ergänze es unter Deckung – sonst rechnet die App ohne.</p>` : ''}

      <div class="grouplabel">Woran es meistens scheitert</div>
      <ol class="steps">${a.schritte.map(s=> `<li>${escapeHTML(s)}</li>`).join('')}</ol>

      <p class="disclaimer">Administrative Hinweise, keine medizinische Beratung. Ob eine Behandlung
        angezeigt ist, klärst du ärztlich; ob sie gedeckt ist, steht in deiner Polizze.</p>
    </div>
    <div class="sheet-foot">
      <button class="primary grow" id="anRechnung">Rechnung dafür anlegen</button>
    </div>`);

  sheet.querySelector('[data-close]').addEventListener('click', closeSheet);
  sheet.querySelectorAll('[data-topf]').forEach(b=> b.addEventListener('click', ()=>{
    const id = b.dataset.topf; closeSheet(); setView('deckung');
    setTimeout(()=> openLeistungSheet(id), 120);
  }));
  sheet.querySelector('#anRechnung').addEventListener('click', ()=>{
    closeSheet(); setView('rechnungen'); openEditor(null);
  });
}

/* Zaehler in der Navigation und Banner in der Rechnungsansicht */
function updateChancenZaehler(){
  const h = (policy || vertraege.length) ? chancenHinweise() : [];
  const dringend = h.filter(x=> x.stufe === 'hoch').length;
  const btn = document.querySelector('.mainbtn[data-view="chancen"]');
  if(btn){
    let b = btn.querySelector('.navcnt');
    if(h.length){
      if(!b){ b = document.createElement('span'); b.className = 'navcnt'; btn.appendChild(b); }
      b.textContent = h.length;
      b.classList.toggle('hoch', dringend > 0);
    } else if(b) b.remove();
  }
  const banner = document.getElementById('chancenBanner');
  if(banner){
    if(dringend){
      banner.hidden = false;
      banner.innerHTML = `<span>💡 ${dringend} ${dringend===1?'Sache ist':'Sachen sind'} dringend – Fristen oder verfallende Leistungen</span><span class="hgo">›</span>`;
    } else banner.hidden = true;
  }
}

/* ---------- Ansichtswechsel ---------- */
let currentView = 'rechnungen';
function setView(v){
  currentView = v;
  document.getElementById('view-rechnungen').hidden = (v !== 'rechnungen');
  document.getElementById('view-deckung').hidden    = (v !== 'deckung');
  document.getElementById('view-vertraege').hidden  = (v !== 'vertraege');
  document.getElementById('view-chancen').hidden    = (v !== 'chancen');
  document.getElementById('btnAdd').hidden      = (v !== 'rechnungen');
  document.getElementById('btnLeistung').hidden = (v !== 'deckung');
  document.querySelectorAll('.mainbtn').forEach(b=>
    b.setAttribute('aria-selected', String(b.dataset.view === v)));
  if(v === 'deckung')   loadDeckung();
  if(v === 'vertraege') loadVertraege();
  if(v === 'chancen')   loadChancen();
}
document.querySelectorAll('.mainbtn').forEach(b=>
  b.addEventListener('click', ()=> setView(b.dataset.view)));
document.getElementById('chancenBanner').addEventListener('click', ()=> setView('chancen'));
document.getElementById('btnLeistung').addEventListener('click', ()=>{
  if(!policy){ toast('Erst Polizze anlegen'); return; }
  openKatalogSheet();
});

openDB().then(loadAll).then(handleSharedFiles);

/* ---------- Service Worker inklusive Update-Hinweis ----------
   Laeuft nur unter https:// oder localhost. Meldet sich ein neuer
   Service Worker an, erscheint unten ein Banner statt eines stillen
   Wechsels – so bekommt das Handy neue Versionen ohne Handarbeit. */
if('serviceWorker' in navigator){
  window.addEventListener('load', async ()=>{
    try{
      const reg = await navigator.serviceWorker.register('./sw.js');
      const showUpdate = ()=> document.getElementById('updatebar').classList.add('show');

      /* Zwei Faelle, beide noetig: der neue Worker kann schon fertig
         installiert warten, bevor dieser Code laeuft (dann feuert
         'updatefound' nie mehr), oder er installiert erst danach. */
      if(reg.waiting && navigator.serviceWorker.controller) showUpdate();
      reg.addEventListener('updatefound', ()=>{
        const nw = reg.installing;
        if(!nw) return;
        nw.addEventListener('statechange', ()=>{
          if(nw.state === 'installed' && navigator.serviceWorker.controller) showUpdate();
        });
      });
      document.addEventListener('visibilitychange', ()=>{
        if(document.visibilityState === 'visible') reg.update().catch(()=>{});
      });
    }catch(err){ console.warn('Service Worker nicht registriert:', err); }
  });
  let reloading = false;
  navigator.serviceWorker.addEventListener('controllerchange', ()=>{
    if(reloading) return; reloading = true; location.reload();
  });
}
document.getElementById('btnUpdate').addEventListener('click', ()=>{
  document.getElementById('updatebar').classList.remove('show');
  navigator.serviceWorker.getRegistration().then(reg=>{
    if(reg && reg.waiting) reg.waiting.postMessage('skipWaiting');
    else location.reload();
  });
});
</script>
